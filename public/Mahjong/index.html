<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Titan Solitaire Mobile & Tablet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Serif+JP:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle, #1e4d2b 0%, #0d2814 100%);
            --board-border: #0a1f10;
            --tile-bg: linear-gradient(145deg, #fffef9, #ede6d3);
            --tile-side: #c2b280;
            --tile-bottom: #8b7d52;
            --tile-text: #1a1a1a;
            --tile-border: #d4c59a;
            --tile-shadow: rgba(0, 0, 0, 0.45);
            --tile-hover: #fff8dc;
            --tile-selected: #ffe680;
            --tile-hint: #a8efff;
            --accent-color: #e6b800;
            --ui-bg: rgba(13, 40, 20, 0.9);
            --ui-text: #f3f4f6;
            --ui-border: rgba(230, 184, 0, 0.35);
        }

        body.theme-dark {
            --bg-gradient: radial-gradient(circle, #121826 0%, #050811 100%);
            --board-border: #00f2fe;
            --tile-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --tile-side: #0284c7;
            --tile-bottom: #0369a1;
            --tile-text: #38bdf8;
            --tile-border: #38bdf8;
            --tile-shadow: rgba(0, 242, 254, 0.25);
            --tile-hover: #1e3a8a;
            --tile-selected: #0284c7;
            --tile-hint: #f43f5e;
            --accent-color: #38bdf8;
            --ui-bg: rgba(15, 23, 42, 0.92);
            --ui-text: #f1f5f9;
            --ui-border: rgba(56, 189, 248, 0.4);
        }

        body.theme-minimal {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --board-border: #cbd5e1;
            --tile-bg: #ffffff;
            --tile-side: #cbd5e1;
            --tile-bottom: #94a3b8;
            --tile-text: #334155;
            --tile-border: #e2e8f0;
            --tile-shadow: rgba(148, 163, 184, 0.3);
            --tile-hover: #f8fafc;
            --tile-selected: #e0e7ff;
            --tile-hint: #fef08a;
            --accent-color: #6366f1;
            --ui-bg: rgba(255, 255, 255, 0.92);
            --ui-text: #1e293b;
            --ui-border: rgba(99, 102, 241, 0.25);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--ui-text);
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.4s ease;
        }

        .title-font { font-family: 'Cinzel', serif; }
        .kanji-font { font-family: 'Noto Serif JP', serif; }

        /* Responsive board viewport scaling */
        .board-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .board-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .board-viewport {
            position: relative;
            transform-style: preserve-3d;
            margin: 0 auto;
        }

        .tile {
            position: absolute;
            width: 44px;
            height: 58px;
            border-radius: 6px;
            background: var(--tile-bg);
            border: 1px solid var(--tile-border);
            box-shadow: 
                -2px 2px 0px var(--tile-side),
                -4px 4px 0px var(--tile-bottom),
                -5px 5px 8px var(--tile-shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
            transform-origin: center center;
            z-index: 1;
        }

        @media (min-width: 640px) {
            .tile {
                width: 52px;
                height: 68px;
                border-radius: 7px;
            }
        }

        @media (min-width: 1024px) {
            .tile {
                width: 62px;
                height: 82px;
                border-radius: 9px;
            }
        }

        .tile:active:not(.blocked), .tile:hover:not(.blocked) {
            transform: translateY(-3px) translateZ(8px) scale(1.04);
            background: var(--tile-hover);
            z-index: 999 !important;
        }

        .tile.selected {
            background: var(--tile-selected) !important;
            border-color: var(--accent-color);
            transform: translateY(-5px) translateZ(14px) scale(1.06);
            box-shadow: 0 0 12px var(--accent-color), -3px 3px 0px var(--tile-side), -5px 5px 10px var(--tile-shadow);
            z-index: 1000 !important;
        }

        .tile.hinted {
            animation: pulse-hint 1.2s infinite ease-in-out;
            border-color: #00f2fe;
            z-index: 998 !important;
        }

        @keyframes pulse-hint {
            0%, 100% { box-shadow: 0 0 5px var(--tile-hint), -3px 3px 0px var(--tile-side); }
            50% { box-shadow: 0 0 18px var(--tile-hint), 0 0 26px var(--tile-hint), -3px 3px 0px var(--tile-side); }
        }

        .tile.blocked {
            cursor: not-allowed;
            opacity: 0.92;
        }

        .tile.blocked::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            border-radius: inherit;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ui-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .btn-action {
            transition: all 0.15s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--ui-border);
        }

        .btn-action:active:not(:disabled) {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Custom scrollbar for dropdown menus on mobile */
        select {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(130, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playMatch() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(523.25, now);
                osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);

                osc2.frequency.setValueAtTime(659.25, now + 0.08);
                osc2.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now + 0.08);
                osc1.stop(now + 0.15);
                osc2.stop(now + 0.25);
            }

            playError() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.15);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.15);
            }

            playWin() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);

                    gain.gain.setValueAtTime(0.25, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.3);
                });
            }
        }

        const soundEngine = new SoundEngine();

        const TILE_TYPES = {
            BAMBOO: 'bamboo',
            CIRCLES: 'circles',
            CHARACTERS: 'characters',
            WINDS: 'winds',
            DRAGONS: 'dragons',
            SEASONS: 'seasons',
            FLOWERS: 'flowers'
        };

        function generateTileCatalog() {
            const catalog = [];

            for (let i = 1; i <= 9; i++) {
                for (let c = 0; c < 4; c++) {
                    catalog.push({
                        type: TILE_TYPES.BAMBOO,
                        value: i,
                        key: `bamboo-${i}`,
                        label: `${i} Bambou`,
                        icon: getBambooIcon(i),
                        color: '#15803d'
                    });
                }
            }

            for (let i = 1; i <= 9; i++) {
                for (let c = 0; c < 4; c++) {
                    catalog.push({
                        type: TILE_TYPES.CIRCLES,
                        value: i,
                        key: `circle-${i}`,
                        label: `${i} Cercle`,
                        icon: getCircleIcon(i),
                        color: '#b91c1c'
                    });
                }
            }

            const kanjiNumbers = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
            for (let i = 1; i <= 9; i++) {
                for (let c = 0; c < 4; c++) {
                    catalog.push({
                        type: TILE_TYPES.CHARACTERS,
                        value: i,
                        key: `char-${i}`,
                        label: `${i} Caractère`,
                        kanji: kanjiNumbers[i - 1],
                        subKanji: '萬',
                        color: '#c2410c'
                    });
                }
            }

            const winds = [
                { val: 1, name: 'Est', kanji: '東' },
                { val: 2, name: 'Sud', kanji: '南' },
                { val: 3, name: 'Ouest', kanji: '西' },
                { val: 4, name: 'Nord', kanji: '北' }
            ];
            winds.forEach(w => {
                for (let c = 0; c < 4; c++) {
                    catalog.push({
                        type: TILE_TYPES.WINDS,
                        value: w.val,
                        key: `wind-${w.val}`,
                        label: `Vent ${w.name}`,
                        kanji: w.kanji,
                        color: '#0284c7'
                    });
                }
            });

            const dragons = [
                { val: 1, name: 'Rouge', kanji: '中', color: '#dc2626' },
                { val: 2, name: 'Vert', kanji: '發', color: '#16a34a' },
                { val: 3, name: 'Blanc', kanji: '白', color: '#2563eb' }
            ];
            dragons.forEach(d => {
                for (let c = 0; c < 4; c++) {
                    catalog.push({
                        type: TILE_TYPES.DRAGONS,
                        value: d.val,
                        key: `dragon-${d.val}`,
                        label: `Dragon ${d.name}`,
                        kanji: d.kanji,
                        color: d.color
                    });
                }
            });

            const seasons = [
                { val: 1, name: 'Printemps', kanji: '春', emoji: '🌸' },
                { val: 2, name: 'Été', kanji: '夏', emoji: '☀️' },
                { val: 3, name: 'Automne', kanji: '秋', emoji: '🍁' },
                { val: 4, name: 'Hiver', kanji: '冬', emoji: '❄️' }
            ];
            seasons.forEach(s => {
                catalog.push({
                    type: TILE_TYPES.SEASONS,
                    value: s.val,
                    key: `season-any`,
                    label: `Saison: ${s.name}`,
                    kanji: s.kanji,
                    emoji: s.emoji,
                    color: '#d97706'
                });
            });

            const flowers = [
                { val: 1, name: 'Prunier', kanji: '梅', emoji: '🌺' },

        function ensureExact144Tiles(pos) {
            if (pos.length > 144) {
                return pos.slice(0, 144);
            }
            let i = 0;
            while (pos.length < 144) {
                const source = pos[i % pos.length];
                pos.push({ x: source.x, y: source.y, z: source.z + 1 });
                i++;
            }
            return pos;
        }

        function generateSolvableBoard(positions) {
            const numTiles = positions.length;
            const tileCatalog = generateTileCatalog();
            
            const tilePairs = [];
            for (let i = 0; i < tileCatalog.length; i += 2) {
                tilePairs.push([tileCatalog[i], tileCatalog[i + 1]]);
            }

            for (let i = tilePairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tilePairs[i], tilePairs[j]] = [tilePairs[j], tilePairs[i]];
            }

            const grid = positions.map((p, idx) => ({
                id: idx,
                x: p.x,
                y: p.y,
                z: p.z,
                tile: null
            }));

            let remainingGrid = [...grid];
            const assignedTiles = new Array(numTiles);
            let pairIndex = 0;

            while (remainingGrid.length > 0) {
                const freePositions = remainingGrid.filter(pos => isPositionFreeInGrid(pos, remainingGrid));

                if (freePositions.length < 2) {
                    if (remainingGrid.length >= 2) {
                        const p1 = remainingGrid.pop();
                        const p2 = remainingGrid.pop();
                        const pair = tilePairs[pairIndex++] || tilePairs[0];
                        assignedTiles[p1.id] = { ...p1, ...pair[0] };
                        assignedTiles[p2.id] = { ...p2, ...pair[1] };
                    } else break;
                } else {
                    const idx1 = Math.floor(Math.random() * freePositions.length);
                    let idx2 = Math.floor(Math.random() * freePositions.length);
                    while (idx1 === idx2 && freePositions.length > 1) {
                        idx2 = Math.floor(Math.random() * freePositions.length);
                    }

                    const pos1 = freePositions[idx1];
                    const pos2 = freePositions[idx2];
                    const pair = tilePairs[pairIndex++] || tilePairs[0];

                    assignedTiles[pos1.id] = { ...pos1, ...pair[0] };
                    assignedTiles[pos2.id] = { ...pos2, ...pair[1] };

                    remainingGrid = remainingGrid.filter(p => p.id !== pos1.id && p.id !== pos2.id);
                }
            }

            return assignedTiles;
        }

        function isPositionFreeInGrid(target, allTiles) {
            const blockedAbove = allTiles.some(other => 
                other.z === target.z + 1 &&
                Math.abs(other.x - target.x) < 2 &&
                Math.abs(other.y - target.y) < 2
            );

            if (blockedAbove) return false;

            const blockedLeft = allTiles.some(other =>
                other.z === target.z &&
                other.x === target.x - 2 &&
                Math.abs(other.y - target.y) < 2
            );

            const blockedRight = allTiles.some(other =>
                other.z === target.z &&
                other.x === target.x + 2 &&
                Math.abs(other.y - target.y) < 2
            );

            return !(blockedLeft && blockedRight);
        }

        function isTileFree(tile, activeTiles) {
            return isPositionFreeInGrid(tile, activeTiles);
        }

        function doTilesMatch(tileA, tileB) {
            if (!tileA || !tileB || tileA.id === tileB.id) return false;

            if (tileA.key === tileB.key) return true;
            if (tileA.type === TILE_TYPES.SEASONS && tileB.type === TILE_TYPES.SEASONS) return true;
            if (tileA.type === TILE_TYPES.FLOWERS && tileB.type === TILE_TYPES.FLOWERS) return true;

            return false;
        }

        class MahjongGame {
            constructor() {
                this.activeTiles = [];
                this.selectedTile = null;
                this.historyStack = [];
                this.timerSeconds = 0;
                this.timerInterval = null;
                this.movesCount = 0;
                this.currentLayout = 'turtle';
                this.currentTheme = 'classic';
                this.zoomScale = 1.0;

                this.domContainer = document.getElementById('board-container');
                this.domWrapper = document.getElementById('board-wrapper');
                this.domViewport = document.getElementById('board-viewport');

                this.domTilesCount = document.getElementById('tiles-count');
                this.domMovesCount = document.getElementById('moves-count');
                this.domTimer = document.getElementById('timer-display');

                this.domTilesCountMobile = document.getElementById('tiles-count-mobile');
                this.domMovesCountMobile = document.getElementById('moves-count-mobile');
                this.domTimerMobile = document.getElementById('timer-display-mobile');

                this.initEvents();
            }

            initEvents() {
                document.getElementById('layout-select').addEventListener('change', (e) => {
                    this.currentLayout = e.target.value;
                    this.startNewGame();
                });

                document.getElementById('theme-select').addEventListener('change', (e) => {
                    this.setTheme(e.target.value);
                });

                document.getElementById('btn-sound').addEventListener('click', () => {
                    soundEngine.muted = !soundEngine.muted;
                    document.getElementById('btn-sound').innerText = soundEngine.muted ? '🔇' : '🔊';
                });

                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                    }
                });

                document.getElementById('btn-undo').addEventListener('click', () => this.undoMove());
                document.getElementById('btn-hint').addEventListener('click', () => this.showHint());
                document.getElementById('btn-shuffle').addEventListener('click', () => this.shuffleRemaining());
                document.getElementById('btn-restart').addEventListener('click', () => this.startNewGame());

                document.getElementById('btn-zoom-in').addEventListener('click', () => this.adjustZoom(0.15));
                document.getElementById('btn-zoom-out').addEventListener('click', () => this.adjustZoom(-0.15));
                document.getElementById('btn-zoom-reset').addEventListener('click', () => this.resetZoom());

                document.getElementById('modal-btn-primary').addEventListener('click', () => {
                    this.hideModal();
                    this.startNewGame();
                });

                window.addEventListener('resize', () => {
                    this.fitBoardToContainer();
                });

                window.addEventListener('orientationchange', () => {
                    setTimeout(() => this.fitBoardToContainer(), 200);
                });
            }

            setTheme(theme) {
                this.currentTheme = theme;
                document.body.className = `theme-${theme} flex flex-col h-screen w-screen overflow-hidden`;
            }

            adjustZoom(delta) {
                this.zoomScale = Math.min(Math.max(0.5, this.zoomScale + delta), 2.0);
                this.applyBoardTransform();
            }

            resetZoom() {
                this.zoomScale = 1.0;
                this.fitBoardToContainer();
            }

            startNewGame() {
                this.stopTimer();
                this.timerSeconds = 0;
                this.movesCount = 0;
                this.historyStack = [];
                this.selectedTile = null;

                let positions = [];
                if (this.currentLayout === 'turtle') positions = getTurtleLayout();
                else if (this.currentLayout === 'pyramid') positions = getPyramidLayout();
                else if (this.currentLayout === 'arena') positions = getArenaLayout();
                else if (this.currentLayout === 'skull') positions = getSkullLayout();
                else if (this.currentLayout === 'butterfly') positions = getButterflyLayout();
                else if (this.currentLayout === 'fortress') positions = getFortressLayout();
                else if (this.currentLayout === 'duck') positions = getDuckLayout();
                else if (this.currentLayout === 'invader') positions = getInvaderLayout();
                else if (this.currentLayout === 'donut') positions = getDonutLayout();
                else if (this.currentLayout === 'gamepad') positions = getGamepadLayout();
                else if (this.currentLayout === 'ghost') positions = getGhostLayout();
                else if (this.currentLayout === 'cat') positions = getCatLayout();

                this.activeTiles = generateSolvableBoard(positions);

                this.renderBoard();
                this.updateStats();
                this.startTimer();
            }

            startTimer() {
                this.stopTimer();
                this.timerInterval = setInterval(() => {
                    this.timerSeconds++;
                    const m = String(Math.floor(this.timerSeconds / 60)).padStart(2, '0');
                    const s = String(this.timerSeconds % 60).padStart(2, '0');
                    const formatted = `${m}:${s}`;
                    this.domTimer.innerText = formatted;
                    this.domTimerMobile.innerText = formatted;
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
            }

            renderBoard() {
                this.domViewport.innerHTML = '';

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                this.activeTiles.forEach(t => {
                    if (t.x < minX) minX = t.x;
                    if (t.x > maxX) maxX = t.x;
                    if (t.y < minY) minY = t.y;
                    if (t.y > maxY) maxY = t.y;
                });

                const isMobile = window.innerWidth < 640;
                const isTablet = window.innerWidth >= 640 && window.innerWidth < 1024;
                const unitSize = isMobile ? 22 : (isTablet ? 26 : 31);

                const boardWidth = (maxX - minX + 4) * unitSize;
                const boardHeight = (maxY - minY + 4) * unitSize;

                this.domViewport.style.width = `${boardWidth}px`;
                this.domViewport.style.height = `${boardHeight}px`;

                this.activeTiles.forEach(tile => {
                    const isFree = isTileFree(tile, this.activeTiles);
                    const el = document.createElement('div');
                    el.className = `tile ${isFree ? '' : 'blocked'}`;
                    el.id = `tile-${tile.id}`;

                    const leftPos = (tile.x - minX) * unitSize;
                    const topPos = (tile.y - minY) * unitSize;
                    const zIndex = tile.z * 10 + tile.y;

                    el.style.left = `${leftPos}px`;
                    el.style.top = `${topPos}px`;
                    el.style.zIndex = zIndex;
                    
                    const offsetDepth = tile.z * 3.5;
                    el.style.transform = `translate(${-offsetDepth}px, ${-offsetDepth}px)`;

                    el.innerHTML = this.getTileInnerHTML(tile);
                    
                    el.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        this.handleTileClick(tile);
                    });

                    this.domViewport.appendChild(el);
                });

                this.fitBoardToContainer();
            }

            fitBoardToContainer() {
                const containerWidth = this.domContainer.clientWidth - 16;
                const containerHeight = this.domContainer.clientHeight - 16;

                const boardWidth = parseFloat(this.domViewport.style.width) || 600;
                const boardHeight = parseFloat(this.domViewport.style.height) || 400;

                const scaleX = containerWidth / boardWidth;
                const scaleY = containerHeight / boardHeight;

                this.baseScale = Math.min(scaleX, scaleY, 1.2);
                this.applyBoardTransform();
            }

            applyBoardTransform() {
                const totalScale = (this.baseScale || 1.0) * this.zoomScale;
                this.domWrapper.style.transform = `scale(${totalScale})`;
            }

            getTileInnerHTML(tile) {
                if (tile.kanji) {
                    return `
                        <div class="kanji-font font-bold text-lg sm:text-xl md:text-2xl leading-none" style="color: ${tile.color};">
                            ${tile.kanji}
                        </div>
                        ${tile.subKanji ? `<div class="kanji-font text-[9px] sm:text-xs text-red-600 mt-0.5 font-bold">${tile.subKanji}</div>` : ''}
                    `;
                }
                if (tile.emoji) {
                    return `
                        <div class="text-base sm:text-xl md:text-2xl mb-0.5">${tile.emoji}</div>
                        <div class="kanji-font text-[9px] sm:text-xs font-bold" style="color: ${tile.color}">${tile.kanji}</div>
                    `;
                }
                if (tile.icon) {
                    return tile.icon;
                }
                return `<div class="font-bold text-xs sm:text-sm" style="color:${tile.color}">${tile.label}</div>`;
            }

            handleTileClick(tile) {
                if (!isTileFree(tile, this.activeTiles)) {
                    soundEngine.playError();
                    return;
                }

                soundEngine.playClick();

                if (!this.selectedTile) {
                    this.selectedTile = tile;
                    this.highlightTile(tile.id, true);
                    return;
                }

                if (this.selectedTile.id === tile.id) {
                    this.highlightTile(tile.id, false);
                    this.selectedTile = null;
                    return;
                }

                if (doTilesMatch(this.selectedTile, tile)) {
                    this.removePair(this.selectedTile, tile);
                    this.selectedTile = null;
                } else {
                    soundEngine.playError();
                    this.highlightTile(this.selectedTile.id, false);
                    this.selectedTile = tile;
                    this.highlightTile(tile.id, true);
                }
            }

            highlightTile(id, isSelected) {
                const el = document.getElementById(`tile-${id}`);
                if (el) {
                    if (isSelected) el.classList.add('selected');
                    else el.classList.remove('selected');
                }
            }

            removePair(tileA, tileB) {
                soundEngine.playMatch();

                this.historyStack.push([tileA, tileB]);
                this.movesCount++;

                const elA = document.getElementById(`tile-${tileA.id}`);
                const elB = document.getElementById(`tile-${tileB.id}`);

                if (elA) elA.style.opacity = '0';
                if (elB) elB.style.opacity = '0';

                setTimeout(() => {
                    this.activeTiles = this.activeTiles.filter(t => t.id !== tileA.id && t.id !== tileB.id);
                    this.renderBoard();
                    this.updateStats();
                    this.checkGameState();
                }, 200);
            }

            undoMove() {
                if (this.historyStack.length === 0) return;
                soundEngine.playClick();

                const [tileA, tileB] = this.historyStack.pop();
                this.activeTiles.push(tileA, tileB);
                this.movesCount++;

                if (this.selectedTile) {
                    this.highlightTile(this.selectedTile.id, false);
                    this.selectedTile = null;
                }

                this.renderBoard();
                this.updateStats();
            }

            getAvailableMoves() {
                const freeTiles = this.activeTiles.filter(t => isTileFree(t, this.activeTiles));
                const pairs = [];

                for (let i = 0; i < freeTiles.length; i++) {
                    for (let j = i + 1; j < freeTiles.length; j++) {
                        if (doTilesMatch(freeTiles[i], freeTiles[j])) {
                            pairs.push([freeTiles[i], freeTiles[j]]);
                        }
                    }
                }
                return pairs;
            }

            showHint() {
                soundEngine.playClick();
                const moves = this.getAvailableMoves();

                document.querySelectorAll('.tile.hinted').forEach(el => el.classList.remove('hinted'));

                if (moves.length === 0) {
                    this.showModal("Aucun Coup Possible", "Plus aucun coup libre disponible. Voulez-vous mélanger les tuiles ?", "🔀", "Mélanger", () => {
                        this.hideModal();
                        this.shuffleRemaining();
                    });
                    return;
                }

                const [tileA, tileB] = moves[0];
                const elA = document.getElementById(`tile-${tileA.id}`);
                const elB = document.getElementById(`tile-${tileB.id}`);

                if (elA) elA.classList.add('hinted');
                if (elB) elB.classList.add('hinted');

                setTimeout(() => {
                    if (elA) elA.classList.remove('hinted');
                    if (elB) elB.classList.remove('hinted');
                }, 3000);
            }

            shuffleRemaining() {
                soundEngine.playClick();
                if (this.activeTiles.length === 0) return;

                const currentPositions = this.activeTiles.map(t => ({ id: t.id, x: t.x, y: t.y, z: t.z }));
                const shuffledBoard = generateSolvableBoard(currentPositions);

                this.activeTiles = shuffledBoard;
                this.selectedTile = null;

                this.renderBoard();
                this.updateStats();
            }

            updateStats() {
                const count = this.activeTiles.length;
                this.domTilesCount.innerText = count;
                this.domTilesCountMobile.innerText = `🀄 ${count}`;

                this.domMovesCount.innerText = this.movesCount;
                this.domMovesCountMobile.innerText = `⚡ ${this.movesCount}`;

                document.getElementById('btn-undo').disabled = this.historyStack.length === 0;
            }

            checkGameState() {
                if (this.activeTiles.length === 0) {
                    this.stopTimer();
                    soundEngine.playWin();
                    this.showModal("Victoire Absolue !", "Félicitations ! Vous avez vidé le plateau avec succès !", "🏆", "Nouvelle Partie", () => {
                        this.hideModal();
                        this.startNewGame();
                    });
                    return;
                }

                const moves = this.getAvailableMoves();
                if (moves.length === 0) {
                    soundEngine.playError();
                    this.showModal("Partie Bloquée", "Aucun coup n'est possible actuellement.", "⚠️", "Mélanger", () => {
                        this.hideModal();
                        this.shuffleRemaining();
                    });
                }
            }

            showModal(title, msg, icon, btnText, callback) {
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = msg;
                document.getElementById('modal-icon').innerText = icon;

                const primaryBtn = document.getElementById('modal-btn-primary');
                primaryBtn.innerText = btnText;

                document.getElementById('stat-time').innerText = this.domTimer.innerText;
                document.getElementById('stat-moves').innerText = this.movesCount;

                const newBtn = primaryBtn.cloneNode(true);
                primaryBtn.parentNode.replaceChild(newBtn, primaryBtn);
                newBtn.addEventListener('click', callback);

                modal.classList.remove('hidden');
            }

            hideModal() {
                document.getElementById('modal-overlay').classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const game = new MahjongGame();
            game.startNewGame();
        });
    </script>
