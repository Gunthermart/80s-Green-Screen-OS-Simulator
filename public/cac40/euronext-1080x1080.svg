<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="primary-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glow-sq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg-sq)"/>
  <circle cx="540" cy="450" r="300" fill="#0284c7" opacity="0.15" filter="url(#glow-sq)"/>

  <!-- Icône centrale -->
  <g transform="translate(300, 210)">
    <rect x="0" y="0" width="480" height="480" rx="96" fill="#0f172a" stroke="url(#primary-sq)" stroke-width="6"/>
    
    <path d="M 90 330 L 170 270 L 250 290 L 330 170 L 390 190" fill="none" stroke="url(#primary-sq)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="90" cy="330" r="14" fill="#0284c7"/>
    <circle cx="170" cy="270" r="14" fill="#06b6d4"/>
    <circle cx="250" cy="290" r="14" fill="#06b6d4"/>
    <circle cx="330" cy="170" r="18" fill="#10b981" filter="url(#glow-sq)"/>
    <circle cx="390" cy="190" r="14" fill="#10b981"/>

    <rect x="110" y="350" width="24" height="50" rx="6" fill="#0284c7" opacity="0.4"/>
    <rect x="190" y="320" width="24" height="80" rx="6" fill="#06b6d4" opacity="0.6"/>
    <rect x="270" y="330" width="24" height="70" rx="6" fill="#06b6d4" opacity="0.5"/>
    <rect x="350" y="250" width="24" height="150" rx="6" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Texte -->
  <text x="540" y="790" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Leonce IA</text>
  <text x="540" y="860" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="32" fill="#38bdf8" text-anchor="middle" letter-spacing="2">EURONEXT FACTCHECK</text>
</svg>
