    <script>
        // Initialisation de la base Dexie.js avec versionning résilient (v100)
        const db = new Dexie('EuronextTradeJournalDB');
        db.version(100).stores({
            trades: '++id, ticker, companyName, status, startDate, openDate, closeDate, timestamp'
        });

        // Gestion automatique des conflits de version d'IndexedDB
        db.open().catch(async (err) => {
            console.warn("Erreur d'ouverture Dexie IndexedDB, réinitialisation de la base :", err);
            await Dexie.delete('EuronextTradeJournalDB');
            await db.open();
        });

        const EURONEXT_SUGGESTIONS = [
            { name: "LVMH Moët Hennessy", ticker: "MC", isin: "FR0000121014", market: "Euronext Paris" },
            { name: "ASML Holding", ticker: "ASML", isin: "NL0010273215", market: "Euronext Amsterdam" },
            { name: "TotalEnergies", ticker: "TTE", isin: "FR0000120271", market: "Euronext Paris" },
            { name: "Sanofi", ticker: "SAN", isin: "FR0000120578", market: "Euronext Paris" },
            { name: "Air Liquide", ticker: "AI", isin: "FR0000120073", market: "Euronext Paris" },
            { name: "Anheuser-Busch InBev", ticker: "ABI", isin: "BE0974293251", market: "Euronext Brussels" },
            { name: "Equinor", ticker: "EQNR", isin: "NO0010096988", market: "Euronext Oslo" }
        ];

        let currentReportData = null;
        let financialChartInstance = null;
        let currentStatusFilter = 'ALL';
        let clearTradesClickState = false;

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const btnClearSearch = document.getElementById('btnClearSearch');
        const marketSelect = document.getElementById('marketSelect');
        const suggestionsDropdown = document.getElementById('suggestionsDropdown');

        const loadingContainer = document.getElementById('loadingContainer');
        const loadingStatusText = document.getElementById('loadingStatusText');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const welcomeContainer = document.getElementById('welcomeContainer');
        const resultsContainer = document.getElementById('resultsContainer');

        const btnHistory = document.getElementById('btnHistory');
        const historyModal = document.getElementById('historyModal');
        const btnCloseHistory = document.getElementById('btnCloseHistory');
        const tradesList = document.getElementById('tradesList');
        const btnClearTrades = document.getElementById('btnClearTrades');
        const btnExportTrades = document.getElementById('btnExportTrades');
        const importTradesInput = document.getElementById('importTradesInput');

        const btnPrint = document.getElementById('btnPrint');
        const btnExportPDF = document.getElementById('btnExportPDF');
        const btnCopyJSON = document.getElementById('btnCopyJSON');
        const btnSharePlan = document.getElementById('btnSharePlan');
        const btnSaveTrade = document.getElementById('btnSaveTrade');

        const mmCapitalInput = document.getElementById('mmCapitalInput');
        const mmRiskPercentInput = document.getElementById('mmRiskPercentInput');

        window.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
            renderTradesJournal();
        });

        function parsePriceValue(strVal) {
            if (!strVal) return 0;
            const cleanStr = strVal.replace(',', '.');
            const match = cleanStr.match(/\d+(\.\d+)?/g);
            if (!match) return 0;
            if (match.length >= 2) {
                return (parseFloat(match[0]) + parseFloat(match[1])) / 2;
            }
            return parseFloat(match[0]);
        }

        function calculateMoneyManagement() {
            if (!currentReportData || !currentReportData.tradingPlan) return;
            const t = currentReportData.tradingPlan;

            const capital = parseFloat(mmCapitalInput.value) || 0;
            const riskPct = parseFloat(mmRiskPercentInput.value) || 1.0;

            const entryVal = parsePriceValue(t.entryZone);
            const stopLossVal = parsePriceValue(t.stopLoss);
            const tp1Val = parsePriceValue(t.tp1);
            const tp2Val = parsePriceValue(t.tp2);

            const riskEuro = (capital * riskPct) / 100;
            document.getElementById('mmRiskEuroVal').innerText = `${riskEuro.toFixed(2)} €`;

            if (entryVal <= 0 || stopLossVal <= 0 || entryVal <= stopLossVal || capital <= 0) {
                document.getElementById('mmSharesVal').innerText = "--- actions";
                document.getElementById('mmPositionSizeVal').innerText = "--- €";
                document.getElementById('mmAllocationVal').innerText = "-- %";
                document.getElementById('mmPotentialGainVal').innerText = "--- € / --- €";
                document.getElementById('mmWarningBadge').classList.add('hidden');
                return { riskEuro, sharesCount: 0, positionSize: 0, allocationPct: 0, gainTp1: 0, gainTp2: 0, capital, riskPct };
            }

            const riskPerShare = entryVal - stopLossVal;
            const sharesCount = Math.floor(riskEuro / riskPerShare);
            const positionSize = sharesCount * entryVal;
            const allocationPct = (positionSize / capital) * 100;

            const gainTp1 = sharesCount * (tp1Val - entryVal);
            const gainTp2 = sharesCount * (tp2Val - entryVal);

            document.getElementById('mmSharesVal').innerText = `${sharesCount.toLocaleString('fr-FR')} actions`;
            document.getElementById('mmPositionSizeVal').innerText = `${positionSize.toLocaleString('fr-FR', { maximumFractionDigits: 2 })} €`;
            document.getElementById('mmAllocationVal').innerText = `${allocationPct.toFixed(1)} % du portefeuille`;
            document.getElementById('mmPotentialGainVal').innerText = `TP1: +${gainTp1 > 0 ? gainTp1.toFixed(0) : '-'} € | TP2: +${gainTp2 > 0 ? gainTp2.toFixed(0) : '-'} €`;

            const warningBadge = document.getElementById('mmWarningBadge');
            if (allocationPct > 25) {
                warningBadge.classList.remove('hidden');
                warningBadge.innerText = `⚠️ Sur-exposition (${allocationPct.toFixed(0)}% > 25%)`;
            } else {
                warningBadge.classList.add('hidden');
            }

            return { riskEuro, sharesCount, positionSize, allocationPct, gainTp1, gainTp2, capital, riskPct };
        }

        function initEventListeners() {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) {
                    executeAnalysis(query, marketSelect.value);
                }
            });

            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                btnClearSearch.classList.toggle('hidden', val === '');
                showSuggestions(val);
            });

            btnClearSearch.addEventListener('click', () => {
                searchInput.value = '';
                btnClearSearch.classList.add('hidden');
                suggestionsDropdown.classList.add('hidden');
                searchInput.focus();
            });

            document.addEventListener('click', (e) => {
                if (!searchForm.contains(e.target)) {
                    suggestionsDropdown.classList.add('hidden');
                }
            });

            document.querySelectorAll('.preset-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const companyName = btn.innerText.trim();
                    searchInput.value = companyName;
                    btnClearSearch.classList.remove('hidden');
                    executeAnalysis(companyName, marketSelect.value);
                });
            });

            btnHistory.addEventListener('click', () => {
                renderTradesJournal(true);
                historyModal.classList.remove('hidden');
            });
            btnCloseHistory.addEventListener('click', () => historyModal.classList.add('hidden'));

            btnClearTrades.addEventListener('click', async () => {
                if (!clearTradesClickState) {
                    clearTradesClickState = true;
                    btnClearTrades.innerText = "Cliquez à nouveau pour tout effacer définitivement";
                    btnClearTrades.classList.replace('bg-rose-950/40', 'bg-rose-600');
                    btnClearTrades.classList.replace('text-rose-300', 'text-white');
                    setTimeout(() => {
                        clearTradesClickState = false;
                        btnClearTrades.innerText = "Effacer tout le journal";
                        btnClearTrades.classList.replace('bg-rose-600', 'bg-rose-950/40');
                        btnClearTrades.classList.replace('text-white', 'text-rose-300');
                    }, 4000);
                } else {
                    await db.trades.clear();
                    clearTradesClickState = false;
                    btnClearTrades.innerText = "Effacer tout le journal";
                    btnClearTrades.classList.replace('bg-rose-600', 'bg-rose-950/40');
                    btnClearTrades.classList.replace('text-white', 'text-rose-300');
                    renderTradesJournal(true);
                }
            });

            btnExportTrades.addEventListener('click', exportTradesJSON);
            importTradesInput.addEventListener('change', importTradesJSON);

            btnPrint.addEventListener('click', () => window.print());
            btnExportPDF.addEventListener('click', generatePDFExport);
            btnCopyJSON.addEventListener('click', copyJSONToClipboard);

            if (btnSharePlan) {
                btnSharePlan.addEventListener('click', shareTradingPlan);
            }
            if (btnSaveTrade) {
                btnSaveTrade.addEventListener('click', saveCurrentTradeToDB);
            }

            if (mmCapitalInput) mmCapitalInput.addEventListener('input', calculateMoneyManagement);
            if (mmRiskPercentInput) mmRiskPercentInput.addEventListener('input', calculateMoneyManagement);

            document.querySelectorAll('.filter-status-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-status-btn').forEach(b => {
                        b.classList.remove('bg-sky-500/20', 'text-sky-300', 'font-semibold');
                        b.classList.add('text-slate-400');
                    });
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('bg-sky-500/20', 'text-sky-300', 'font-semibold');
                    currentStatusFilter = btn.dataset.status;
                    renderTradesJournal(true);
                });
            });

            const filterStartInput = document.getElementById('journalFilterStartDate');
            const filterEndInput = document.getElementById('journalFilterEndDate');
            const btnResetDateFilter = document.getElementById('btnResetDateFilter');
            const btnPrintJournalPDF = document.getElementById('btnPrintJournalPDF');

            if (filterStartInput) filterStartInput.addEventListener('change', () => renderTradesJournal(false));
            if (filterEndInput) filterEndInput.addEventListener('change', () => renderTradesJournal(false));
            if (btnResetDateFilter) {
                btnResetDateFilter.addEventListener('click', async () => {
                    const allDatabaseTrades = await db.trades.toArray();
                    let categoryTrades = allDatabaseTrades;
                    if (currentStatusFilter !== 'ALL') {
                        categoryTrades = allDatabaseTrades.filter(t => t.status === currentStatusFilter);
                    }
                    await updateCategoryDateBounds(categoryTrades);
                    renderTradesJournal(false);
                });
            }
            if (btnPrintJournalPDF) {
                btnPrintJournalPDF.addEventListener('click', generateJournalPDF);
            }
        }

        async function saveCurrentTradeToDB() {
            try {
                if (!currentReportData || !currentReportData.tradingPlan) return;
                const info = currentReportData.companyInfo || {};
                const t = currentReportData.tradingPlan;
                const todayIso = new Date().toISOString().slice(0, 10);

                const mm = calculateMoneyManagement() || {};
                const capitalVal = mm.capital !== undefined ? mm.capital : (parseFloat(mmCapitalInput ? mmCapitalInput.value : 0) || 0);
                
                // Règle : Si Capital > 0 => Actif, Sinon => Inactif
                const tradeStatus = capitalVal > 0 ? 'actif' : 'inactif';

                const tradeObj = {
                    companyName: info.name || 'Société',
                    ticker: info.ticker || 'EUR',
                    isin: info.isin || 'N/A',
                    entryZone: t.entryZone || '-',
                    stopLoss: t.stopLoss || '-',
                    tp1: t.tp1 || '-',
                    tp2: t.tp2 || '-',
                    riskRewardRatio: t.riskRewardRatio || '-',
                    winProbability: t.winProbability || '-',
                    thesis: t.thesis || '-',
                    invalidation: t.invalidation || '-',
                    status: tradeStatus,
                    startDate: todayIso,       // Date Début
                    openDate: todayIso,        // Date Ouverture
                    closeDate: '',             // Date Clôture
                    exitPrice: 0,
                    realizedPnL: 0,
                    capital: capitalVal,
                    riskPercent: mm.riskPct || 1.0,
                    riskAmountEur: mm.riskEuro || 0,
                    sharesCount: mm.sharesCount || 0,
                    positionSizeEur: mm.positionSize || 0,
                    allocationPercent: mm.allocationPct || 0,
                    createdAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                    timestamp: Date.now()
                };

                await db.trades.add(tradeObj);
                await renderTradesJournal(true);

                btnSaveTrade.classList.remove('bg-sky-600', 'hover:bg-sky-500');
                btnSaveTrade.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                btnSaveTrade.innerHTML = `<i class="fa-solid fa-check text-white"></i> <span>Trade (${tradeStatus.toUpperCase()}) Enregistré !</span>`;
                setTimeout(() => {
                    btnSaveTrade.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                    btnSaveTrade.classList.add('bg-sky-600', 'hover:bg-sky-500');
                    btnSaveTrade.innerHTML = `<i class="fa-solid fa-bookmark"></i> <span>Enregistrer Trade</span>`;
                }, 3000);
            } catch (err) {
                console.error("Erreur d'enregistrement du trade:", err);
                btnSaveTrade.classList.remove('bg-sky-600', 'hover:bg-sky-500');
                btnSaveTrade.classList.add('bg-rose-600', 'hover:bg-rose-500');
                btnSaveTrade.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>Erreur !</span>`;
                setTimeout(() => {
                    btnSaveTrade.classList.remove('bg-rose-600', 'hover:bg-rose-500');
                    btnSaveTrade.classList.add('bg-sky-600', 'hover:bg-sky-500');
                    btnSaveTrade.innerHTML = `<i class="fa-solid fa-bookmark"></i> <span>Enregistrer Trade</span>`;
                }, 3000);
            }
        }

        async function updateCategoryDateBounds(categoryTrades) {
            const filterStartInput = document.getElementById('journalFilterStartDate');
            const filterEndInput = document.getElementById('journalFilterEndDate');
            if (!filterStartInput || !filterEndInput) return;

            if (!categoryTrades || categoryTrades.length === 0) {
                filterStartInput.value = '';
                filterEndInput.value = '';
                return;
            }

            let minDate = null;
            let maxDate = null;

            categoryTrades.forEach(t => {
                const start = t.startDate || t.openDate || (t.timestamp ? new Date(t.timestamp).toISOString().slice(0, 10) : null);
                const end = t.closeDate || t.openDate || t.startDate || (t.timestamp ? new Date(t.timestamp).toISOString().slice(0, 10) : null);

                if (start) {
                    if (!minDate || start < minDate) minDate = start;
                }
                if (end) {
                    if (!maxDate || end > maxDate) maxDate = end;
                }
            });

            if (minDate) filterStartInput.value = minDate;
            if (maxDate) filterEndInput.value = maxDate;
        }

        async function getFilteredTrades() {
            let allTrades = await db.trades.orderBy('timestamp').reverse().toArray();

            // Filtre par statut / catégorie
            if (currentStatusFilter !== 'ALL') {
                allTrades = allTrades.filter(t => t.status === currentStatusFilter);
            }

            // Filtre par période (Date Début et Date Fin)
            const startDateVal = document.getElementById('journalFilterStartDate')?.value;
            const endDateVal = document.getElementById('journalFilterEndDate')?.value;

            if (startDateVal) {
                allTrades = allTrades.filter(t => {
                    const tDate = t.startDate || t.openDate || new Date(t.timestamp).toISOString().slice(0, 10);
                    return tDate >= startDateVal;
                });
            }

            if (endDateVal) {
                allTrades = allTrades.filter(t => {
                    const tDate = t.closeDate || t.openDate || t.startDate || new Date(t.timestamp).toISOString().slice(0, 10);
                    return tDate <= endDateVal;
                });
            }

            return allTrades;
        }

        async function renderTradesJournal(isCategoryChange = false) {
            const allDatabaseTrades = await db.trades.toArray();

            // Filtrage par catégorie/statut pour déterminer les bornes temporelles auto
            let categoryTrades = allDatabaseTrades;
            if (currentStatusFilter !== 'ALL') {
                categoryTrades = allDatabaseTrades.filter(t => t.status === currentStatusFilter);
            }

            // Pré-remplissage automatique des dates de début/fin si changement de catégorie ou valeurs vides
            const filterStartInput = document.getElementById('journalFilterStartDate');
            const filterEndInput = document.getElementById('journalFilterEndDate');
            if (isCategoryChange || (filterStartInput && !filterStartInput.value) || (filterEndInput && !filterEndInput.value)) {
                await updateCategoryDateBounds(categoryTrades);
            }

            const filteredTrades = await getFilteredTrades();

            // Calcul du Tableau de Bord Money Management
            let portfolioCapital = parseFloat(mmCapitalInput?.value) || 0;
            let activeAllocatedSum = 0;
            let activeRiskSum = 0;
            let realizedPnlSum = 0;

            allDatabaseTrades.forEach(t => {
                if (t.capital && t.capital > 0) portfolioCapital = t.capital;
                if (t.status === 'actif') {
                    activeAllocatedSum += (t.positionSizeEur || 0);
                    activeRiskSum += (t.riskAmountEur || 0);
                } else if (t.status === 'cloturé') {
                    realizedPnlSum += (t.realizedPnL || 0);
                }
            });

            const activeAllocatedPct = portfolioCapital > 0 ? (activeAllocatedSum / portfolioCapital) * 100 : 0;

            document.getElementById('pmmTotalTradesBadge').innerText = `${allDatabaseTrades.length} position(s) enregistrée(s)`;
            document.getElementById('pmmCapitalVal').innerText = `${portfolioCapital.toLocaleString('fr-FR')} €`;
            document.getElementById('pmmAllocatedVal').innerText = `${activeAllocatedSum.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} € (${activeAllocatedPct.toFixed(1)}%)`;
            document.getElementById('pmmTotalRiskVal').innerText = `${activeRiskSum.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} €`;

            const pnlEl = document.getElementById('pmmRealizedPnlVal');
            pnlEl.innerText = `${realizedPnlSum >= 0 ? '+' : ''}${realizedPnlSum.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
            pnlEl.className = realizedPnlSum > 0 ? "font-bold text-emerald-400 text-xs" : realizedPnlSum < 0 ? "font-bold text-rose-400 text-xs" : "font-bold text-slate-200 text-xs";

            if (filteredTrades.length === 0) {
                tradesList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Aucun trade répertorié pour cette catégorie et cette période.</p>`;
                return;
            }

            tradesList.innerHTML = filteredTrades.map(trade => {
                const getStatusBadge = (st) => {
                    if (st === 'actif') return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
                    if (st === 'inactif') return 'bg-slate-800 text-slate-400 border-slate-700';
                    if (st === 'cloturé') return 'bg-purple-500/20 text-purple-300 border-purple-500/40';
                    return 'bg-slate-800 text-slate-300';
                };

                const startDate = trade.startDate || new Date(trade.timestamp).toISOString().slice(0, 10);
                const openDate = trade.openDate || startDate;
                const closeDate = trade.closeDate || '';
                const realizedPnL = trade.realizedPnL || 0;

                return `
                    <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3 transition hover:border-slate-700">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-sm font-bold text-white">${trade.companyName}</span>
                                    <span class="px-2 py-0.5 text-xs font-mono bg-sky-500/10 text-sky-400 rounded border border-sky-500/20">${trade.ticker}</span>
                                </div>
                                <span class="text-[10px] text-slate-500 font-mono">Créé le : ${trade.createdAt}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <select onchange="updateTradeStatus(${trade.id}, this.value)" class="text-xs font-mono px-2 py-1 rounded-lg bg-slate-900 text-slate-200 border border-slate-700 focus:outline-none cursor-pointer ${getStatusBadge(trade.status)}">
                                    <option value="actif" ${trade.status === 'actif' ? 'selected' : ''}>Actif</option>
                                    <option value="inactif" ${trade.status === 'inactif' ? 'selected' : ''}>Inactif</option>
                                    <option value="cloturé" ${trade.status === 'cloturé' ? 'selected' : ''}>Clôturé</option>
                                </select>
                                <button onclick="deleteTrade(${trade.id})" title="Supprimer" class="p-1.5 text-slate-500 hover:text-rose-400 transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Dates : Début, Ouverture, Clôture -->
                        <div class="grid grid-cols-3 gap-2 bg-slate-900/80 p-2 rounded-lg border border-slate-800/80 text-[10px] font-mono">
                            <div>
                                <label class="text-slate-500 block mb-0.5">Date Début</label>
                                <input type="date" value="${startDate}" onchange="updateTradeDate(${trade.id}, 'startDate', this.value)" class="bg-slate-950 text-slate-200 border border-slate-800 rounded p-1 w-full text-[10px]" />
                            </div>
                            <div>
                                <label class="text-sky-400 block mb-0.5">Ouverture</label>
                                <input type="date" value="${openDate}" onchange="updateTradeDate(${trade.id}, 'openDate', this.value)" class="bg-slate-950 text-sky-200 border border-slate-800 rounded p-1 w-full text-[10px]" />
                            </div>
                            <div>
                                <label class="text-purple-400 block mb-0.5">Clôture</label>
                                <input type="date" value="${closeDate}" onchange="updateTradeDate(${trade.id}, 'closeDate', this.value)" class="bg-slate-950 text-purple-200 border border-slate-800 rounded p-1 w-full text-[10px]" />
                            </div>

        async function updateTradeDate(id, field, value) {
            const updateObj = {};
            updateObj[field] = value;
            await db.trades.update(id, updateObj);
            renderTradesJournal(false);
        }

        async function updateTradeExitPrice(id, value) {
            const exitPrice = parseFloat(value) || 0;
            const trade = await db.trades.get(id);
            if (!trade) return;

            const entryVal = parsePriceValue(trade.entryZone);
            const shares = trade.sharesCount || 0;

            let realizedPnL = 0;
            if (shares > 0 && entryVal > 0 && exitPrice > 0) {
                realizedPnL = shares * (exitPrice - entryVal);
            }

            await db.trades.update(id, { exitPrice, realizedPnL });
            renderTradesJournal(false);
        }

        async function updateTradeStatus(id, newStatus) {
            await db.trades.update(id, { status: newStatus });
            renderTradesJournal(false);
        }

            await db.trades.delete(id);
            renderTradesJournal(false);

        function importTradesJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const importedTrades = JSON.parse(event.target.result);
                    if (Array.isArray(importedTrades)) {
                        const cleanTrades = importedTrades.map(t => {
                            const { id, ...rest } = t;
                            return rest;
                        });
                        await db.trades.bulkAdd(cleanTrades);
                        renderTradesJournal(true);
                    }
                } catch (err) {
                    console.error("Importation échouée", err);
                }
            };
            reader.readAsText(file);
        }

        async function fetchGeminiWithRetry(payload) {
            const netlifyEndpoint = window.location.origin + '/.netlify/functions/StocksAnalyser';

            try {
                const response = await fetch(netlifyEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json().catch(() => null);

                if (response.ok) {
                    if (resData && resData.error) {
                        throw new Error(typeof resData.error === 'string' ? resData.error : JSON.stringify(resData.error));
                    }
                    return resData;
                }

                if (response.status === 429) {
                    throw new Error("Quota de requêtes atteint (429). Veuillez patienter une minute avant de relancer l'analyse.");
                }

                const errMsg = resData?.error?.message || resData?.error || `Erreur serveur (${response.status})`;
                throw new Error(errMsg);
            } catch (err) {
                throw err;
            }
        }

                let sources = [];
                const groundingMetadata = candidate.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingAttributions) {
                    sources = groundingMetadata.groundingAttributions
                        .map(attr => ({
                            uri: attr.web?.uri,
                            title: attr.web?.title
                        }))
                        .filter(src => src.uri && src.title);
                }

                currentReportData = { ...parsedData, sources };
                renderReport(currentReportData);

            } catch (err) {
                loadingContainer.classList.add('hidden');
                errorContainer.classList.remove('hidden');
                errorMessage.innerText = err.message || "Erreur inconnue lors du traitement.";
            }
        }

        function renderReport(data) {
            loadingContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');

            const info = data.companyInfo || {};
            const kpi = data.financialKPIs || {};
            const ratios = data.financialRatios || [];
            const health = data.healthScores || {};
            const div = data.dividendSafety || {};
            const growth = data.growthAnalysis || {};
            const gov = data.governanceAndCapital || {};
            const pers = data.perspectives || {};
            const consensus = data.analystConsensusAndNews || {};
            const risks = data.documentedRisks || [];
            const announcements = data.recentAnnouncements || [];
            const sources = data.sources || [];
            const diag = data.leonceDiagnostic || {};
            const trading = data.tradingPlan || {};

            const now = new Date();
            document.getElementById('reportGeneratedDate').innerText = `Mis à jour le ${now.toLocaleDateString('fr-FR')} à ${now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;

            document.getElementById('reportCompanyName').innerText = info.name || 'Société';
            document.getElementById('reportTickerBadge').innerText = info.ticker ? `Ticker: ${info.ticker}` : 'N/A';
            document.getElementById('reportMarketBadge').innerText = info.market || 'Euronext';
            document.getElementById('reportIsin').innerText = info.isin || 'N/A';
            document.getElementById('reportSector').innerText = info.icbSector || 'N/A';

            document.getElementById('infoMarketDetailed').innerText = info.market || '---';
            document.getElementById('infoIndex').innerText = info.index || 'N/A';
            document.getElementById('infoHeadquarters').innerText = info.headquarters || '---';
            document.getElementById('infoSummary').innerText = info.summary || 'Résumé indisponible.';

            document.getElementById('financialPeriodBadge').innerText = `Période: ${kpi.period || 'Dernière connue'} (${kpi.currency || 'EUR'})`;
            document.getElementById('kpiRevenue').innerText = kpi.revenue || 'N/A';
            document.getElementById('kpiNetIncome').innerText = kpi.netIncome || 'N/A';
            document.getElementById('kpiMargin').innerText = kpi.operatingMargin || 'N/A';
            document.getElementById('kpiDebt').innerText = kpi.netDebt || 'N/A';

            renderFinancialChart(kpi.historicalChartData, kpi.currency || 'M€');

            document.getElementById('piotroskiValue').innerText = health.piotroskiScore || 'N/A';
            document.getElementById('piotroskiBadge').innerText = `F-Score: ${health.piotroskiScore || 'N/A'}`;
            document.getElementById('piotroskiAnalysis').innerText = health.piotroskiAnalysis || 'Diagnostic de rentabilité et efficacité.';

            const isAltmanRisky = health.altmanStatus && (health.altmanStatus.toLowerCase().includes('détresse') || health.altmanStatus.toLowerCase().includes('gris') || health.altmanStatus.toLowerCase().includes('risque'));
            document.getElementById('altmanValue').innerText = health.altmanZScore || 'N/A';
            const altmanBadgeEl = document.getElementById('altmanBadge');
            altmanBadgeEl.innerText = health.altmanStatus || 'Zone Sûre';
            altmanBadgeEl.className = isAltmanRisky 
                ? 'text-xs px-2 py-0.5 rounded font-mono font-bold neon-red-badge' 
                : 'text-xs px-2 py-0.5 rounded font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20';

            document.getElementById('altmanAnalysis').innerText = 'Indicateur prédictif de solvabilité à 24 mois.';

            document.getElementById('dividendYieldValue').innerText = div.yield || 'N/A';
            document.getElementById('fcfYieldValue').innerText = div.fcfYield || 'N/A';
            const isDivRisky = div.safetyGrade && (div.safetyGrade.toLowerCase().includes('coupe') || div.safetyGrade.toLowerCase().includes('risque') || div.safetyGrade.toLowerCase().includes('vigilance') || div.safetyGrade.toLowerCase().includes('surveillance'));
            const divSafetyBadgeEl = document.getElementById('dividendSafetyBadge');
            divSafetyBadgeEl.innerText = div.safetyGrade || 'Sous surveillance';
            divSafetyBadgeEl.className = isDivRisky 
                ? 'text-xs px-2 py-0.5 rounded font-mono font-bold neon-red-badge' 
                : 'text-xs px-2 py-0.5 rounded font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';

            document.getElementById('dividendAnalysis').innerText = `${div.analysis || 'Soutenabilité'} (Payout FCF: ${div.payoutRatio || 'N/A'})`;

            const tableBody = document.getElementById('metricsTableBody');
            if (kpi.keyMetricsTable && kpi.keyMetricsTable.length > 0) {
                tableBody.innerHTML = kpi.keyMetricsTable.map(m => `
                    <tr>
                        <td class="p-3 font-medium text-slate-200">${m.label}</td>
                        <td class="p-3 text-right font-mono font-semibold text-white">${m.value}</td>
                        <td class="p-3 text-center">${m.trend || '---'}</td>
                    </tr>
                `).join('');
            } else {
                tableBody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-500">Aucune donnée disponible</td></tr>`;
            }

            const highlightsList = document.getElementById('financialHighlightsList');
            if (kpi.financialHighlights && kpi.financialHighlights.length > 0) {
                highlightsList.innerHTML = kpi.financialHighlights.map(item => `
                    <li class="flex items-start space-x-2.5">
                        <i class="fa-solid fa-caret-right text-emerald-400 text-xs mt-1 shrink-0"></i>
                        <span>${item}</span>
                    </li>
                `).join('');
            } else {
                highlightsList.innerHTML = `<li class="text-slate-500 italic">Aucun fait marquant répertorié.</li>`;
            }

            const ratiosContainer = document.getElementById('ratiosContainer');
            if (ratios.length > 0) {
                ratiosContainer.innerHTML = ratios.map(r => {
                    const isPositive = r.status === 'positive';
                    const isWarning = r.status === 'warning' || r.status === 'negative';

                    const cardBg = isPositive 
                        ? 'bg-emerald-950/20 border-emerald-500/40' 
                        : isWarning 
                            ? 'neon-red-card' 
                            : 'bg-slate-900/60 border-slate-800/80';

                    const valueColor = isPositive 
                        ? 'text-emerald-400' 
                        : isWarning 
                            ? 'text-neon-red font-bold' 
                            : 'text-slate-100';

                    const badgeStyle = isPositive 
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                        : isWarning 
                            ? 'neon-red-badge' 
                            : 'bg-slate-800 text-slate-300';

                    return `
                        <div class="p-4 rounded-xl ${cardBg} space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-mono font-semibold text-slate-200">${r.ratioName}</span>
                                <span class="text-[11px] font-mono px-2 py-0.5 rounded ${badgeStyle}">
                                    ${r.status || 'neutre'}
                                </span>
                            </div>
                            <div class="text-2xl font-black font-mono ${valueColor}">${r.value}</div>
                            ${r.benchmark ? `<div class="text-[11px] text-sky-400 font-mono"><i class="fa-solid fa-chart-pie mr-1"></i>Médiane Sectorielle: ${r.benchmark}</div>` : ''}
                            <p class="text-xs text-slate-300 pt-2 border-t border-slate-800/60">${r.analysis}</p>
                        </div>
                    `;
                }).join('');
            } else {
                ratiosContainer.innerHTML = `<div class="col-span-full p-4 text-center text-slate-500 text-xs">Aucun ratio disponible.</div>`;
            }

            document.getElementById('kpiGrowthRevenue').innerText = growth.revenueGrowthRate || 'N/A';
            document.getElementById('kpiGrowthEarnings').innerText = growth.earningsGrowthRate || 'N/A';
            document.getElementById('growthHistoricalSummary').innerText = growth.historicalGrowthSummary || 'Indisponible.';
            document.getElementById('growthOutlookSummary').innerText = growth.growthOutlook || 'Indisponible.';

            const growthDriversList = document.getElementById('growthDriversList');
            if (growth.growthDrivers && growth.growthDrivers.length > 0) {
                growthDriversList.innerHTML = growth.growthDrivers.map(d => `
                    <li class="flex items-start space-x-2.5">
                        <i class="fa-solid fa-chart-line text-teal-400 text-xs mt-1 shrink-0"></i>
                        <span>${d}</span>
                    </li>
                `).join('');
            } else {
                growthDriversList.innerHTML = `<li class="text-slate-500 italic">Aucun facteur répertorié.</li>`;
            }

            const shareholdersList = document.getElementById('shareholdersList');
            if (gov.majorShareholders && gov.majorShareholders.length > 0) {
                shareholdersList.innerHTML = gov.majorShareholders.map(s => `
                    <li class="p-3 flex justify-between items-center">
                        <span class="text-slate-300 font-medium">${s.name}</span>
                        <span class="font-mono text-purple-300 font-bold bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/20">${s.percentage}</span>
                    </li>
                `).join('');
            } else {
                shareholdersList.innerHTML = `<li class="p-3 text-slate-500">Données indisponibles.</li>`;
            }

            const executivesList = document.getElementById('executivesList');
            if (gov.executives && gov.executives.length > 0) {
                executivesList.innerHTML = gov.executives.map(e => `
                    <li class="p-3 flex justify-between items-center">
                        <span class="text-slate-400 text-xs font-mono">${e.title}</span>
                        <span class="text-slate-200 font-semibold">${e.name}</span>
                    </li>
                `).join('');
            } else {
                executivesList.innerHTML = `<li class="p-3 text-slate-500">Données indisponibles.</li>`;
            }

            document.getElementById('governanceNotes').innerText = gov.governanceNotes || 'Aucune note.';

            document.getElementById('perspectivesGuidance').innerText = pers.guidanceSummary || 'Aucune guidance.';
            const pillarsList = document.getElementById('perspectivesPillarsList');
            if (pers.strategicPillars && pers.strategicPillars.length > 0) {
                pillarsList.innerHTML = pers.strategicPillars.map(p => `
                    <li class="flex items-start space-x-2.5">
                        <i class="fa-solid fa-check text-teal-400 text-xs mt-1 shrink-0"></i>
                        <span>${p}</span>
                    </li>
                `).join('');
            } else {
                pillarsList.innerHTML = `<li class="text-slate-500 italic">Aucun pilier.</li>`;
            }

            document.getElementById('kpiConsensusRec').innerText = consensus.consensusRecommendation || 'N/A';
            document.getElementById('kpiTargetPrice').innerText = consensus.targetPriceAvg || 'N/A';
            document.getElementById('consensusSummary').innerText = consensus.consensusSummary || 'Indisponible.';

            const newsContainer = document.getElementById('recentNewsContainer');
            if (consensus.recentNews && consensus.recentNews.length > 0) {
                newsContainer.innerHTML = consensus.recentNews.map(n => `
                    <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 space-y-1">
                        <div class="flex items-center justify-between text-xs font-mono text-slate-400">
                            <span class="text-cyan-400">${n.source || 'Info'}</span>
                            <span>${n.date || ''}</span>
                        </div>
                        <div class="text-sm font-bold text-slate-200">${n.title}</div>
                        <p class="text-xs text-slate-300">${n.summary}</p>
                    </div>
                `).join('');
            } else {
                newsContainer.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">Aucune actualité.</div>`;
            }

            const risksContainer = document.getElementById('risksContainer');
            if (risks.length > 0) {
                risksContainer.innerHTML = risks.map(r => `
                    <div class="p-4 rounded-xl neon-red-card space-y-1">
                        <div class="text-xs font-mono text-neon-red font-bold flex items-center space-x-1.5">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span>${r.category}</span>
                        </div>
                        <p class="text-xs text-slate-200 leading-relaxed">${r.description}</p>
                    </div>
                `).join('');
            } else {
                risksContainer.innerHTML = `<div class="col-span-2 p-4 text-center text-slate-500 text-xs">Aucun risque répertorié.</div>`;
            }

            const announcementsContainer = document.getElementById('announcementsContainer');
            if (announcements.length > 0) {
                announcementsContainer.innerHTML = announcements.map(a => `
                    <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 flex justify-between gap-2">
                        <div>
                            <div class="text-sm font-semibold text-slate-200">${a.title}</div>
                            <div class="text-xs text-slate-400">${a.details}</div>
                        </div>
                        <span class="text-[11px] font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-400 shrink-0 h-fit">${a.date || ''}</span>
                    </div>
                `).join('');
            } else {
                announcementsContainer.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">Aucun communiqué.</div>`;
            }

            const sourcesContainer = document.getElementById('sourcesContainer');
            if (sources.length > 0) {
                sourcesContainer.innerHTML = sources.map(s => `
                    <a href="${s.uri}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-slate-900 text-sky-400 border border-slate-800 hover:border-sky-500/40 transition truncate max-w-xs text-xs">
                        ${s.title}
                    </a>
                `).join('');
            } else {
                sourcesContainer.innerHTML = `<span class="text-slate-500 text-xs italic">Bases de données publiques.</span>`;
            }

            // Diagnostic Section 11
            const overallScore = diag.overallScore !== undefined ? diag.overallScore : '--';
            document.getElementById('overallScoreBadge').innerText = `${overallScore} / 100`;

            const getBadgeClass = (signalStr) => {
                const s = (signalStr || '').toLowerCase();
                if (s.includes('favorable') || s.includes('solide')) {
                    return 'text-xs font-mono px-2.5 py-0.5 rounded font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                }
                if (s.includes('prudence') || s.includes('pression') || s.includes('risque')) {
                    return 'text-xs font-mono px-2.5 py-0.5 rounded font-bold neon-red-badge';
                }
                return 'text-xs font-mono px-2.5 py-0.5 rounded font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20';
            };

            const stBadge = document.getElementById('stSignalBadge');
            stBadge.innerText = diag.shortTermSignal || 'Neutre';
            stBadge.className = getBadgeClass(diag.shortTermSignal);
            document.getElementById('stAnalysisText').innerText = diag.shortTermAnalysis || 'Analyse indisponible.';

            const mtBadge = document.getElementById('mtSignalBadge');
            mtBadge.innerText = diag.mediumTermSignal || 'Neutre';
            mtBadge.className = getBadgeClass(diag.mediumTermSignal);
            document.getElementById('mtAnalysisText').innerText = diag.mediumTermAnalysis || 'Analyse indisponible.';

            // Trading Plan Section 12
            document.getElementById('planEntry').innerText = trading.entryZone || 'N/A';
            document.getElementById('planStopLoss').innerText = trading.stopLoss || 'N/A';
            document.getElementById('planTP1').innerText = trading.tp1 || 'N/A';
            document.getElementById('planTP2').innerText = trading.tp2 || 'N/A';
            document.getElementById('planRiskReward').innerText = trading.riskRewardRatio || '1:--';

            const winProbEl = document.getElementById('planWinProb');
            const winProbVal = trading.winProbability || '--%';
            winProbEl.innerText = winProbVal;
            const probNum = parseInt(winProbVal, 10);
            if (!isNaN(probNum)) {
                if (probNum >= 65) {
                    winProbEl.className = 'text-base font-black font-mono px-3 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                } else if (probNum >= 50) {
                    winProbEl.className = 'text-base font-black font-mono px-3 py-1 rounded-lg bg-sky-500/20 text-sky-300 border border-sky-500/40';
                } else {
                    winProbEl.className = 'text-base font-black font-mono px-3 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40';
                }
            }

            document.getElementById('planThesis').innerText = trading.thesis || 'Aucune thèse spécifiée.';
            document.getElementById('planInvalidation').innerText = trading.invalidation || 'Critère non défini.';

            calculateMoneyManagement();
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function renderFinancialChart(chartData, currencyUnit) {
            const ctx = document.getElementById('financialHistoryChart').getContext('2d');

            if (financialChartInstance) {
                financialChartInstance.destroy();
            }

            const labels = (chartData && chartData.length > 0) ? chartData.map(d => d.year) : ['N-2', 'N-1', 'N'];
            const revenueData = (chartData && chartData.length > 0) ? chartData.map(d => d.revenueNum) : [100, 115, 125];
            const netIncomeData = (chartData && chartData.length > 0) ? chartData.map(d => d.netIncomeNum) : [12, 15, 18];

            financialChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `Chiffre d'Affaires (${currencyUnit})`,
                            data: revenueData,
                            backgroundColor: 'rgba(56, 189, 248, 0.7)',
                            borderColor: '#38bdf8',
                            borderWidth: 1.5,
                            borderRadius: 6
                        },
                        {
                            label: `Résultat Net (${currencyUnit})`,
                            data: netIncomeData,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)',
                            borderColor: '#10b981',
                            borderWidth: 1.5,
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#94a3b8',
                                font: { family: 'Inter', size: 11 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#64748b', font: { family: 'JetBrains Mono' } },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        y: {
                            ticks: { color: '#64748b', font: { family: 'JetBrains Mono' } },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });
        }

        function generatePDFExport() {
            if (!currentReportData) return;

            const element = document.getElementById('printableReport');
            const companyName = currentReportData.companyInfo?.name || 'FactCheck';

            const opt = {
                margin:       [0.3, 0.3, 0.3, 0.3],
                filename:     `Euronext_Factsheet_${companyName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#0b1120' },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            btnExportPDF.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Génération...</span>`;

            html2pdf().set(opt).from(element).save().then(() => {
                btnExportPDF.innerHTML = `<i class="fa-solid fa-file-pdf"></i> <span>Télécharger PDF Factsheet</span>`;
            }).catch(err => {
                console.error("PDF Export Error:", err);
                btnExportPDF.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>Erreur PDF</span>`;
                setTimeout(() => {
                    btnExportPDF.innerHTML = `<i class="fa-solid fa-file-pdf"></i> <span>Télécharger PDF Factsheet</span>`;
                }, 2000);
            });
        }

        function copyJSONToClipboard() {
            if (!currentReportData) return;
            const str = JSON.stringify(currentReportData, null, 2);
            
            const el = document.createElement('textarea');
            el.value = str;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            btnCopyJSON.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copié !`;
            setTimeout(() => {
                btnCopyJSON.innerHTML = `<i class="fa-solid fa-copy"></i> JSON`;
            }, 2000);
        }
    </script>
</body>
</html>
