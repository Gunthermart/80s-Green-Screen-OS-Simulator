<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Arrière-plan dégradé sombre -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Dégradé de l'icône -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Dégradé du texte principal -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Filtre de lueur néon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arrière-plan -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Effets lumineux en arrière-plan -->
  <circle cx="250" cy="315" r="220" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="315" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Groupe Icône (Signal Boursier + Réseau IA) -->
  <g transform="translate(120, 195)">
    <!-- Arrondi d'arrière-plan de l'icône -->
    <rect x="0" y="0" width="240" height="240" rx="48" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="3"/>
    
    <!-- Courbe financière & Réseau IA -->
    <path d="M 45 165 L 85 135 L 125 145 L 165 85 L 195 95" fill="none" stroke="url(#primary-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Points d'analyse IA -->
    <circle cx="45" cy="165" r="7" fill="#0284c7"/>
    <circle cx="85" cy="135" r="7" fill="#06b6d4"/>
    <circle cx="125" cy="145" r="7" fill="#06b6d4"/>
    <circle cx="165" cy="85" r="9" fill="#10b981" filter="url(#glow)"/>
    <circle cx="195" cy="95" r="7" fill="#10b981"/>

    <!-- Barres d'analyse sous la courbe -->
    <rect x="55" y="175" width="12" height="25" rx="3" fill="#0284c7" opacity="0.4"/>
    <rect x="95" y="160" width="12" height="40" rx="3" fill="#06b6d4" opacity="0.6"/>
    <rect x="135" y="165" width="12" height="35" rx="3" fill="#06b6d4" opacity="0.5"/>
    <rect x="175" y="125" width="12" height="75" rx="3" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Groupe Typographie -->
  <g transform="translate(410, 260)">
    <!-- Nom de marque -->
    <text x="0" y="55" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#text-grad)" letter-spacing="-2">Leonce IA</text>
    
    <!-- Sous-titre / Slogan -->
    <text x="0" y="115" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#38bdf8" letter-spacing="1">EURONEXT FACTCHECK AI</text>
    
    <!-- Tagline factuelle -->
    <text x="0" y="155" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94a3b8">Analyse financière neutre, vérification des faits &amp; ratios en temps réel</text>
  </g>

  <!-- Bordure fine du cadre -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1e293b" stroke-width="2" rx="0"/>
</svg>
