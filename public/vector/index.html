            const interval = Math.max(0.7, 2.0 - wave * 0.12);

            if (spawnTimer >= interval && enemies.length < 12) {
                spawnTimer = 0;
                const rand = Math.random();
                if (rand < 0.20) {
                    const formations = ['V', 'DIAMOND', 'SWORD', 'ARROW'];
                    const picked = formations[Math.floor(Math.random() * formations.length)];
                    spawnSquadron(picked);
                }
                else if (rand < 0.32) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 1));
                else if (rand < 0.44) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 16)); // Galaga Diver
                else if (rand < 0.54) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 13)); // Pixel Glitcher
                else if (rand < 0.64) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 14)); // Fractal
                else if (rand < 0.74) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 15)); // Cyclops
                else if (rand < 0.84) enemies.push(new Enemy(Math.random() * (width - 60) + 30, -30, 4));
                else if (rand < 0.90) enemies.push(new Enemy(Math.random() * (width - 80) + 40, -40, 2));
                else {
                    if (!enemies.some(e => e.type >= 7)) {
                        const bossPool = [7, 9, 10, 11, 17];
                        const chosenBoss = bossPool[Math.floor(Math.random() * bossPool.length)];
                        enemies.push(new Enemy(width / 2, -70, chosenBoss));
                        floatingTexts.push(new FloatingText(width / 2, height / 3, 'WARNING: BOSS APPROACHING!', '#ff0055', 24));
                    }
                }
            }
            if (score > wave * 2200) wave++;
        }

        function handlePlayerHit() {
            if (player.shield) {
                player.shield = false;
                player.invulnerableTimer = 1.0;
                audio.playExplosion(false);
                floatingTexts.push(new FloatingText(player.x, player.y - 20, 'SHIELD BROKEN!', '#00f0ff', 18));
                return;
            }

            player.lives--;
            screenShake = 12;
            audio.playExplosion(true);
            player.invulnerableTimer = 1.8;

            for (let i = 0; i < 20; i++) {
                const ang = Math.random() * Math.PI * 2;
                particles.push(new Particle(player.x, player.y, '#00f0ff', { x: Math.cos(ang) * 6, y: Math.sin(ang) * 6 }));
            }

            if (player.lives <= 0) {
                gameState = STATES.GAMEOVER;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('zerovector_highscore', highScore.toString());
                }
            }
        }

        function checkCollisions() {
            playerBullets.forEach(b => {
                enemies.forEach(e => {
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        e.takeDamage(b.damage);
                        if (b.type !== 'singularity' && b.radius < 10) b.toRemove = true;
                        particles.push(new Particle(b.x, b.y, '#00f0ff', { x: (Math.random() - 0.5) * 2, y: (Math.random() - 0.5) * 2 }));
                    }
                });
            });

            if (player.timeStopTimer <= 0) {
                enemyBullets.forEach(b => {
                    const dist = Math.hypot(b.x - player.x, b.y - player.y);
                    if (dist < b.radius + player.radius && player.invulnerableTimer <= 0) {
                        b.toRemove = true;
                        handlePlayerHit();
                    }
                });
            }

            enemies.forEach(e => {
                const dist = Math.hypot(e.x - player.x, e.y - player.y);
                if (dist < e.radius + player.radius && player.invulnerableTimer <= 0) {
                    handlePlayerHit();
                }
            });

            powerUps.forEach(p => {
                const dist = Math.hypot(p.x - player.x, p.y - player.y);
                if (dist < p.radius + player.visualRadius) {
                    p.toRemove = true;
                    audio.playPowerup();

                    if (p.type === 'shield') player.shield = true;
                    else if (p.type === 'slowmo') player.slowMoTimer = 5;
                    else if (p.type === 'drone') player.drones = Math.min(2, player.drones + 1);
                    else if (p.type === 'weapon') {
                        const types = ['dual', 'tesla', 'singularity', 'saws', 'helix', 'supernova', 'prism', 'missiles'];
                        const nextType = types[Math.floor(Math.random() * types.length)];
                        setWeapon(nextType);
                    } else if (p.type === 'clone') player.cloneTimer = 7;
                    else if (p.type === 'hyper') player.hyperBeamTimer = 5;
                    else if (p.type === 'timestop') {
                        player.timeStopTimer = 3.5;
                        audio.playTimeStop();
                    } else if (p.type === 'magnet') player.magnetTimer = 8;
                    else if (p.type === 'bomb') {
                        audio.playNova();
                        screenShake = 16;
                        shockwaves.push(new Shockwave(player.x, player.y, '#ff3300'));
                        enemyBullets = [];
                        enemies.forEach(e => e.takeDamage(350));
                        floatingTexts.push(new FloatingText(player.x, player.y - 40, 'HYPER-NOVA BOMB!', '#ff3300', 24));
                    } else if (p.type === 'heal') player.lives = Math.min(5, player.lives + 1);

                    floatingTexts.push(new FloatingText(player.x, player.y - 20, p.type.toUpperCase(), p.color, 16));
                }
            });
        }

        function drawHUD() {
            ctx.save();
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 6;

            ctx.fillText(`SCORE: ${score}`, 20, 30);
            ctx.fillStyle = '#888888';
            ctx.fillText(`BEST: ${highScore}`, 20, 50);

            ctx.fillStyle = '#00f0ff';
            ctx.fillText(`EMP:`, width - 160, 30);
            ctx.strokeStyle = '#00f0ff';
            ctx.strokeRect(width - 110, 18, 90, 12);
            ctx.fillRect(width - 108, 20, (player.empCharge / 100) * 86, 8);

            // Active Boss HP Bar
            const activeBoss = enemies.find(e => e.type >= 7);
            if (activeBoss) {
                const barWidth = Math.min(260, width * 0.5);
                const barX = (width - barWidth) / 2;
                ctx.fillStyle = activeBoss.color;
                ctx.textAlign = 'center';
                ctx.font = 'bold 12px monospace';
                ctx.fillText(activeBoss.bossName || 'BOSS', width / 2, 22);

                ctx.strokeStyle = activeBoss.color;
                ctx.strokeRect(barX, 28, barWidth, 10);
                ctx.fillRect(barX + 2, 30, Math.max(0, (activeBoss.hp / activeBoss.maxHp) * (barWidth - 4)), 6);
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`LIVES:`, 20, height - 55);
            for (let i = 0; i < player.lives; i++) {
                ctx.beginPath();
                ctx.arc(85 + i * 18, height - 60, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.textAlign = 'right';
            ctx.fillText(`WAVE ${wave}`, width - 20, height - 55);
            ctx.restore();
        }

        function drawSplash(dt) {
            splashTime += dt;

            ctx.save();

            // 1. ANNEAUX DE DISTORSION ET ONDES EN ARRIÈRE-PLAN
            const pulseCenterY = height * 0.42;
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
            ctx.lineWidth = 2;
            for (let r = 0; r < 3; r++) {
                const rad = ((splashTime * 140 + r * 120) % (Math.max(width, height) * 0.6));
                ctx.beginPath();
                ctx.arc(width / 2, pulseCenterY, rad, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // 2. ESCADRILLE D'ENNEMIS SPECTRALES EN DÉFILÉ ARRIÈRE-PLAN
            for (let i = 0; i < 6; i++) {
                const ex = (width * 0.1) + ((i * 140 + splashTime * 90) % (width * 0.85));
                const ey = height * 0.15 + Math.sin(splashTime * 2 + i) * 25;
                ctx.save();
                ctx.translate(ex, ey);
                ctx.shadowColor = i % 2 === 0 ? '#ff00aa' : '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.strokeStyle = i % 2 === 0 ? '#ff00aa' : '#00ffcc';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeRect(-5, -5, 10, 10);
                ctx.restore();
            }

            // Animation de duel cinématique
            const shipX = width / 2 + Math.cos(splashTime * 1.5) * (width * 0.3);
            const shipY = height * 0.68 + Math.sin(splashTime * 3) * 18;
            const bossX = width / 2 - Math.cos(splashTime * 1.5) * (width * 0.3);
            const bossY = height * 0.22;

            // Tir cinématique continu avec particules arc-en-ciel
            if (Math.floor(splashTime * 30) % 2 === 0) {
                particles.push(new Particle(shipX + (Math.random() - 0.5) * 20, shipY - 15, '#00ffff', { x: (Math.random() - 0.5) * 3, y: -14 }, 0.45, 2.5));
                particles.push(new Particle(bossX + (Math.random() - 0.5) * 30, bossY + 25, '#ff0055', { x: (Math.random() - 0.5) * 3, y: 12 }, 0.45, 3));
            }

            // 3. ECLAIRS TESLA ENTRE BOSS, JOUEUR ET BORDURES DU CADRE
            if (Math.random() < 0.6) {
                drawBranchingLightning(shipX, shipY - 20, bossX, bossY + 30);
            }
            if (Math.random() < 0.4) {
                const cornerX = Math.random() < 0.5 ? 20 : width - 20;
                drawBranchingLightning(cornerX, 20, shipX, shipY);
            }

            // Vaisseau Joueur Cinématique
            ctx.save();
            ctx.translate(shipX, shipY);
            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 25;
            ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#00f0ff'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -28); ctx.lineTo(18, 20); ctx.lineTo(0, 9); ctx.lineTo(-18, 20);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            // Anneau d'énergie autour du vaisseau
            ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, 0, 22 + Math.sin(splashTime * 10) * 3, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();

            // Boss Skull Cinématique
            ctx.save();
            ctx.translate(bossX, bossY);
            ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 30;
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -12, 40, Math.PI, 0);
            ctx.lineTo(32, 18); ctx.lineTo(-32, 18);
            ctx.closePath(); ctx.stroke();
            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); ctx.arc(-16, -12, 9, 0, Math.PI * 2); ctx.arc(16, -12, 9, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // ==========================================
            // CADRE CYBERNÉTIQUE ANIMÉ ET ÉCLAIRS TESLA
            // ==========================================
            ctx.save();
            const margin = 16;
            const cornerSize = 50;
            const borderCol = Math.sin(splashTime * 5) > 0 ? '#00f0ff' : '#ff00aa';

            ctx.shadowColor = borderCol;
            ctx.shadowBlur = 22;
            ctx.strokeStyle = borderCol;
            ctx.lineWidth = 3;

            // Bords principaux du cadre
            ctx.beginPath();
            ctx.moveTo(margin + cornerSize, margin); ctx.lineTo(margin, margin); ctx.lineTo(margin, margin + cornerSize);
            ctx.moveTo(width - margin - cornerSize, margin); ctx.lineTo(width - margin, margin); ctx.lineTo(width - margin, margin + cornerSize);
            ctx.moveTo(width - margin, height - margin - cornerSize); ctx.lineTo(width - margin, height - margin); ctx.lineTo(width - margin - cornerSize, height - margin);
            ctx.moveTo(margin + cornerSize, height - margin); ctx.lineTo(margin, height - margin); ctx.lineTo(margin, height - margin - cornerSize);
            ctx.stroke();

            // Viseurs rotatifs sur les 4 coins
            const rot = splashTime * 2.5;
            [
                { x: margin + 14, y: margin + 14 },
                { x: width - margin - 14, y: margin + 14 },
                { x: width - margin - 14, y: height - margin - 14 },
                { x: margin + 14, y: height - margin - 14 }
            ].forEach(pt => {
                ctx.save();
                ctx.translate(pt.x, pt.y);
                ctx.rotate(rot);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.strokeRect(-9, -9, 18, 18);
                ctx.restore();
            });

            // ÉCLAIRS TESLA PERMANENTS SUR TOUT LE CADRE
            if (Math.random() < 0.95) {
                const zaps = [
                    { x1: margin, y1: margin + Math.random() * (height - margin * 2), x2: margin + 45, y2: margin + Math.random() * (height - margin * 2) },
                    { x1: width - margin, y1: margin + Math.random() * (height - margin * 2), x2: width - margin - 45, y2: margin + Math.random() * (height - margin * 2) },
                    { x1: margin + Math.random() * (width - margin * 2), y1: margin, x2: margin + Math.random() * (width - margin * 2), y2: margin + 45 }
                ];
                const pZap = zaps[Math.floor(Math.random() * zaps.length)];
                drawBranchingLightning(pZap.x1, pZap.y1, pZap.x2, pZap.y2);
            }

            // Balises lumineuses texte d'avertissement cyberpunk sur le cadre
            ctx.font = 'bold 11px monospace';
            ctx.fillStyle = borderCol;
            ctx.textAlign = 'left';
            ctx.fillText('⚡ HIGH VOLTAGE TESLA MATRIX', margin + 55, margin + 16);
            ctx.textAlign = 'right';
            ctx.fillText('SYSTEM OVERDRIVE ⚡', width - margin - 55, margin + 16);
            ctx.restore();

            // TITRE SPECTACULAIRE CYBERPUNK NÉON
            ctx.textAlign = 'center';

            const pulse = 1 + Math.sin(splashTime * 4) * 0.05;
            ctx.save();
            ctx.translate(width / 2, pulseCenterY);
            ctx.scale(pulse, pulse);

            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 40;
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 56px monospace';
            ctx.fillText('ZERO VECTOR', 0, 0);

            // Double effet Glitch décalé néon magenta / cyan
            if (Math.random() < 0.25) {
                ctx.fillStyle = '#ff00aa';
                ctx.fillText('ZERO VECTOR', (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8);
                ctx.fillStyle = '#00ffff';
                ctx.fillText('ZERO VECTOR', (Math.random() - 0.5) * -10, (Math.random() - 0.5) * -6);
            }

            ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.fillText('--- ULTRA NEON SHMUP ARCADE ---', 0, 40);
            ctx.restore();

            // BOUTON INTERACTIF ENTRÉE
            ctx.save();
            const btnAlpha = 0.5 + Math.sin(splashTime * 6) * 0.5;
            ctx.globalAlpha = btnAlpha;
            ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 22;
            ctx.fillStyle = '#ff0055';
            ctx.font = 'bold 22px monospace';
            ctx.fillText('[ APPUYEZ SUR ESPACE OU CLIQUEZ ]', width / 2, height * 0.83);
            ctx.restore();

            ctx.font = '12px monospace'; ctx.fillStyle = '#888888';
            ctx.fillText('VITA GAMES PARALLAX ENGINE v4.0', width / 2, height - 25);
            ctx.restore();
        }

        function drawMenu() {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 42px monospace';
            ctx.fillText('ZERO VECTOR', width / 2, height / 3);

            ctx.font = '15px monospace'; ctx.fillStyle = '#00f0ff';
            ctx.fillText('VECTOR NEON SHMUP', width / 2, height / 3 + 35);

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.fillText('CLICK OR PRESS SPACE TO START', width / 2, height / 2 + 40);
            }

            ctx.font = '13px monospace'; ctx.fillStyle = '#888888';
            ctx.fillText('KEYS 1-8: SWITCH WEAPONS | SPACE: EMP', width / 2, height - 60);
            ctx.restore();
        }

        function drawGameOver() {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff0055';
            ctx.font = 'bold 46px monospace';
            ctx.fillText('GAME OVER', width / 2, height / 3);

            ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
            ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace';
            ctx.fillText(`FINAL SCORE: ${score}`, width / 2, height / 2);
            ctx.fillText(`HIGH SCORE: ${highScore}`, width / 2, height / 2 + 30);

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#00f0ff';
                ctx.fillText('CLICK OR PRESS SPACE TO RESTART', width / 2, height / 2 + 90);
            }
            ctx.restore();
        }

        let lastTime = performance.now();

        function gameLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake *= 0.88;
                if (screenShake < 0.5) screenShake = 0;
            }

            updateAndDrawStarfield(dt);
            ctx.globalCompositeOperation = 'lighter';

            if (gameState === STATES.PLAYING) {
                player.update(dt, targetInputX, targetInputY);
                if (player.empCharge < 100) player.empCharge = Math.min(100, player.empCharge + dt * 15);

                updateSpawns(dt);

                if (enemyBullets.length > 30) enemyBullets.splice(0, enemyBullets.length - 30);
                if (playerBullets.length > 25) playerBullets.splice(0, playerBullets.length - 25);
                if (particles.length > 80) particles.splice(0, particles.length - 80);

                playerBullets.forEach(b => b.update(dt));
                enemyBullets.forEach(b => b.update(dt));
                enemies.forEach(e => e.update(dt));
                powerUps.forEach(p => p.update(dt));
                shockwaves.forEach(s => s.update(dt));

                checkCollisions();

                playerBullets = playerBullets.filter(b => !b.toRemove);
                enemyBullets = enemyBullets.filter(b => !b.toRemove);
                enemies = enemies.filter(e => !e.toRemove);
                powerUps = powerUps.filter(p => !p.toRemove);
                shockwaves = shockwaves.filter(s => !s.toRemove);

                playerBullets.forEach(b => b.draw(ctx));
                enemyBullets.forEach(b => b.draw(ctx));
                enemies.forEach(e => e.draw(ctx));
                powerUps.forEach(p => p.draw(ctx));
                shockwaves.forEach(s => s.draw(ctx));
                player.draw(ctx);

                drawHUD();
            } else if (gameState === STATES.SPLASH) {
                drawSplash(dt);
            } else if (gameState === STATES.MENU) {
                drawMenu();
            } else if (gameState === STATES.GAMEOVER) {
                drawGameOver();
            }

            particles.forEach(p => { p.update(dt); p.draw(ctx); });
            particles = particles.filter(p => p.life > 0);

            floatingTexts.forEach(ft => { ft.update(dt); ft.draw(ctx); });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
