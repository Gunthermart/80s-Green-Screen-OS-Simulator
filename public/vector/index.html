<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZeroVector - Neon Shmup Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Roboto, monospace, sans-serif;
            color: #fff;
            touch-action: none;
            -webkit-touch-callout: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #020208;
            touch-action: none;
        }
        .crt-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            z-index: 10;
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 62%, rgba(0,0,0,0.75) 100%);
            z-index: 11;
        }
        #weapon-bar {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: max-content;
            max-width: 96vw;
            gap: 6px;
            z-index: 20;
            background: rgba(4, 8, 20, 0.82);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.35);
            backdrop-filter: blur(6px);
        }
        .weapon-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px 9px;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 0 5px rgba(0,240,255,0.2);
            touch-action: manipulation;
        }
        .weapon-btn.active {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 12px #00f0ff;
        }
        .weapon-btn:active {
            transform: scale(0.93);
        }
        #emp-btn {
            position: absolute;
            right: 14px;
            bottom: 72px;
            z-index: 20;
            padding: 12px 14px;
            border-radius: 50%;
            width: 58px;
            height: 58px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.5px;
            background: rgba(4, 8, 20, 0.85);
            border: 2px solid #555;
            color: #666;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        #emp-btn.ready {
            border-color: #ff0055;
            color: #ffffff;
            background: rgba(255, 0, 85, 0.25);
            box-shadow: 0 0 18px #ff0055, inset 0 0 10px rgba(255, 0, 85, 0.5);
            animation: empPulse 1.2s infinite alternate;
        }
        #emp-btn:active {
            transform: scale(0.9);
        }
        @keyframes empPulse {
            from { transform: scale(1); }
            to { transform: scale(1.07); }
        }
        @media (max-width: 640px) {
            #weapon-bar {
                gap: 4px;
                padding: 5px 6px;
                border-radius: 12px;
            }
            .weapon-btn {
                padding: 5px 6px;
                font-size: 9.5px;
                border-radius: 8px;
            }
            #emp-btn {
                bottom: 84px;
                width: 52px;
                height: 52px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div class="crt-overlay"></div>
        <div class="vignette"></div>
        <button id="emp-btn" type="button" aria-label="Activer EMP">EMP</button>
        <div id="weapon-bar">
            <button class="weapon-btn active" onclick="setWeapon('dual', this)">1: PLASMA</button>
            <button class="weapon-btn" onclick="setWeapon('tesla', this)">2: TESLA</button>
            <button class="weapon-btn" onclick="setWeapon('singularity', this)">3: VORTEX</button>
            <button class="weapon-btn" onclick="setWeapon('saws', this)">4: SAWS</button>
            <button class="weapon-btn" onclick="setWeapon('helix', this)">5: HELIX</button>
            <button class="weapon-btn" onclick="setWeapon('supernova', this)">6: SUPERNOVA</button>
            <button class="weapon-btn" onclick="setWeapon('prism', this)">7: PRISM</button>
            <button class="weapon-btn" onclick="setWeapon('missiles', this)">8: MISSILES</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const empBtn = document.getElementById('emp-btn');
        const weaponBar = document.getElementById('weapon-bar');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let lastTapTime = 0;

        // Game States
        const STATES = { SPLASH: 0, MENU: 1, PLAYING: 2, GAMEOVER: 3 };
        let gameState = STATES.SPLASH;

        // Global Variables
        let score = 0;
        let highScore = parseInt(localStorage.getItem('zerovector_highscore') || '0', 10);
        let wave = 1;
        let screenShake = 0;
        let timeStopTimer = 0;
        let overdriveTimer = 0;
        let frameFlash = 0;
        let splashTime = 0;
        let lastTime = 0;

        let targetInputX = width / 2;
        let targetInputY = height * 0.78;

        // Entity Arrays
        let stars = [];
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let particles = [];
        let shockwaves = [];
        let floatingTexts = [];
        let powerUps = [];
        let orbitalBeams = [];
        let killStats = {};

        // Enemy Metadata for Game Over Carousel
        const ENEMY_CATALOG = {
            1: { name: 'SCOUT VIPER', color: '#ff0055' },
            2: { name: 'PLASMA TURRET', color: '#ffaa00' },
            3: { name: 'VOID JELLY', color: '#aa00ff' },
            4: { name: 'INTERCEPTOR', color: '#00ffaa' },
            5: { name: 'GALAXIAN FLY', color: '#ff3366' },
            6: { name: 'GALAGA BEE', color: '#ffdd00' },
            7: { name: 'DREADNOUGHT', color: '#ff4400' },
            8: { name: 'GALAGA COMMANDER', color: '#00ffcc' },
            9: { name: 'GIGA SKULL 9000', color: '#ff0044' },
            10: { name: 'LA GELÉE COSMIQUE', color: '#44ff44' },
            11: { name: 'TESSERACT OBLITÉRATEUR', color: '#00f0ff' },
            13: { name: 'PIXEL GLITCHER', color: '#00ff66' },
            14: { name: 'ANOMALIE FRAKTALE', color: '#ff00ff' },
            15: { name: 'CYCLOPE STELLAIRE', color: '#ff5500' },
            16: { name: 'PLONGEUR GALAGA', color: '#ff00aa' },
            17: { name: 'TRACTOR BOSS', color: '#00ffff' }
        };

        // Procedural Web Audio Synthesizer
        const audio = {
            ctx: null,
            master: null,
            delayNode: null,
            delayFeedback: null,
            noiseBuffer: null,
            lastHitTime: 0,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    this.ctx = new AudioCtx();

                    // Master Dynamics Compressor for punchy, distortion-free mix
                    const compressor = this.ctx.createDynamicsCompressor();
                    compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
                    compressor.knee.setValueAtTime(18, this.ctx.currentTime);
                    compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
                    compressor.attack.setValueAtTime(0.004, this.ctx.currentTime);
                    compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

                    this.master = this.ctx.createGain();
                    this.master.gain.setValueAtTime(0.75, this.ctx.currentTime);
                    this.master.connect(compressor);
                    compressor.connect(this.ctx.destination);

                    // Sci-Fi Stereo Echo / Shimmer Bus
                    this.delayNode = this.ctx.createDelay(1.0);
                    this.delayNode.delayTime.setValueAtTime(0.16, this.ctx.currentTime);
                    this.delayFeedback = this.ctx.createGain();
                    this.delayFeedback.gain.setValueAtTime(0.32, this.ctx.currentTime);

                    const delayFilter = this.ctx.createBiquadFilter();
                    delayFilter.type = 'bandpass';
                    delayFilter.frequency.setValueAtTime(1400, this.ctx.currentTime);
                    delayFilter.Q.setValueAtTime(1.2, this.ctx.currentTime);

                    this.delayNode.connect(delayFilter);
                    delayFilter.connect(this.delayFeedback);
                    this.delayFeedback.connect(this.delayNode);
                    delayFilter.connect(this.master);

                    // Pre-generate White/Pink Noise Buffer for explosions & plasma bursts
                    const sampleRate = this.ctx.sampleRate;
                    const length = sampleRate * 1.5;
                    this.noiseBuffer = this.ctx.createBuffer(1, length, sampleRate);
                    const data = this.noiseBuffer.getChannelData(0);
                    let b0 = 0, b1 = 0, b2 = 0;
                    for (let i = 0; i < length; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.997 * b0 + white * 0.029;
                        b1 = 0.985 * b1 + white * 0.032;
                        b2 = 0.950 * b2 + white * 0.048;
                        data[i] = (b0 + b1 + b2 + white * 0.18) * 1.4;
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            createPanner(x = width / 2) {
                if (!this.ctx || !this.ctx.createStereoPanner) return this.master;
                const panner = this.ctx.createStereoPanner();
                const panVal = Math.max(-0.85, Math.min(0.85, ((x / Math.max(1, width)) * 2) - 1));
                panner.pan.setValueAtTime(panVal, this.ctx.currentTime);
                panner.connect(this.master);
                return panner;
            },
            playTone(freq, type = 'sawtooth', duration = 0.1, vol = 0.08, slideFreq = null, options = {}) {
                if (!this.ctx || !this.master) return;
                try {
                    const now = this.ctx.currentTime + (options.delay || 0);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const dest = options.panX !== undefined ? this.createPanner(options.panX) : this.master;

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
                    }

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + Math.min(0.012, duration * 0.2));
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    if (options.filterFreq) {
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = options.filterType || 'lowpass';
                        filter.frequency.setValueAtTime(options.filterFreq, now);
                        if (options.filterEnd) {
                            filter.frequency.exponentialRampToValueAtTime(Math.max(40, options.filterEnd), now + duration);
                        }
                        filter.Q.setValueAtTime(options.Q || 3, now);
                        osc.connect(filter);
                        filter.connect(gain);
                    } else {
                        osc.connect(gain);
                    }

                    gain.connect(dest);
                    if (options.wet && this.delayNode) {
                        const wetGain = this.ctx.createGain();
                        wetGain.gain.setValueAtTime(options.wet, now);
                        gain.connect(wetGain);
                        wetGain.connect(this.delayNode);
                    }

                    osc.start(now);
                    osc.stop(now + duration + 0.02);
                } catch (e) {}
            },
            playNoise(duration = 0.25, vol = 0.1, filterFreq = 1000, filterEnd = 200, filterType = 'bandpass', panX = width / 2, wet = 0) {
                if (!this.ctx || !this.noiseBuffer) return;
                try {
                    const now = this.ctx.currentTime;
                    const src = this.ctx.createBufferSource();
                    src.buffer = this.noiseBuffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = filterType;
                    filter.frequency.setValueAtTime(filterFreq, now);
                    filter.frequency.exponentialRampToValueAtTime(Math.max(40, filterEnd), now + duration);
                    filter.Q.setValueAtTime(1.8, now);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    const dest = this.createPanner(panX);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(dest);

                    if (wet > 0 && this.delayNode) {
                        const wetGain = this.ctx.createGain();
                        wetGain.gain.setValueAtTime(wet, now);
                        gain.connect(wetGain);
                        wetGain.connect(this.delayNode);
                    }

                    src.start(now, Math.random() * 0.5, duration);
                } catch (e) {}
            },
            shoot(weapon, x = width / 2) {
                if (!this.ctx) return;
                if (weapon === 'tesla') {
                    const zFreq = 1100 + Math.random() * 650;
                    this.playTone(zFreq, 'square', 0.065, 0.045, 280, { panX: x, wet: 0.25 });
                    this.playNoise(0.055, 0.06, 3200, 900, 'bandpass', x, 0.2);
                } else if (weapon === 'singularity') {
                    this.playTone(135, 'sawtooth', 0.34, 0.09, 34, { panX: x, filterFreq: 650, filterEnd: 90, Q: 7, wet: 0.45 });
                    this.playTone(202, 'sine', 0.32, 0.07, 48, { panX: x, wet: 0.4 });
                } else if (weapon === 'saws') {
                    this.playTone(540, 'sawtooth', 0.11, 0.045, 980, { panX: x, filterFreq: 2400, filterEnd: 800, Q: 6 });
                    this.playTone(810, 'triangle', 0.09, 0.035, 420, { panX: x });
                } else if (weapon === 'helix') {
                    this.playTone(680, 'sine', 0.11, 0.055, 1180, { panX: x - 25, wet: 0.2 });
                    this.playTone(1020, 'triangle', 0.11, 0.04, 540, { panX: x + 25, wet: 0.2 });
                } else if (weapon === 'supernova') {
                    this.playTone(165, 'sawtooth', 0.28, 0.1, 38, { panX: x, filterFreq: 900, filterEnd: 120, Q: 4 });
                    this.playNoise(0.24, 0.09, 1400, 180, 'lowpass', x, 0.35);
                } else if (weapon === 'prism') {
                    const scale = [523.25, 659.25, 783.99, 987.77, 1174.66, 1567.98];
                    const note = scale[Math.floor(Math.random() * scale.length)];
                    this.playTone(note, 'sine', 0.14, 0.045, note * 1.25, { panX: x, wet: 0.55 });
                    this.playTone(note * 2, 'triangle', 0.09, 0.025, note * 2.5, { panX: x, wet: 0.5 });
                } else if (weapon === 'missiles') {
                    this.playNoise(0.11, 0.06, 2600, 750, 'bandpass', x);
                    this.playTone(460, 'triangle', 0.13, 0.055, 1080, { panX: x, wet: 0.25 });
                } else if (weapon === 'hyperbeam') {
                    this.playTone(220, 'sawtooth', 0.09, 0.075, 165, { panX: x, filterFreq: 1800, filterEnd: 600, Q: 5 });
                    this.playTone(442, 'square', 0.08, 0.04, 330, { panX: x });
                } else {
                    // Dual Plasma: punchy sub-laser + resonant filter sweep
                    this.playTone(760, 'sawtooth', 0.085, 0.055, 190, { panX: x, filterFreq: 2800, filterEnd: 420, Q: 3.5 });
                    this.playTone(240, 'sine', 0.065, 0.06, 65, { panX: x });
                }
            },
            hit(x = width / 2) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                if (now - this.lastHitTime < 0.035) return;
                this.lastHitTime = now;
                this.playTone(1350 + Math.random() * 400, 'triangle', 0.04, 0.035, 620, { panX: x });
            },
            explosion(big = false, x = width / 2) {
                if (!this.ctx) return;
                if (big) {
                    // Multi-layered Boss / Bomb detonation
                    this.playTone(115, 'sawtooth', 0.65, 0.18, 22, { panX: x, filterFreq: 420, filterEnd: 45, Q: 3 });
                    this.playTone(75, 'sine', 0.7, 0.2, 18, { panX: x });
                    this.playNoise(0.62, 0.18, 1200, 95, 'lowpass', x, 0.45);
                    this.playNoise(0.35, 0.11, 3400, 600, 'bandpass', x, 0.35);
                } else {
                    // Crisp neon vector shatter
                    this.playTone(195, 'sawtooth', 0.22, 0.095, 32, { panX: x, filterFreq: 850, filterEnd: 90 });
                    this.playNoise(0.2, 0.095, 1800, 180, 'bandpass', x, 0.2);
                }
            },
            powerup(code = '', x = width / 2) {
                if (!this.ctx) return;
                if (code === 'Z') {
                    // Dramatic Time-Stop deceleration dive
                    this.playTone(980, 'sawtooth', 0.55, 0.11, 55, { panX: x, filterFreq: 2200, filterEnd: 120, Q: 5, wet: 0.5 });
                    this.playTone(1480, 'sine', 0.5, 0.09, 82, { panX: x, wet: 0.5 });
                } else if (code === 'T') {
                    // Temporal Overdrive turbine spool-up
                    this.playTone(220, 'sawtooth', 0.45, 0.09, 1320, { panX: x, filterFreq: 600, filterEnd: 3600, Q: 4, wet: 0.4 });
                } else {
                    // Shimmering cyberpunk arpeggio
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        this.playTone(freq, 'triangle', 0.16, 0.075, freq * 1.04, {
                            delay: idx * 0.055,
                            panX: x,
                            wet: 0.45
                        });
                    });
                }
            },
            playerHit(x = width / 2) {
                if (!this.ctx) return;
                this.playTone(150, 'sawtooth', 0.35, 0.16, 35, { panX: x, filterFreq: 900, filterEnd: 80 });
                this.playTone(580, 'square', 0.12, 0.08, 290, { panX: x, delay: 0.04 });
                this.playTone(480, 'square', 0.14, 0.08, 210, { panX: x, delay: 0.14 });
                this.playNoise(0.28, 0.14, 1500, 140, 'lowpass', x);
            },
            weaponSwitch() {
                if (!this.ctx) return;
                this.playTone(440, 'sine', 0.06, 0.06, 880, { wet: 0.25 });
                this.playTone(1174.66, 'triangle', 0.08, 0.05, 1318.5, { delay: 0.035, wet: 0.35 });
            },
            emp() {
                if (!this.ctx) return;
                // Sub-bass shockwave + high-voltage discharge + shimmer tail
                this.playTone(160, 'sawtooth', 0.85, 0.22, 24, { filterFreq: 700, filterEnd: 40, Q: 4, wet: 0.5 });
                this.playTone(95, 'sine', 0.9, 0.24, 20);
                this.playTone(1450, 'sine', 0.55, 0.11, 140, { wet: 0.65 });
                this.playNoise(0.65, 0.16, 2800, 120, 'bandpass', width / 2, 0.55);
            }
        };

        // Starfield Initialization
        function initStarfield() {
            stars = [];
            const count = Math.min(130, Math.floor((width * height) / 7000));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 90 + 30,
                    color: Math.random() > 0.7 ? '#00f0ff' : (Math.random() > 0.5 ? '#ff00aa' : '#ffffff'),
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStarfield();
            if (typeof player !== 'undefined') {
                player.x = Math.max(20, Math.min(width - 20, player.x));
                player.y = Math.max(20, Math.min(height - 70, player.y));
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));

        // Helper Drawing Functions
        function drawLightning(ctx, x1, y1, x2, y2, color = '#00f0ff', branches = 2, displacement = 22) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);

            const segments = 8;
            for (let i = 1; i < segments; i++) {
                const t = i / segments;
                const nx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * displacement;
                const ny = y1 + (y2 - y1) * t + (Math.random() - 0.5) * displacement;
                ctx.lineTo(nx, ny);

                if (branches > 0 && Math.random() < 0.35) {
                    const bx = nx + (Math.random() - 0.5) * displacement * 2.2;
                    const by = ny + (Math.random() - 0.5) * displacement * 2.2;
                    ctx.moveTo(nx, ny);
                    ctx.lineTo(bx, by);
                    ctx.moveTo(nx, ny);
                }
            }
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
        }

        // Visual Effect Classes
        class Particle {
            constructor(x, y, vx, vy, color, life = 0.6, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = size;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.life -= dt;
            }
            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, maxRadius, color = '#00f0ff', duration = 0.5) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = maxRadius;
                this.color = color;
                this.life = duration;
                this.maxLife = duration;
            }
            update(dt) {
                this.life -= dt;
                const progress = 1 - Math.max(0, this.life / this.maxLife);
                this.radius = 5 + (this.maxRadius - 5) * (1 - Math.pow(1 - progress, 3));
            }
            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.lineWidth = 3 * alpha + 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color = '#ffffff') {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1.1;
                this.maxLife = 1.1;
            }
            update(dt) {
                this.y -= 38 * dt;
                this.life -= dt;
            }
            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnExplosion(x, y, color = '#00f0ff', count = 18, big = false) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * (big ? 280 : 170)) + 40;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    i % 3 === 0 ? '#ffffff' : color,
                    (Math.random() * 0.4 + 0.3) * (big ? 1.4 : 1),
                    big ? 4.5 : 3
                ));
            }
            shockwaves.push(new Shockwave(x, y, big ? 140 : 65, color, big ? 0.6 : 0.35));
            if (big) screenShake = Math.max(screenShake, 12);
            audio.explosion(big, x);
        }

        // Goodie / PowerUp Class
        class PowerUp {
            constructor(x, y, forcedType = null) {
                this.x = x;
                this.y = y;
                this.vy = 85;
                this.radius = 15;
                this.age = 0;

                const types = [
                    { code: 'T', name: 'OVERDRIVE TEMPOREL', color: '#ffdd00' },
                    { code: 'D', name: 'DRONES PLASMA', color: '#ff00ff' },
                    { code: 'S', name: 'BOUCLIER NÉOTRONIQUE', color: '#00f0ff' },
                    { code: 'EMP', name: 'CHARGE EMP +50%', color: '#ff0055' },
                    { code: '+', name: 'NANO-RÉPARATION +1', color: '#00ff66' },
                    { code: 'W', name: 'ARME EXOTIQUE', color: '#ff8800' },
                    { code: 'C', name: 'CLONES QUANTIQUES', color: '#00ffff' },
                    { code: 'B', name: 'HYPER-NOVA BOMB', color: '#ff2200' },
                    { code: 'H', name: 'HYPER BEAM OBLITÉRATEUR', color: '#ff9900' },
                    { code: 'Z', name: 'ARRÊT TEMPOREL', color: '#ccf5ff' },
                    { code: 'M', name: 'AIMANT GRAVITATIONNEL', color: '#bb00ff' },
                    { code: 'V', name: 'TROU NOIR ALLIÉ', color: '#9900ff' },
                    { code: 'R', name: 'BOUCLIER RÉFLECTEUR', color: '#ff44aa' },
                    { code: 'F', name: 'PLUIE DE MISSILES', color: '#ff5500' },
                    { code: 'O', name: 'FRAPPE LASER ORBITALE', color: '#ffee44' }
                ];
                const pick = forcedType
                    ? (types.find(t => t.code === forcedType) || types[0])
                    : types[Math.floor(Math.random() * types.length)];

                this.code = pick.code;
                this.name = pick.name;
                this.color = pick.color;
            }
            update(dt) {
                this.age += dt;
                if (player.magnetTimer > 0) {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    this.x += (dx / dist) * 340 * dt;
                    this.y += (dy / dist) * 340 * dt;
                } else {
                    this.y += this.vy * dt;
                    this.x += Math.sin(this.age * 4) * 30 * dt;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                const pulse = 1 + Math.sin(this.age * 8) * 0.12;
                ctx.scale(pulse, pulse);

                ctx.strokeStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 14;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i * Math.PI) / 3 + this.age * 2;
                    const px = Math.cos(a) * this.radius;
                    const py = Math.sin(a) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();

                ctx.fillStyle = 'rgba(5, 10, 25, 0.8)';
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.code, 0, 1);
                ctx.restore();
            }
        }

        // Projectile Class
        class Bullet {
            constructor(x, y, vx, vy, type = 'dual', isEnemy = false, damage = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type;
                this.isEnemy = isEnemy;
                this.damage = damage;
                this.age = 0;
                this.radius = type === 'supernova' ? 14 : (type === 'singularity' ? 12 : (type === 'hyperbeam' ? 16 : 4));
                this.color = isEnemy ? '#ff0055' : this.getWeaponColor(type);
            }
            getWeaponColor(type) {
                switch (type) {
                    case 'tesla': return '#44ffff';
                    case 'singularity': return '#aa00ff';
                    case 'saws': return '#ffaa00';
                    case 'helix': return '#00ff88';
                    case 'supernova': return '#ff4400';
                    case 'prism': return `hsl(${(Date.now() * 0.4) % 360}, 100%, 60%)`;
                    case 'missiles': return '#ff00aa';
                    case 'hyperbeam': return '#ff9900';
                    default: return '#00f0ff';
                }
            }
            update(dt) {
                this.age += dt;
                if (!this.isEnemy && (this.type === 'saws' || this.type === 'missiles')) {
                    let closest = null;
                    let minDist = 360;
                    for (const e of enemies) {
                        const d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            closest = e;
                        }
                    }
                    if (closest) {
                        const desiredAngle = Math.atan2(closest.y - this.y, closest.x - this.x);
                        const currentAngle = Math.atan2(this.vy, this.vx);
                        const speed = Math.hypot(this.vx, this.vy);
                        let diff = desiredAngle - currentAngle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        const newAngle = currentAngle + Math.sign(diff) * Math.min(Math.abs(diff), 7 * dt);
                        this.vx = Math.cos(newAngle) * speed;
                        this.vy = Math.sin(newAngle) * speed;
                    }
                    if (this.type === 'missiles' && Math.random() < 0.6) {
                        particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 30, 40, '#ff00aa', 0.25, 2.5));
                    }
                }

                if (this.type === 'helix' && !this.isEnemy) {
                    this.x += Math.cos(this.age * 18) * 190 * dt;
                }

                if (this.type === 'singularity' && !this.isEnemy) {
                    for (const e of enemies) {
                        const dx = this.x - e.x;
                        const dy = this.y - e.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 140 && dist > 5) {
                            e.x += (dx / dist) * 120 * dt;
                            e.y += (dy / dist) * 120 * dt;
                        }
                    }
                }

                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
            draw(ctx) {
                ctx.save();
                if (this.type === 'prism') {
                    this.color = `hsl(${(this.age * 600) % 360}, 100%, 60%)`;
                }
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;

                if (this.type === 'saws') {
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.age * 16);
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const r = i % 2 === 0 ? 8 : 4;
                        const a = (i * Math.PI) / 4;
                        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    ctx.closePath();
                    ctx.stroke();
                } else if (this.type === 'singularity' || this.type === 'supernova') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + Math.sin(this.age * 20) * 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.type === 'singularity' ? '#120024' : '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else if (this.type === 'hyperbeam') {
                    ctx.fillRect(this.x - 14, this.y - 24, 28, 48);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Player Class
        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height * 0.8;
                this.radius = 14;
                this.lives = 5;
                this.weapon = 'dual';
                this.fireTimer = 0;
                this.empCharge = 100;
                this.invulnerableTimer = 0;

                // Goodie Timers
                this.shieldTimer = 0;
                this.reflectorTimer = 0;
                this.dronesTimer = 0;
                this.clonesTimer = 0;
                this.hyperBeamTimer = 0;
                this.magnetTimer = 0;
                this.blackHoleTimer = 0;
                this.droneAngle = 0;
            }
            update(dt) {
                const dx = targetInputX - this.x;
                const dy = targetInputY - this.y;
                this.x += dx * 0.22;
                this.y += dy * 0.22;

                const bottomLimit = width < 640 ? height - 92 : height - 62;
                this.x = Math.max(20, Math.min(width - 20, this.x));
                this.y = Math.max(24, Math.min(bottomLimit, this.y));

                if (this.invulnerableTimer > 0) this.invulnerableTimer -= dt;
                if (this.shieldTimer > 0) this.shieldTimer -= dt;
                if (this.reflectorTimer > 0) this.reflectorTimer -= dt;
                if (this.dronesTimer > 0) this.dronesTimer -= dt;
                if (this.clonesTimer > 0) this.clonesTimer -= dt;
                if (this.hyperBeamTimer > 0) this.hyperBeamTimer -= dt;
                if (this.magnetTimer > 0) this.magnetTimer -= dt;
                if (this.blackHoleTimer > 0) this.blackHoleTimer -= dt;

                this.droneAngle += dt * 4.5;
                this.empCharge = Math.min(100, this.empCharge + dt * 6.5);

                // Allied Black Hole absorbs enemy bullets
                if (this.blackHoleTimer > 0) {
                    const bhX = this.x + Math.cos(this.droneAngle * 0.8) * 52;
                    const bhY = this.y + Math.sin(this.droneAngle * 0.8) * 52;
                    for (let i = enemyBullets.length - 1; i >= 0; i--) {
                        const eb = enemyBullets[i];
                        if (Math.hypot(eb.x - bhX, eb.y - bhY) < 42) {
                            enemyBullets.splice(i, 1);
                            score += 25;
                            particles.push(new Particle(bhX, bhY, 0, 0, '#aa00ff', 0.3, 4));
                        }
                    }
                }

                // Firing logic
                this.fireTimer -= dt * (overdriveTimer > 0 ? 1.5 : 1.0);
                if (this.fireTimer <= 0) {
                    this.fire();
                }
            }
            fire() {
                const activeW = this.hyperBeamTimer > 0 ? 'hyperbeam' : this.weapon;
                const origins = [{ x: this.x, y: this.y - 14 }];
                if (this.clonesTimer > 0) {
                    origins.push({ x: this.x - 42, y: this.y - 6 });
                    origins.push({ x: this.x + 42, y: this.y - 6 });
                }

                for (const o of origins) {
                    if (activeW === 'hyperbeam') {
                        bullets.push(new Bullet(o.x, o.y - 15, 0, -900, 'hyperbeam', false, 5));
                        this.fireTimer = 0.06;
                    } else if (activeW === 'dual') {
                        bullets.push(new Bullet(o.x - 7, o.y, 0, -680, 'dual', false, 1.2));
                        bullets.push(new Bullet(o.x + 7, o.y, 0, -680, 'dual', false, 1.2));
                        this.fireTimer = 0.13;
                    } else if (activeW === 'tesla') {
                        bullets.push(new Bullet(o.x, o.y, (Math.random() - 0.5) * 90, -720, 'tesla', false, 1.6));
                        const target = enemies[0];
                        if (target && Math.hypot(target.x - o.x, target.y - o.y) < 340) {
                            drawLightning(ctx, o.x, o.y, target.x, target.y, '#44ffff', 2, 18);
                            target.takeDamage(0.9);
                        }
                        this.fireTimer = 0.14;
                    } else if (activeW === 'singularity') {
                        bullets.push(new Bullet(o.x, o.y, 0, -340, 'singularity', false, 3.2));
                        this.fireTimer = 0.36;
                    } else if (activeW === 'saws') {
                        bullets.push(new Bullet(o.x - 10, o.y, -110, -540, 'saws', false, 1.5));
                        bullets.push(new Bullet(o.x + 10, o.y, 110, -540, 'saws', false, 1.5));
                        this.fireTimer = 0.18;
                    } else if (activeW === 'helix') {
                        bullets.push(new Bullet(o.x, o.y, 0, -640, 'helix', false, 1.4));
                        bullets.push(new Bullet(o.x, o.y, 0, -640, 'helix', false, 1.4));
                        this.fireTimer = 0.11;
                    } else if (activeW === 'supernova') {
                        bullets.push(new Bullet(o.x, o.y, 0, -450, 'supernova', false, 4.0));
                        this.fireTimer = 0.34;
                    } else if (activeW === 'prism') {
                        bullets.push(new Bullet(o.x, o.y, 0, -780, 'prism', false, 1.3));
                        bullets.push(new Bullet(o.x, o.y, -130, -750, 'prism', false, 1.1));
                        bullets.push(new Bullet(o.x, o.y, 130, -750, 'prism', false, 1.1));
                        this.fireTimer = 0.12;
                    } else if (activeW === 'missiles') {
                        for (let m = -1.5; m <= 1.5; m += 1) {
                            bullets.push(new Bullet(o.x + m * 8, o.y, m * 120, -520, 'missiles', false, 1.4));
                        }
                        this.fireTimer = 0.24;
                    }
                }

                // Drones fire twin plasma
                if (this.dronesTimer > 0) {
                    const lx = this.x + Math.cos(this.droneAngle) * 32;
                    const ly = this.y + Math.sin(this.droneAngle) * 32;
                    const rx = this.x + Math.cos(this.droneAngle + Math.PI) * 32;
                    const ry = this.y + Math.sin(this.droneAngle + Math.PI) * 32;
                    bullets.push(new Bullet(lx, ly, 0, -680, 'missiles', false, 1));
                    bullets.push(new Bullet(rx, ry, 0, -680, 'missiles', false, 1));
                }

                audio.shoot(activeW, this.x);
            }
            triggerEMP() {
                if (this.empCharge < 100) return;
                this.empCharge = 0;
                audio.emp();
                screenShake = 18;
                frameFlash = 0.8;
                shockwaves.push(new Shockwave(this.x, this.y, Math.max(width, height), '#00f0ff', 0.75));
                floatingTexts.push(new FloatingText(this.x, this.y - 30, 'EMP SHOCKWAVE!', '#00f0ff'));

                enemyBullets = [];
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].takeDamage(18);
                }
            }
            hit() {
                if (this.invulnerableTimer > 0) return;
                if (this.shieldTimer > 0) {
                    this.shieldTimer = 0;
                    this.invulnerableTimer = 1.0;
                    shockwaves.push(new Shockwave(this.x, this.y, 90, '#00f0ff', 0.4));
                    floatingTexts.push(new FloatingText(this.x, this.y - 20, 'SHIELD ABSORBED!', '#00f0ff'));
                    return;
                }
                this.lives--;
                this.invulnerableTimer = 1.8;
                frameFlash = 1.0;
                audio.playerHit(this.x);
                spawnExplosion(this.x, this.y, '#ff0055', 25, true);
                if (this.lives <= 0) {
                    gameState = STATES.GAMEOVER;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('zerovector_highscore', String(highScore));
                    }
                }
            }
            drawShipShape(ctx, x, y, alpha = 1, tint = '#00f0ff') {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y);
                ctx.strokeStyle = tint;
                ctx.fillStyle = '#041022';
                ctx.shadowColor = tint;
                ctx.shadowBlur = 14;
                ctx.lineWidth = 2.2;

                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(15, 14);
                ctx.lineTo(0, 7);
                ctx.lineTo(-15, 14);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Thruster flame
                ctx.fillStyle = '#ff00aa';
                ctx.beginPath();
                ctx.arc(0, 13 + Math.random() * 4, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            draw(ctx) {
                if (this.invulnerableTimer > 0 && Math.floor(Date.now() / 70) % 2 === 0) return;

                // Quantum Clones
                if (this.clonesTimer > 0) {
                    this.drawShipShape(ctx, this.x - 42, this.y + 8, 0.55, '#00ffff');
                    this.drawShipShape(ctx, this.x + 42, this.y + 8, 0.55, '#00ffff');
                }

                this.drawShipShape(ctx, this.x, this.y, 1, '#00f0ff');

                // Prism Shield
                if (this.shieldTimer > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 26, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Reflector Shield
                if (this.reflectorTimer > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#ff44aa';
                    ctx.shadowColor = '#ff44aa';
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 32, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Orbital Drones
                if (this.dronesTimer > 0) {
                    for (let i = 0; i < 2; i++) {
                        const a = this.droneAngle + i * Math.PI;
                        const dx = this.x + Math.cos(a) * 32;
                        const dy = this.y + Math.sin(a) * 32;
                        ctx.save();
                        ctx.fillStyle = '#ff00ff';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(dx, dy, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Allied Black Hole
                if (this.blackHoleTimer > 0) {
                    const bx = this.x + Math.cos(this.droneAngle * 0.8) * 52;
                    const by = this.y + Math.sin(this.droneAngle * 0.8) * 52;
                    ctx.save();
                    ctx.fillStyle = '#140028';
                    ctx.strokeStyle = '#aa00ff';
                    ctx.shadowColor = '#aa00ff';
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(bx, by, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // Enemy Class (Supports Standard, Strange, Galaga/Galaxian 9-Column Matrix, and Bosses)
        class Enemy {
            constructor(x, y, type = 1, options = {}) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.age = 0;
                this.fireTimer = Math.random() * 1.8 + 0.6;
                this.vx = options.vx || 0;
                this.vy = options.vy || 75;

                // Galaga Matrix Formation properties
                this.isMatrix = options.isMatrix || false;
                this.gridCol = options.gridCol || 0;
                this.gridRow = options.gridRow || 0;
                this.matrixState = 'entering';
                this.diveTimer = Math.random() * 6 + 3;
                this.divePhase = 0;

                this.setupStats();
            }
            setupStats() {
                const meta = ENEMY_CATALOG[this.type] || { name: 'HOSTILE', color: '#ff0055' };
                this.color = meta.color;
                this.bossName = meta.name;

                if (this.type === 9) { // GIGA SKULL 9000
                    this.hp = 140 + wave * 25;
                    this.maxHp = this.hp;
                    this.radius = 48;
                    this.vy = 45;
                    this.vx = 95;
                } else if (this.type === 10) { // LA GELÉE COSMIQUE
                    this.hp = 130 + wave * 22;
                    this.maxHp = this.hp;
                    this.radius = 52;
                    this.vy = 95;
                    this.vx = 115;
                    this.enteredScreen = false;
                } else if (this.type === 11) { // LE TESSERACT OBLITÉRATEUR
                    this.hp = 160 + wave * 28;
                    this.maxHp = this.hp;
                    this.radius = 46;
                    this.vy = 40;
                    this.vx = 75;
                    this.beamCharge = 0;
                } else if (this.type === 7 || this.type === 8 || this.type === 17) {
                    this.hp = 75 + wave * 15;
                    this.maxHp = this.hp;
                    this.radius = 34;
                    this.vy = 45;
                    this.vx = 80;
                } else {
                    this.hp = (this.type >= 13 ? 5 : 2) + Math.floor(wave * 0.4);
                    this.maxHp = this.hp;
                    this.radius = this.isMatrix ? 14 : 18;
                }
            }
            takeDamage(dmg) {
                this.hp -= dmg;
                if (this.hp > 0) {
                    audio.hit(this.x);
                } else {
                    const idx = enemies.indexOf(this);
                    if (idx !== -1) {
                        enemies.splice(idx, 1);
                        const isBoss = this.type >= 7 && this.type <= 11;
                        score += isBoss ? 2500 : 120;
                        killStats[this.type] = (killStats[this.type] || 0) + 1;
                        spawnExplosion(this.x, this.y, this.color, isBoss ? 45 : 16, isBoss);
                        if (Math.random() < (isBoss ? 1.0 : 0.22)) {
                            powerUps.push(new PowerUp(this.x, this.y));
                        }
                    }
                }
            }
            update(dt) {
                this.age += dt;
                this.fireTimer -= dt;

                // Galaga / Galaxian 9-Column Rotating Matrix Logic
                if (this.isMatrix) {
                    const cols = 9;
                    const spacingX = Math.min(44, (width - 60) / cols);
                    const spacingY = 34;
                    const centerX = width / 2 + Math.sin(Date.now() * 0.0015) * (width * 0.14);
                    const centerY = 115;
                    const matrixRotation = Math.cos(Date.now() * 0.0015) * 0.15;

                    const relX = (this.gridCol - 4) * spacingX;
                    const relY = (this.gridRow - 1) * spacingY;
                    const targetX = centerX + relX * Math.cos(matrixRotation) - relY * Math.sin(matrixRotation);
                    const targetY = centerY + relX * Math.sin(matrixRotation) + relY * Math.cos(matrixRotation);

                    if (this.matrixState === 'entering') {
                        this.x += (targetX - this.x) * 3.5 * dt;
                        this.y += (targetY - this.y) * 3.5 * dt;
                        if (Math.hypot(targetX - this.x, targetY - this.y) < 12) {
                            this.matrixState = 'formation';
                        }
                    } else if (this.matrixState === 'formation') {
                        this.x = targetX;
                        this.y = targetY;
                        this.diveTimer -= dt;
                        if (this.diveTimer <= 0) {
                            this.matrixState = 'diving';
                            this.divePhase = 0;
                        }
                    } else if (this.matrixState === 'diving') {
                        this.divePhase += dt * 3.2;
                        this.x += Math.sin(this.divePhase * 2) * 180 * dt + (player.x - this.x) * 0.7 * dt;
                        this.y += 230 * dt;
                        if (this.fireTimer <= 0) {
                            this.shootAtPlayer(260);
                            this.fireTimer = 0.9;
                        }
                        if (this.y > height + 30) {
                            this.y = -20;
                            this.matrixState = 'entering';
                            this.diveTimer = Math.random() * 6 + 4;
                        }
                    }
                    return;
                }

                // Bosses & Special Enemies Movement
                if (this.type === 10) { // La Gelée Cosmique
                    if (!this.enteredScreen) {
                        this.y += 90 * dt;
                        if (this.y >= 95) this.enteredScreen = true;
                    } else {
                        this.x += this.vx * dt;
                        this.y += this.vy * dt;
                        if (this.x < 65 && this.vx < 0) this.vx *= -1;
                        if (this.x > width - 65 && this.vx > 0) this.vx *= -1;
                        if (this.y < 75 && this.vy < 0) this.vy *= -1;
                        if (this.y > height * 0.58 && this.vy > 0) this.vy *= -1;
                    }
                    if (this.fireTimer <= 0) {
                        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                            enemyBullets.push(new Bullet(this.x, this.y, Math.cos(a + this.age) * 190, Math.sin(a + this.age) * 190, 'dual', true));
                        }
                        this.fireTimer = 1.6;
                    }
                    return;
                }

                if (this.type === 9 || this.type === 11 || this.type === 7 || this.type === 8 || this.type === 17) {
                    if (this.y < 110) this.y += 65 * dt;
                    this.x += this.vx * dt;
                    if (this.x < 65 || this.x > width - 65) this.vx *= -1;

                    if (this.type === 11) {
                        this.beamCharge += dt;
                        if (this.beamCharge > 4.2) {
                            this.beamCharge = 0;
                            screenShake = 10;
                            enemyBullets.push(new Bullet(this.x, this.y + 30, 0, 520, 'hyperbeam', true));
                        }
                    }

                    if (this.fireTimer <= 0) {
                        this.shootAtPlayer(250);
                        this.fireTimer = 1.1;
                    }
                    return;
                }

                // Standard & Strange Enemies
                if (this.type === 13) {
                    if (Math.random() < 0.06) this.x += (Math.random() - 0.5) * 60;
                    this.y += this.vy * dt;
                } else if (this.type === 14 || this.type === 16) {
                    this.x += Math.sin(this.age * 4) * 140 * dt;
                    this.y += (this.vy + 35) * dt;
                } else {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                }

                this.x = Math.max(20, Math.min(width - 20, this.x));

                if (this.fireTimer <= 0) {
                    this.shootAtPlayer(220);
                    this.fireTimer = Math.max(0.9, 2.3 - wave * 0.08);
                }
            }
            shootAtPlayer(speed = 230) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                enemyBullets.push(new Bullet(this.x, this.y + 12, Math.cos(angle) * speed, Math.sin(angle) * speed, 'dual', true));
            }
            draw(ctx) {
                drawEnemySprite(ctx, this.type, this.x, this.y, this.radius, this.age, this.color);
            }
        }

        // Reusable Neon Enemy Renderer (Used in Game & Game Over Carousel)
        function drawEnemySprite(ctx, type, x, y, radius, age, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 14;
            ctx.lineWidth = 2;

            if (type === 1 || type === 4 || type === 16) {
                // VIPER / INTERCEPTOR / GALAGA DIVER : Chasseur cybernétique à ailes inversées et réacteurs
                const wingFlap = Math.sin(age * 10) * 2.5;
                const grad = ctx.createLinearGradient(0, -radius, 0, radius);
                grad.addColorStop(0, 'rgba(10, 15, 35, 0.9)');
                grad.addColorStop(1, color);
                ctx.fillStyle = grad;

                // Ailes principales acérées
                ctx.beginPath();
                ctx.moveTo(0, radius * 1.15);
                ctx.lineTo(radius * 0.45, radius * 0.2);
                ctx.lineTo(radius * 1.25, -radius * 0.45 + wingFlap);
                ctx.lineTo(radius * 0.9, -radius * 0.85);
                ctx.lineTo(radius * 0.3, -radius * 0.35);
                ctx.lineTo(0, -radius * 0.75);
                ctx.lineTo(-radius * 0.3, -radius * 0.35);
                ctx.lineTo(-radius * 0.9, -radius * 0.85);
                ctx.lineTo(-radius * 1.25, -radius * 0.45 + wingFlap);
                ctx.lineTo(-radius * 0.45, radius * 0.2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Verrière de cockpit lumineuse
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(0, radius * 0.15, radius * 0.2, radius * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tuyères plasma arrière
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.arc(-radius * 0.45, -radius * 0.65, 2.5 + Math.random() * 2, 0, Math.PI * 2);
                ctx.arc(radius * 0.45, -radius * 0.65, 2.5 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 2 || type === 7) {
                // PLASMA TURRET / DREADNOUGHT : Forteresse hexagonale blindée à anneau rotatif
                ctx.save();
                ctx.rotate(age * 1.2);
                ctx.fillStyle = 'rgba(20, 8, 5, 0.9)';
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i * Math.PI) / 3;
                    const px = Math.cos(a) * radius;
                    const py = Math.sin(a) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // Anneau énergétique interne contre-rotatif
                ctx.save();
                ctx.rotate(-age * 2.5);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-radius * 0.48, -radius * 0.48, radius * 0.96, radius * 0.96);
                ctx.restore();

                // Cœur réacteur pulsant
                const coreR = radius * (0.28 + Math.sin(age * 9) * 0.06);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, coreR, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 3) {
                // VOID JELLY : Méduse cosmique bioluminescente avec tentacules ondulants
                const domePulse = Math.sin(age * 6) * 2;
                const grad = ctx.createRadialGradient(0, -radius * 0.2, 2, 0, -radius * 0.2, radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, color);
                grad.addColorStop(1, 'rgba(20, 0, 45, 0.75)');
                ctx.fillStyle = grad;

                // Cloche supérieure
                ctx.beginPath();
                ctx.arc(0, -radius * 0.15, radius * 0.85 + domePulse, Math.PI, 0);
                ctx.quadraticCurveTo(radius * 0.9, radius * 0.25, 0, radius * 0.15);
                ctx.quadraticCurveTo(-radius * 0.9, radius * 0.25, -radius * 0.85 - domePulse, -radius * 0.15);
                ctx.fill();
                ctx.stroke();

                // 5 Tentacules sinusoïdaux
                ctx.lineWidth = 1.8;
                for (let t = -2; t <= 2; t++) {
                    ctx.beginPath();
                    const startX = t * (radius * 0.32);
                    ctx.moveTo(startX, radius * 0.12);
                    for (let seg = 1; seg <= 4; seg++) {
                        const ty = radius * 0.12 + seg * (radius * 0.25);
                        const tx = startX + Math.sin(age * 8 + t + seg * 1.3) * 5;
                        ctx.lineTo(tx, ty);
                    }
                    ctx.stroke();
                }

            } else if (type === 5) {
                // GALAXIAN FLY : Insectoïde iconique aux ailes déployées et mandibules néon
                const flap = Math.sin(age * 16) * 0.18;
                ctx.fillStyle = 'rgba(25, 4, 18, 0.9)';

                // Ailes gauche & droite avec battement rapide
                for (const dir of [-1, 1]) {
                    ctx.save();
                    ctx.scale(dir, 1);
                    ctx.rotate(flap);
                    ctx.beginPath();
                    ctx.moveTo(radius * 0.2, -radius * 0.2);
                    ctx.lineTo(radius * 1.25, -radius * 0.75);
                    ctx.lineTo(radius * 1.05, radius * 0.15);
                    ctx.lineTo(radius * 0.55, radius * 0.55);
                    ctx.lineTo(radius * 0.2, radius * 0.2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // Thorax central & mandibules
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 0.28, radius * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffdd00';
                ctx.beginPath();
                ctx.moveTo(-radius * 0.18, radius * 0.55);
                ctx.lineTo(-radius * 0.35, radius * 0.95);
                ctx.moveTo(radius * 0.18, radius * 0.55);
                ctx.lineTo(radius * 0.35, radius * 0.95);
                ctx.stroke();

            } else if (type === 6) {
                // GALAGA BEE : Abeille cybernétique à abdomen strié et ailes translucides
                const wingBuzz = Math.sin(age * 24) * 3;
                ctx.fillStyle = 'rgba(0, 240, 255, 0.22)';
                ctx.strokeStyle = '#00f0ff';

                // Ailes vibrantes haute fréquence
                ctx.beginPath();
                ctx.ellipse(-radius * 0.65, -radius * 0.1, radius * 0.55, radius * 0.28 + wingBuzz * 0.3, -0.35, 0, Math.PI * 2);
                ctx.ellipse(radius * 0.65, -radius * 0.1, radius * 0.55, radius * 0.28 + wingBuzz * 0.3, 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Corps doré strié
                ctx.strokeStyle = color;
                ctx.fillStyle = '#1a1200';
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 0.42, radius * 0.72, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Rayures néon
                ctx.beginPath();
                ctx.moveTo(-radius * 0.36, -radius * 0.2);
                ctx.lineTo(radius * 0.36, -radius * 0.2);
                ctx.moveTo(-radius * 0.38, radius * 0.15);
                ctx.lineTo(radius * 0.38, radius * 0.15);
                ctx.stroke();

                // Antennes
                ctx.beginPath();
                ctx.moveTo(-4, radius * 0.65);
                ctx.lineTo(-9, radius * 0.98);
                ctx.moveTo(4, radius * 0.65);
                ctx.lineTo(9, radius * 0.98);
                ctx.stroke();

            } else if (type === 8 || type === 17) {
                // GALAGA COMMANDER / TRACTOR BOSS : Vaisseau amiral couronné à pinces
                ctx.fillStyle = 'rgba(0, 28, 32, 0.92)';
                ctx.beginPath();
                ctx.moveTo(0, -radius * 0.95);
                ctx.lineTo(radius * 0.55, -radius * 0.55);
                ctx.lineTo(radius * 1.15, -radius * 0.15);
                ctx.lineTo(radius * 0.85, radius * 0.85);
                ctx.lineTo(radius * 0.4, radius * 0.45);
                ctx.lineTo(0, radius * 0.85);
                ctx.lineTo(-radius * 0.4, radius * 0.45);
                ctx.lineTo(-radius * 0.85, radius * 0.85);
                ctx.lineTo(-radius * 1.15, -radius * 0.15);
                ctx.lineTo(-radius * 0.55, -radius * 0.55);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Joyau énergétique central
                ctx.fillStyle = Math.sin(age * 8) > 0 ? '#ff00aa' : '#ffdd00';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.32, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 9) {
                // GIGA SKULL 9000 : Crâne cyber-biomécanique terrifiant avec implants et mâchoire articulée
                const grad = ctx.createRadialGradient(0, -8, 5, 0, 0, radius);
                grad.addColorStop(0, '#330014');
                grad.addColorStop(1, '#0d0006');
                ctx.fillStyle = grad;

                // Boîte crânienne sculptée
                ctx.beginPath();
                ctx.arc(0, -8, radius * 0.75, Math.PI * 0.88, Math.PI * 0.12);
                ctx.lineTo(radius * 0.68, radius * 0.15);
                ctx.lineTo(radius * 0.45, radius * 0.4);
                ctx.lineTo(-radius * 0.45, radius * 0.4);
                ctx.lineTo(-radius * 0.68, radius * 0.15);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Crête cybernétique frontale
                ctx.strokeStyle = '#00f0ff';
                ctx.beginPath();
                ctx.moveTo(0, -radius * 0.85);
                ctx.lineTo(0, -radius * 0.35);
                ctx.moveTo(-radius * 0.35, -radius * 0.65);
                ctx.lineTo(radius * 0.35, -radius * 0.65);
                ctx.stroke();

                // Mâchoire inférieure claquante avec dents néon
                const jawY = radius * 0.44 + Math.abs(Math.sin(age * 9)) * 9;
                ctx.strokeStyle = color;
                ctx.fillStyle = '#1a000a';
                ctx.beginPath();
                ctx.roundRect(-radius * 0.38, jawY, radius * 0.76, radius * 0.28, 4);
                ctx.fill();
                ctx.stroke();

                for (let tx = -radius * 0.26; tx <= radius * 0.26; tx += radius * 0.13) {
                    ctx.beginPath();
                    ctx.moveTo(tx, jawY);
                    ctx.lineTo(tx, jawY + radius * 0.26);
                    ctx.stroke();
                }

                // Cavité nasale
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(0, radius * 0.04);
                ctx.lineTo(6, radius * 0.22);
                ctx.lineTo(-6, radius * 0.22);
                ctx.closePath();
                ctx.fill();

                // Orbites oculaires laser ardentes
                ctx.fillStyle = '#ffdd00';
                ctx.shadowColor = '#ffdd00';
                ctx.beginPath();
                ctx.arc(-16, -6, 8.5, 0, Math.PI * 2);
                ctx.arc(16, -6, 8.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(-16 + Math.cos(age * 4) * 2.5, -6, 3.5, 0, Math.PI * 2);
                ctx.arc(16 + Math.cos(age * 4) * 2.5, -6, 3.5, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 10) {
                // LA GELÉE COSMIQUE : Gelée géante translucide multi-couches avec bulles internes et œil cyclopéen
                const slimeGrad = ctx.createRadialGradient(0, -8, 6, 0, 0, radius * 1.1);
                slimeGrad.addColorStop(0, 'rgba(180, 255, 180, 0.55)');
                slimeGrad.addColorStop(0.6, 'rgba(40, 255, 90, 0.32)');
                slimeGrad.addColorStop(1, 'rgba(0, 120, 40, 0.15)');
                ctx.fillStyle = slimeGrad;

                // Membrane gélatineuse ondulante
                ctx.beginPath();
                const pts = 20;
                for (let i = 0; i <= pts; i++) {
                    const a = (i / pts) * Math.PI * 2;
                    const wobble = Math.sin(age * 8 + i * 3) * 6.5 + Math.cos(age * 5 - i * 2) * 3;
                    const r = radius + wobble;
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r * 0.86;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 2.8;
                ctx.stroke();

                // Bulles internes flottantes
                ctx.fillStyle = 'rgba(200, 255, 220, 0.45)';
                for (let b = 0; b < 5; b++) {
                    const bx = Math.cos(age * 2 + b * 1.4) * (radius * 0.55);
                    const by = Math.sin(age * 2.5 + b * 1.9) * (radius * 0.45);
                    ctx.beginPath();
                    ctx.arc(bx, by, 3 + (b % 3) * 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Grand œil central loufoque qui suit le joueur
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, -4, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const lookAngle = typeof player !== 'undefined' ? Math.atan2(player.y - y, player.x - x) : age * 3;
                ctx.fillStyle = '#ff0066';
                ctx.beginPath();
                ctx.arc(Math.cos(lookAngle) * 6, -4 + Math.sin(lookAngle) * 6, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(Math.cos(lookAngle) * 7, -4 + Math.sin(lookAngle) * 7, 3, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 11) {
                // TESSERACT OBLITÉRATEUR : Véritable projection d'hypercube 4D aux sommets reliés
                const s1 = radius * 0.78;
                const s2 = radius * (0.38 + Math.sin(age * 3) * 0.08);
                const rot1 = age * 1.1;
                const rot2 = -age * 1.9;

                const outer = [];
                const inner = [];
                for (let i = 0; i < 4; i++) {
                    const a1 = rot1 + (i * Math.PI) / 2 + Math.PI / 4;
                    const a2 = rot2 + (i * Math.PI) / 2 + Math.PI / 4;
                    outer.push({ x: Math.cos(a1) * s1, y: Math.sin(a1) * s1 });
                    inner.push({ x: Math.cos(a2) * s2, y: Math.sin(a2) * s2 });
                }

                // Arêtes de projection 4D
                ctx.strokeStyle = '#ff00aa';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(outer[i].x, outer[i].y);
                    ctx.lineTo(inner[i].x, inner[i].y);
                    ctx.stroke();
                }

                // Cube externe & interne
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                outer.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                inner.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.stroke();

            } else if (type === 13) {
                // PIXEL GLITCHER MATRIX : Entité numérique instable avec aberration chromatique RGB
                const offsets = [
                    { dx: Math.sin(age * 25) * 4, dy: 0, col: '#ff0055' },
                    { dx: -Math.sin(age * 25) * 4, dy: 0, col: '#00f0ff' },
                    { dx: 0, dy: 0, col: color }
                ];
                for (const layer of offsets) {
                    ctx.strokeStyle = layer.col;
                    ctx.fillStyle = 'rgba(0, 255, 102, 0.15)';
                    for (let i = 0; i < 5; i++) {
                        const gx = layer.dx + Math.sin(age * 14 + i * 2) * (radius * 0.55) - 6;
                        const gy = layer.dy + Math.cos(age * 11 + i * 3) * (radius * 0.55) - 6;
                        ctx.fillRect(gx, gy, 12, 12);
                        ctx.strokeRect(gx, gy, 12, 12);
                    }
                }

            } else if (type === 14) {
                // ANOMALIE FRAKTALE : Mandala géométrique sacré en rotation hypnotique avec iris central
                for (let layer = 0; layer < 2; layer++) {
                    ctx.save();
                    ctx.rotate(age * (layer === 0 ? 1.8 : -2.6));
                    ctx.strokeStyle = layer === 0 ? color : '#00f0ff';
                    const r = radius * (layer === 0 ? 0.85 : 0.6);
                    for (let t = 0; t < 2; t++) {
                        ctx.rotate(Math.PI / 3);
                        ctx.beginPath();
                        for (let k = 0; k < 3; k++) {
                            const a = (k * Math.PI * 2) / 3;
                            const px = Math.cos(a) * r;
                            const py = Math.sin(a) * r;
                            if (k === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 15) {
                // CYCLOPE STELLAIRE : Créature arachnide organique néon avec 6 pattes articulées et œil laser
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                for (const side of [-1, 1]) {
                    for (let leg = -1; leg <= 1; leg++) {
                        const waveLeg = Math.sin(age * 10 + leg * 2 + side) * 5;
                        ctx.beginPath();
                        ctx.moveTo(side * radius * 0.4, leg * 5);
                        ctx.lineTo(side * radius * 0.95, leg * 8 - 6 + waveLeg);
                        ctx.lineTo(side * radius * 1.25, leg * 11 + 8 - waveLeg);
                        ctx.stroke();
                    }
                }

                // Bulbe oculaire central
                ctx.fillStyle = '#1f0800';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.65, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffdd00';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.36, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff0022';
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 0.12, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        const player = new Player();
        initStarfield();

        // Weapon Switching
        function setWeapon(weaponName, btnElement) {
            player.weapon = weaponName;
            document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            audio.weaponSwitch();
        }

        // Wave & Squadron Spawner
        let waveSpawnTimer = 1.0;
        function spawnWaveFormation() {
            const pattern = wave % 5;

            if (pattern === 1 || pattern === 3) {
                // Galaga / Galaxian 9-Column Rotating Matrix
                const rows = wave >= 4 ? 3 : 2;
                const cols = 9;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const type = r === 0 ? 8 : (r === 1 ? 6 : 5);
                        enemies.push(new Enemy(
                            width * 0.1 + c * ((width * 0.8) / 8),
                            -40 - r * 38,
                            type,
                            { isMatrix: true, gridCol: c, gridRow: r }
                        ));
                    }
                }
            } else if (pattern === 2) {
                // Escadrille mixte : Chasseurs Viper, Tourelles Plasma et Méduses du Vide
                enemies.push(new Enemy(width * 0.5, -25, 2, { vy: 72 }));
                enemies.push(new Enemy(width * 0.32, -55, 1, { vy: 95 }));
                enemies.push(new Enemy(width * 0.68, -55, 1, { vy: 95 }));
                enemies.push(new Enemy(width * 0.18, -85, 3, { vy: 82 }));
                enemies.push(new Enemy(width * 0.82, -85, 3, { vy: 82 }));
            } else if (pattern === 4) {
                // Vague des anomalies étranges et plongeurs
                enemies.push(new Enemy(width * 0.22, -35, 13, { vy: 70 }));
                enemies.push(new Enemy(width * 0.50, -55, 14, { vy: 65 }));
                enemies.push(new Enemy(width * 0.78, -35, 15, { vy: 70 }));
                enemies.push(new Enemy(width * 0.36, -90, 16, { vy: 85 }));
                enemies.push(new Enemy(width * 0.64, -90, 16, { vy: 85 }));
            } else {
                const bossPool = [9, 10, 11];
                const bossType = bossPool[Math.floor((wave / 5 - 1)) % bossPool.length];
                enemies.push(new Enemy(width / 2, -70, bossType));
            }
            wave++;
        }

        function resetGame() {
            score = 0;
            wave = 1;
