            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];
            shockwaves = [];
            floatingTexts = [];
            powerUps = [];
            orbitalBeams = [];
            killStats = {};

            player.lives = 5;
            player.x = width / 2;
            player.y = height * 0.8;
            targetInputX = player.x;
            targetInputY = player.y;
            player.empCharge = 100;
            player.shieldTimer = 4;

            gameState = STATES.PLAYING;
            waveSpawnTimer = 0.5;
            audio.init();
            audio.powerup();
        }

        function triggerSplashTransition() {
            audio.emp();
            screenShake = 14;
            frameFlash = 0.9;
            shockwaves.push(new Shockwave(width / 2, height / 2, Math.max(width, height), '#00f0ff', 0.65));
            gameState = STATES.MENU;
        }

        // Input Event Listeners
        weaponBar.addEventListener('mousedown', e => e.stopPropagation());
        weaponBar.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

        empBtn.addEventListener('mousedown', e => {
            e.stopPropagation();
            audio.init();
            if (gameState === STATES.PLAYING) player.triggerEMP();
        });
        empBtn.addEventListener('touchstart', e => {
            e.stopPropagation();
            audio.init();
            if (gameState === STATES.PLAYING) player.triggerEMP();
        }, { passive: true });

        function handlePointerMove(e, isTouch = false) {
            const rect = canvas.getBoundingClientRect();
            targetInputX = e.clientX - rect.left;
            const touchOffsetY = isTouch ? 48 : 0;
            targetInputY = (e.clientY - rect.top) - touchOffsetY;
        }

        function handlePointerStart(e, isTouch = false) {
            audio.init();
            if (gameState === STATES.SPLASH) {
                triggerSplashTransition();
            } else if (gameState === STATES.MENU || gameState === STATES.GAMEOVER) {
                resetGame();
            } else if (gameState === STATES.PLAYING) {
                handlePointerMove(e, isTouch);
                if (isTouch) {
                    const now = Date.now();
                    if (now - lastTapTime < 280) {
                        player.triggerEMP();
                    }
                    lastTapTime = now;
                }
            }
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e, false));
        window.addEventListener('mousedown', (e) => handlePointerStart(e, false));

        window.addEventListener('touchmove', (e) => {
            isTouchDevice = true;
            if (e.touches.length > 0) handlePointerMove(e.touches[0], true);
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            isTouchDevice = true;
            if (e.touches.length > 0) handlePointerStart(e.touches[0], true);
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            audio.init();
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === STATES.SPLASH) triggerSplashTransition();
                else if (gameState === STATES.MENU || gameState === STATES.GAMEOVER) resetGame();
                else if (gameState === STATES.PLAYING) player.triggerEMP();
            }
            const weaponKeys = ['dual', 'tesla', 'singularity', 'saws', 'helix', 'supernova', 'prism', 'missiles'];
            if (e.key >= '1' && e.key <= '8') {
                const idx = parseInt(e.key, 10) - 1;
                const btns = document.querySelectorAll('.weapon-btn');
                setWeapon(weaponKeys[idx], btns[idx]);
            }
        });

        // Collisions & Goodie Effects
        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        e.takeDamage(b.damage);
                        if (b.type === 'supernova') {
                            spawnExplosion(b.x, b.y, '#ff4400', 14, false);
                            for (let k = enemyBullets.length - 1; k >= 0; k--) {
                                if (Math.hypot(enemyBullets[k].x - b.x, enemyBullets[k].y - b.y) < 95) {
                                    enemyBullets.splice(k, 1);
                                }
                            }
                        }
                        if (b.type !== 'prism' && b.type !== 'hyperbeam') {
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit || b.y < -40 || b.y > height + 40 || b.x < -40 || b.x > width + 40) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                const dist = Math.hypot(eb.x - player.x, eb.y - player.y);

                if (player.reflectorTimer > 0 && dist < 36) {
                    enemyBullets.splice(i, 1);
                    bullets.push(new Bullet(eb.x, eb.y, -eb.vx * 1.4, -Math.abs(eb.vy) * 1.6, 'missiles', false, 2.5));
                    particles.push(new Particle(eb.x, eb.y, 0, 0, '#ff44aa', 0.3, 5));
                    continue;
                }

                if (dist < eb.radius + player.radius * 0.75) {
                    enemyBullets.splice(i, 1);
                    player.hit();
                    continue;
                }

                if (eb.y > height + 40 || eb.y < -40 || eb.x < -40 || eb.x > width + 40) {
                    enemyBullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius * 0.7) {
                    player.hit();
                    if (e.type < 7) e.takeDamage(999);
                } else if (e.y > height + 60) {
                    enemies.splice(i, 1);
                }
            }

            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                if (Math.hypot(p.x - player.x, p.y - player.y) < p.radius + player.radius + 10) {
                    powerUps.splice(i, 1);
                    audio.powerup(p.code, p.x);
                    score += 300;
                    floatingTexts.push(new FloatingText(player.x, player.y - 28, p.name, p.color));
                    shockwaves.push(new Shockwave(player.x, player.y, 75, p.color, 0.4));

                    if (p.code === 'T') overdriveTimer = 7.0;
                    else if (p.code === 'D') player.dronesTimer = 12.0;
                    else if (p.code === 'S') player.shieldTimer = 14.0;
                    else if (p.code === 'EMP') player.empCharge = Math.min(100, player.empCharge + 50);
                    else if (p.code === '+') player.lives = Math.min(8, player.lives + 1);
                    else if (p.code === 'C') player.clonesTimer = 8.0;
                    else if (p.code === 'H') player.hyperBeamTimer = 5.5;
                    else if (p.code === 'Z') timeStopTimer = 3.8;
                    else if (p.code === 'M') player.magnetTimer = 12.0;
                    else if (p.code === 'V') player.blackHoleTimer = 11.0;
                    else if (p.code === 'R') player.reflectorTimer = 10.0;
                    else if (p.code === 'W') {
                        const exotic = ['tesla', 'singularity', 'saws', 'helix', 'supernova', 'prism', 'missiles'];
                        const pick = exotic[Math.floor(Math.random() * exotic.length)];
                        const btns = document.querySelectorAll('.weapon-btn');
                        const idx = ['dual', ...exotic].indexOf(pick);
                        setWeapon(pick, btns[idx]);
                    } else if (p.code === 'B') {
                        screenShake = 20;
                        frameFlash = 0.9;
                        shockwaves.push(new Shockwave(player.x, player.y, Math.max(width, height), '#ff2200', 0.8));
                        enemyBullets = [];
                        for (let k = enemies.length - 1; k >= 0; k--) {
                            enemies[k].takeDamage(45);
                        }
                    } else if (p.code === 'F') {
                        for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                            bullets.push(new Bullet(player.x, player.y, Math.cos(a) * 460, Math.sin(a) * 460, 'missiles', false, 3));
                        }
                    } else if (p.code === 'O') {
                        for (let ox = 40; ox < width; ox += 85) {
                            orbitalBeams.push({ x: ox, life: 0.7 });
                        }
                        for (let k = enemies.length - 1; k >= 0; k--) {
                            enemies[k].takeDamage(35);
                        }
                    }
                } else if (p.y > height + 40) {
                    powerUps.splice(i, 1);
                }
            }
        }

        // HUD, Splash, Menu, and Game Over Rendering
        function drawHUD() {
            const isMobile = width < 640;
            const hudBottomY = isMobile ? height - 92 : height - 62;

            empBtn.style.display = (gameState === STATES.PLAYING) ? 'flex' : 'none';
            if (player.empCharge >= 100) empBtn.classList.add('ready');
            else empBtn.classList.remove('ready');

            ctx.save();
            ctx.font = `bold ${isMobile ? 13 : 15}px monospace`;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 6;

            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 14, 28);
            ctx.fillStyle = '#888888';
            ctx.fillText(`BEST: ${highScore}`, 14, 46);

            ctx.fillStyle = '#00f0ff';
            const empBarW = isMobile ? 64 : 90;
            const empLabelX = width - empBarW - (isMobile ? 52 : 65);
            ctx.fillText(`EMP:`, empLabelX, 28);
            ctx.strokeStyle = '#00f0ff';
            ctx.strokeRect(width - empBarW - 14, 17, empBarW, 12);
            ctx.fillRect(width - empBarW - 12, 19, (player.empCharge / 100) * (empBarW - 4), 8);

            // Active Boss HP Bar
            const activeBoss = enemies.find(e => e.type >= 7 && e.type <= 11);
            if (activeBoss) {
                const barWidth = Math.min(260, width * 0.48);
                const barX = (width - barWidth) / 2;
                const bossY = isMobile ? 64 : 22;
                ctx.fillStyle = activeBoss.color;
                ctx.textAlign = 'center';
                ctx.font = `bold ${isMobile ? 10 : 12}px monospace`;
                ctx.fillText(activeBoss.bossName || 'BOSS', width / 2, bossY);

                ctx.strokeStyle = activeBoss.color;
                ctx.strokeRect(barX, bossY + 6, barWidth, 9);
                ctx.fillRect(barX + 2, bossY + 8, Math.max(0, (activeBoss.hp / activeBoss.maxHp) * (barWidth - 4)), 5);
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`LIVES:`, 14, hudBottomY);
            for (let i = 0; i < player.lives; i++) {
                ctx.beginPath();
                ctx.arc((isMobile ? 68 : 80) + i * 16, hudBottomY - 5, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.textAlign = 'right';
            ctx.fillText(`WAVE ${wave - 1}`, width - 14, hudBottomY);
            ctx.restore();
        }

        function drawCyberFrame(borderCol = '#00f0ff') {
            const margin = 12;
            ctx.save();
            ctx.strokeStyle = borderCol;
            ctx.shadowColor = borderCol;
            ctx.shadowBlur = 14;
            ctx.lineWidth = 2;

            ctx.strokeRect(margin, margin, width - margin * 2, height - margin * 2);

            const cSize = 22;
            ctx.lineWidth = 3.5;
            const corners = [
                [margin, margin, 1, 1],
                [width - margin, margin, -1, 1],
                [margin, height - margin, 1, -1],
                [width - margin, height - margin, -1, -1]
            ];
            for (const [cx, cy, sx, sy] of corners) {
                ctx.beginPath();
                ctx.moveTo(cx + sx * cSize, cy);
                ctx.lineTo(cx, cy);
                ctx.lineTo(cx, cy + sy * cSize);
                ctx.stroke();
            }

            if (Math.random() < 0.25) {
                drawLightning(ctx, margin, margin, width * 0.25, margin, borderCol, 1, 14);
                drawLightning(ctx, width - margin, height - margin, width * 0.75, height - margin, '#ff00aa', 1, 14);
            }
            ctx.restore();
        }

        function drawSplash(dt) {
            splashTime += dt;
            empBtn.style.display = 'none';

            ctx.save();
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.14)';
            ctx.lineWidth = 1;
            const gridOffset = (splashTime * 60) % 40;
            for (let y = height * 0.5; y < height; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y + gridOffset * 0.5);
                ctx.lineTo(width, y + gridOffset * 0.5);
                ctx.stroke();
            }
            for (let x = -width; x < width * 2; x += 60) {
                ctx.beginPath();
                ctx.moveTo(width / 2 + (x - width / 2) * 0.2, height * 0.5);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            const bossX = width / 2 + Math.sin(splashTime * 1.8) * (width * 0.22);
            const bossY = height * 0.22;
            drawEnemySprite(ctx, 9, bossX, bossY, 42, splashTime, '#ff0055');

            const heroX = width / 2 + Math.cos(splashTime * 2.3) * (width * 0.22);
            const heroY = height * 0.64;
            player.drawShipShape(ctx, heroX, heroY, 0.9, '#00f0ff');

            if (Math.random() < 0.35) {
                drawLightning(ctx, heroX, heroY - 18, bossX, bossY + 25, '#00f0ff', 2, 26);
            }

            drawCyberFrame('#00f0ff');

            const isMobile = width < 640;
            const margin = 12;
            ctx.save();
            ctx.font = `bold ${isMobile ? 8.5 : 10}px monospace`;
            ctx.fillStyle = '#00f0ff';
            ctx.textAlign = 'left';
            ctx.fillText(isMobile ? '⚡ VECTOR MATRIX' : '⚡ HIGH VOLTAGE VECTOR MATRIX', margin + 22, margin + 16);
            ctx.textAlign = 'right';
            ctx.fillText('SYSTEM READY ⚡', width - margin - 22, margin + 16);
            ctx.restore();

            ctx.textAlign = 'center';
            const pulse = 1 + Math.sin(splashTime * 4) * 0.05;
            const titleFontSize = Math.max(28, Math.min(54, Math.floor(width * 0.11)));
            const subFontSize = Math.max(11, Math.min(16, Math.floor(width * 0.035)));

            ctx.save();
            ctx.translate(width / 2, height * 0.42);
            ctx.scale(pulse, pulse);

            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 35;
            ctx.fillStyle = '#ffffff';
            ctx.font = `900 ${titleFontSize}px monospace`;
            ctx.fillText('ZERO VECTOR', 0, 0);

            if (Math.random() < 0.15) {
                ctx.fillStyle = '#ff00aa';
                ctx.fillText('ZERO VECTOR', (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
            }

            ctx.font = `bold ${subFontSize}px monospace`;
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 12;
            ctx.fillText('--- ULTRA NEON SHMUP ARCADE ---', 0, titleFontSize * 0.7);
            ctx.restore();

            ctx.save();
            const btnAlpha = 0.5 + Math.sin(splashTime * 6) * 0.5;
            ctx.globalAlpha = btnAlpha;
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ff0055';
            ctx.font = `bold ${Math.max(13, Math.min(20, Math.floor(width * 0.042)))}px monospace`;
            ctx.fillText(isMobile ? '[ TOUCHEZ POUR DÉMARRER ]' : '[ APPUYEZ SUR ESPACE OU CLIQUEZ ]', width / 2, height * 0.78);
            ctx.restore();

            ctx.font = '11px monospace';
            ctx.fillStyle = '#888888';
            ctx.fillText('VITA GAMES PARALLAX ENGINE v3.0', width / 2, height * 0.85);
            ctx.restore();
        }

        function drawMenu() {
            const isMobile = width < 640;
            empBtn.style.display = 'none';
            ctx.save();
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.max(28, Math.min(44, Math.floor(width * 0.1)))}px monospace`;
            ctx.fillText('ZERO VECTOR', width / 2, height / 3);

            ctx.font = `${isMobile ? 13 : 15}px monospace`;
            ctx.fillStyle = '#00f0ff';
            ctx.fillText('VECTOR NEON SHMUP', width / 2, height / 3 + 32);

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.fillText(isMobile ? 'TOUCHEZ L\'ÉCRAN POUR JOUER' : 'CLICK OR PRESS SPACE TO START', width / 2, height / 2 + 35);
            }

            ctx.font = `${isMobile ? 11 : 13}px monospace`;
            ctx.fillStyle = '#888888';
            ctx.fillText(isMobile ? 'GLISSEZ: PILOTER | DOUBLE-TAP / EMP: ONDE' : 'KEYS 1-8: SWITCH WEAPONS | SPACE: EMP', width / 2, height - (isMobile ? 95 : 65));
            ctx.restore();
        }

        function drawGameOver() {
            const isMobile = width < 640;
            empBtn.style.display = 'none';
            ctx.save();
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff0055';
            ctx.font = `bold ${Math.max(30, Math.min(46, Math.floor(width * 0.11)))}px monospace`;
            ctx.fillText('GAME OVER', width / 2, height * 0.18);

            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#ffffff';
            ctx.font = `${isMobile ? 15 : 18}px monospace`;
            ctx.fillText(`SCORE FINAL: ${score}`, width / 2, height * 0.25);
            ctx.fillText(`MEILLEUR SCORE: ${highScore}`, width / 2, height * 0.30);

            const killedEntries = Object.entries(killStats).filter(([, count]) => count > 0);
            const carouselY = height * 0.48;
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 12px monospace';
            ctx.fillText('--- TABLEAU DE CHASSE ---', width / 2, carouselY - 52);

            if (killedEntries.length > 0) {
                const cardW = 145;
                const totalW = killedEntries.length * cardW;
                const scrollOffset = (Date.now() * 0.055) % totalW;

                for (let copy = -1; copy <= 2; copy++) {
                    killedEntries.forEach(([typeStr, count], idx) => {
                        const type = parseInt(typeStr, 10);
                        const meta = ENEMY_CATALOG[type] || { name: 'HOSTILE', color: '#00f0ff' };
                        const cx = width / 2 + idx * cardW - scrollOffset + copy * totalW;
                        if (cx < -cardW || cx > width + cardW) return;

                        ctx.save();
                        ctx.strokeStyle = meta.color;
                        ctx.fillStyle = 'rgba(6, 12, 26, 0.85)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(cx - 62, carouselY - 34, 124, 78, 10);
                        ctx.fill();
                        ctx.stroke();

                        drawEnemySprite(ctx, type, cx, carouselY - 6, 14, Date.now() * 0.004, meta.color);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 9.5px monospace';
                        ctx.fillText(meta.name.slice(0, 14), cx, carouselY + 21);

                        ctx.fillStyle = meta.color;
                        ctx.font = 'bold 12px monospace';
                        ctx.fillText(`x${count}`, cx, carouselY + 36);
                        ctx.restore();
                    });
                }
            } else {
                ctx.fillStyle = '#888888';
                ctx.font = '12px monospace';
                ctx.fillText('AUCUNE CIBLE ÉLIMINÉE', width / 2, carouselY);
            }

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#00f0ff';
                ctx.font = `${isMobile ? 13 : 15}px monospace`;
                ctx.fillText(isMobile ? 'TOUCHEZ L\'ÉCRAN POUR REJOUER' : 'CLIQUEZ OU APPUYEZ SUR ESPACE POUR REJOUER', width / 2, height * 0.74);
            }
            ctx.restore();
        }

        // Main Animation Loop
        function gameLoop(timestamp) {
            const rawDt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0.016);
            lastTime = timestamp;

            if (timeStopTimer > 0) timeStopTimer -= rawDt;
            if (overdriveTimer > 0) overdriveTimer -= rawDt;
            if (screenShake > 0) screenShake *= 0.88;
            if (frameFlash > 0) frameFlash -= rawDt * 2.5;

            const enemyDt = timeStopTimer > 0 ? 0 : (overdriveTimer > 0 ? rawDt * 0.4 : rawDt);

            ctx.save();
            if (screenShake > 0.5) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, width, height);

            for (const s of stars) {
                s.y += s.speed * (enemyDt || rawDt * 0.2);
                if (s.y > height) {
                    s.y = 0;
                    s.x = Math.random() * width;
                }
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }
            ctx.globalAlpha = 1;

            if (gameState === STATES.SPLASH) {
                drawSplash(rawDt);
            } else if (gameState === STATES.MENU) {
                drawCyberFrame('#00f0ff');
                drawMenu();
            } else if (gameState === STATES.PLAYING) {
                if (enemies.length === 0) {
                    waveSpawnTimer -= rawDt;
                    if (waveSpawnTimer <= 0) {
                        spawnWaveFormation();
                        waveSpawnTimer = 1.5;
                    }
                }

                player.update(rawDt);
                enemies.forEach(e => e.update(enemyDt));
                bullets.forEach(b => b.update(rawDt));
                enemyBullets.forEach(eb => eb.update(enemyDt));
                powerUps.forEach(p => p.update(rawDt));

                checkCollisions();

                for (let i = orbitalBeams.length - 1; i >= 0; i--) {
                    const ob = orbitalBeams[i];
                    ob.life -= rawDt;
                    ctx.save();
                    ctx.fillStyle = `rgba(255, 238, 68, ${Math.max(0, ob.life)})`;
                    ctx.fillRect(ob.x - 12, 0, 24, height);
                    ctx.restore();
                    if (ob.life <= 0) orbitalBeams.splice(i, 1);
                }

                powerUps.forEach(p => p.draw(ctx));
                bullets.forEach(b => b.draw(ctx));
                enemyBullets.forEach(eb => eb.draw(ctx));
                enemies.forEach(e => e.draw(ctx));
                player.draw(ctx);

                const frameColor = timeStopTimer > 0 ? '#ccf5ff' : (overdriveTimer > 0 ? '#ffdd00' : (frameFlash > 0.2 ? '#ff0055' : '#00f0ff'));
                drawCyberFrame(frameColor);
                drawHUD();
            } else if (gameState === STATES.GAMEOVER) {
                drawCyberFrame('#ff0055');
                drawGameOver();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(rawDt);
                particles[i].draw(ctx);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update(rawDt);
                shockwaves[i].draw(ctx);
                if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update(rawDt);
                floatingTexts[i].draw(ctx);
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            if (frameFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${frameFlash * 0.25})`;
                ctx.fillRect(0, 0, width, height);
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
