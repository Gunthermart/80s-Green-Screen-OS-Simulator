<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream — Live Radio, TV & Podcasts Pro</title>
  
  <!-- Hls.js pour la lecture des flux video et audio HLS M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Three.js pour le rendu des animations WebGL 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #111420;
      --bg-surface-elevated: #181c2e;
      --bg-glass: rgba(17, 20, 32, 0.88);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-podcast: #a855f7;
      --accent-live: #ef4444;
      --accent-green: #10b981;

      --sidebar-width: 280px;
      --player-height: 104px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    body.hide-cursor { cursor: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-live);
      text-transform: uppercase;
    }

    .live-badge.is-active { color: #10b981; }
    .live-badge.is-buffering { color: #f59e0b; }
    .live-badge.is-dead { color: #ef4444; }

    .live-dot {
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .brand-section {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-podcast));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
      flex-shrink: 0;
    }

    .nav-tabs {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.88rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
      user-select: none;
    }

    .nav-item:hover { background: var(--bg-surface-elevated); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .badge-counter {
      margin-left: auto;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }

    .sidebar-filters {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-group-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 8px;
      font-weight: 700;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.78rem;
      padding: 5px 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip:hover { border-color: var(--accent-primary); color: #fff; }
    .chip.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.05), transparent 40%), var(--bg-base);
    }

    .top-header {
      height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      background: var(--bg-glass);
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    .search-box { flex: 1; max-width: 460px; position: relative; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .search-input:focus { border-color: var(--accent-primary); }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .btn-header-action {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }
    .btn-header-action:hover { border-color: var(--accent-primary); color: #fff; }

    #content-stage {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px calc(var(--player-height) + 20px) 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #theater-stage {
      width: 100%;
      background: #000;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      overflow: hidden;
      display: none;
      position: relative;
      z-index: 25;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), var(--shadow-glow);
    }

    #theater-stage.active { display: block; }
    #theater-stage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .hud-element { transition: opacity 0.5s ease, transform 0.5s ease; }
    body.hide-hud .hud-element { opacity: 0 !important; pointer-events: none !important; }

    .stage-hud-top {
      position: absolute;
      top: 16px; left: 20px; right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .stage-title-hud {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40%;
    }

    .stage-controls-hud { display: flex; align-items: center; gap: 10px; }

    .stage-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.82rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
      transition: var(--transition-smooth);
    }
    .stage-btn:hover { background: rgba(99, 102, 241, 0.4); }

    .video-viewport {
      width: 100%;
      max-height: 440px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #theater-stage:fullscreen .video-viewport {
      max-height: 100vh !important;
      height: 100vh !important;
    }

    video#unified-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    /* FIX CRITIQUE DE Z-INDEX: Les canvas sont placés DEVANT l'arrière-plan audio mais DERRIÈRE la pochette */
    .canvas-layer { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
    }
    #visualizer-canvas-3d { z-index: 10; display: block; }
    #visualizer-canvas-2d { z-index: 12; display: block; }

    .audio-visualizer-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(17, 20, 32, 0.4) 0%, rgba(9, 10, 15, 0.92) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 3; /* Z-index inférieur aux canvas pour permettre la vue sur les animations */
      pointer-events: none;
    }

    .audio-cover {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface-elevated);
      border: 2px solid var(--border-glass);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 15; /* S'affiche devant le visualiseur */
      pointer-events: auto;
    }
    .audio-cover img { width: 100%; height: 100%; object-fit: cover; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 28;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #sidebar-backdrop.open { display: block; opacity: 1; }

    .station-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--transition-smooth);
      position: relative;
    }

    .station-card:hover { transform: translateY(-4px); background: var(--bg-surface-elevated); border-color: rgba(99, 102, 241, 0.4); }
    .station-card.is-playing { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.12); }

    .card-thumb-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      position: relative;
    }
    .card-thumb-wrapper img { width: 100%; height: 100%; object-fit: contain; background: #000; }

    .card-thumb-fallback-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.2));
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px;
      text-align: center;
      gap: 6px;
    }

    #sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--player-height);
      background: rgba(14, 17, 27, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 24px;
      z-index: 50;
    }

    .player-scrub-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .time-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 44px;
    }
    .time-label.right { text-align: right; }

    .scrub-slider {
      flex: 1;
      height: 4px;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .scrub-slider::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .scrub-slider:hover::-webkit-slider-thumb { transform: scale(1.3); }

    .player-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .player-left { display: flex; align-items: center; gap: 12px; width: 280px; min-width: 200px; }
    .player-thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--bg-surface-elevated); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .player-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .player-controls { display: flex; align-items: center; gap: 10px; }

    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 50%; outline: none; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.08); }
    .ctrl-btn.play-main { width: 42px; height: 42px; background: var(--text-primary); color: var(--bg-base); }
    .ctrl-btn.play-main:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    .toast-notification {
      position: fixed;
      bottom: calc(var(--player-height) + 16px);
      right: 24px;
      background: rgba(17, 20, 32, 0.95);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: var(--radius-full);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      z-index: 100;
      backdrop-filter: blur(12px);
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px; color: var(--text-secondary); grid-column: 1 / -1; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="sidebar-backdrop"></div>
    <aside id="sidebar">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        </div>
        <div class="live-badge" id="live-badge-container">
          <span class="live-dot"></span>
          <span id="player-status-badge">STREAM DIRECT</span>
        </div>
      </div>

      <nav class="nav-tabs">
        <div class="nav-item active" id="tab-radio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
          <span>Radios du Monde</span>
        </div>
        <div class="nav-item" id="tab-tv">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
          <span>Télévision TV</span>
        </div>
        <div class="nav-item" id="tab-pluto">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Pluto TV (Direct 24/7)</span>
        </div>
      </nav>
    </aside>

    <div id="main-wrapper">
      <header class="top-header">
        <button class="mobile-menu-btn" id="mobile-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" class="search-input" placeholder="Rechercher une radio, TV...">
        </div>
      </header>

      <main id="content-stage">
        <section id="theater-stage">
          <div class="stage-hud-top hud-element" id="stage-hud-top">
            <span class="stage-title-hud" id="stage-title">Sélectionnez un média</span>
            <div class="stage-controls-hud">
              <select id="anim-preset-select" class="stage-btn" title="Animation visuelle">
                <option value="cyber">⚡ Spectre Cyber (2D)</option>
                <option value="particles">✨ Particules Pulse (2D)</option>
                <option value="aurora">🌌 Aurore Floue (2D)</option>
                <option value="hyperdrive">🚀 Hyperdrive (3D)</option>
                <option value="sphere">🌐 Sphère Cyber (3D)</option>
                <option value="synthwave">🌅 Grille Synthwave (3D)</option>
                <option value="vortex">🌀 Vortex Quantique (3D)</option>
                <option value="matrix">🧊 Cubes Matrice (3D)</option>
                <option value="neon_tunnel">💠 Tunnel Néon (3D)</option>
                <option value="blackhole">🪐 Trou Noir Cosmique (3D)</option>
                <option value="dna">🧬 Double Hélice (3D)</option>
                <option value="fireworks">🎆 Feux d'Artifice (3D)</option>
                <option value="ocean">🌊 Océan Digital (3D)</option>
                <option value="cybercity">🏙️ Cité Cyberpunk (3D)</option>
                <option value="stargate">🌀 Porte des Étoiles (3D)</option>
                <option value="eclipse">☀️ Éclipse Solaire (3D)</option>
                <option value="tesseract">💎 Tesseract 4D (3D)</option>
                <option value="nebula">🌌 Nébuleuse & Pulsar (3D)</option>
              </select>
            </div>
          </div>

          <div class="video-viewport" id="video-viewport-wrapper">
            <!-- TOILES VISUALISEURS PLACÉES SUR LES BONS CALQUES Z-INDEX -->
            <canvas id="visualizer-canvas-3d" class="canvas-layer"></canvas>
            <canvas id="visualizer-canvas-2d" class="canvas-layer"></canvas>
            <video id="unified-media" playsinline></video>

            <div id="audio-overlay" class="audio-visualizer-overlay hud-element">
              <div class="audio-cover">
                <img id="stage-cover-img" src="" alt="" style="display:none;">
                <svg id="stage-cover-fallback" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
              </div>
            </div>
          </div>
        </section>

        <h2 id="catalog-heading" style="font-size:1.15rem; font-weight:700;">Radios Populaires</h2>
        <div id="stations-grid" class="cards-grid"></div>
      </main>
    </div>

    <footer id="sticky-player">
      <div class="player-main-row">
        <div class="player-left">
          <div class="player-thumb">
            <img id="player-thumb-img" src="" style="display:none;">
            <svg id="player-thumb-fallback" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          </div>
          <div style="overflow:hidden;">
            <div id="player-title" style="font-weight:600; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">En attente</div>
            <div id="player-subtitle" style="font-size:0.75rem; color:var(--text-secondary);">Direct Stream</div>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn play-main" id="btn-play-pause" title="Lecture / Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    class VisualizerEngine {
      constructor(canvas2D, canvas3D, audioElement) {
        this.c2d = canvas2D;
        this.ctx2d = canvas2D ? canvas2D.getContext('2d') : null;
        this.c3d = canvas3D;
        this.audioEl = audioElement;
        this.preset = 'cyber';
        this.isRunning = false;

        this.initAudioAnalyzer();
        try {
          this.initThreeJS();
        } catch(e) {
          console.warn("WebGL non supporté, bascule en 2D:", e);
        }
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.start();
      }

      initAudioAnalyzer() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx && !this.audioCtx) {
            this.audioCtx = new AudioCtx();
            this.analyser = this.audioCtx.createAnalyser();
            this.analyser.fftSize = 64;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            if (this.audioEl) {
              this.source = this.audioCtx.createMediaElementSource(this.audioEl);
              this.source.connect(this.analyser);
              this.analyser.connect(this.audioCtx.destination);
            }
          }
        } catch(e) {
          this.analyser = null;
        }
      }

      getFrequencyData() {
        const isPlaying = this.audioEl && !this.audioEl.paused && !this.audioEl.ended;
        if (!isPlaying) return new Uint8Array(32);

        if (this.analyser && this.dataArray) {
          try {
            this.analyser.getByteFrequencyData(this.dataArray);
            let hasData = false;
            for (let i = 0; i < this.dataArray.length; i++) {
              if (this.dataArray[i] > 0) { hasData = true; break; }
            }
            if (hasData) return this.dataArray;
          } catch(e) {}
        }

        // Math simulation fallback pour contourner les blocages CORS AudioContext
        const fakeData = new Uint8Array(32);
        const time = Date.now() * 0.005;
        for (let i = 0; i < 32; i++) {
          const val = Math.sin(time * 3 + i * 0.2) * 0.5 + 0.5;
          const beat = Math.pow(Math.sin(time * 2), 4) * 0.5;
          const noise = Math.cos(time * 6 - i * 0.1) * 0.2 + 0.2;
          fakeData[i] = Math.min(255, Math.floor((val * 0.4 + beat + noise * 0.3) * 200 + 55));
        }
        return fakeData;
      }

      resize() {
        const parent = this.c2d ? this.c2d.parentElement : null;
        const w = parent ? parent.clientWidth : 800;
        const h = parent ? parent.clientHeight : 450;

        if (this.c2d) {
          this.c2d.width = w;
          this.c2d.height = h;
        }
        if (this.renderer && this.c3d) {
          this.renderer.setSize(w, h, false);
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
        }
      }

      initThreeJS() {
        if (typeof THREE === 'undefined' || !this.c3d) return;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 1000);
        this.camera.position.z = 50;
        this.renderer = new THREE.WebGLRenderer({ canvas: this.c3d, alpha: true, antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.meshGroups = {};

        const sphereGroup = new THREE.Group();
        const sphereGeo = new THREE.IcosahedronGeometry(14, 2);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.85 });
        this.sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        sphereGroup.add(this.sphereMesh);
        this.meshGroups['sphere'] = sphereGroup;

        const hyperGroup = new THREE.Group();
        const starGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPos[i] = (Math.random() - 0.5) * 300;
          starPos[i + 1] = (Math.random() - 0.5) * 300;
          starPos[i + 2] = (Math.random() - 0.5) * 600;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xa855f7, size: 2.2, transparent: true, opacity: 0.9 });
        this.starPoints = new THREE.Points(starGeo, starMat);
        hyperGroup.add(this.starPoints);
        this.meshGroups['hyperdrive'] = hyperGroup;

        const synthGroup = new THREE.Group();
        const gridHelper = new THREE.GridHelper(200, 40, 0x06b6d4, 0x6366f1);
        gridHelper.position.y = -20;
        synthGroup.add(gridHelper);
        this.meshGroups['synthwave'] = synthGroup;

        Object.values(this.meshGroups).forEach(g => {
          g.visible = false;
          this.scene.add(g);
        });
        this.update3DVisibility();
      }

      setPreset(preset) {
        this.preset = preset;
        const is3D = ['hyperdrive', 'sphere', 'synthwave', 'vortex', 'matrix', 'neon_tunnel', 'blackhole', 'dna', 'fireworks', 'ocean', 'cybercity', 'stargate', 'eclipse', 'tesseract', 'nebula'].includes(preset);
        if (this.c2d) this.c2d.style.display = is3D ? 'none' : 'block';
        if (this.c3d) this.c3d.style.display = is3D ? 'block' : 'none';
        this.update3DVisibility();
        this.resize();
      }

      update3DVisibility() {
        if (!this.meshGroups) return;
        Object.keys(this.meshGroups).forEach(k => {
          this.meshGroups[k].visible = (k === this.preset);
        });
      }

      start() {
        if (!this.isRunning) {
          this.isRunning = true;
          this.startLoop();
        }
        this.setPreset(this.preset);
      }

      stop() {
        this.isRunning = false;
      }

      startLoop() {
        const animate = () => {
          if (!this.isRunning) return;
          requestAnimationFrame(animate);

          const freqs = this.getFrequencyData();
          const bass = (freqs[0] + freqs[1] + freqs[2] + freqs[3]) / 4;
          const w = this.c2d ? this.c2d.width : 0;
          const h = this.c2d ? this.c2d.height : 0;

          // Rendu 2D
          if (this.c2d && this.c2d.style.display !== 'none' && w && h) {
            this.ctx2d.clearRect(0, 0, w, h);
            const bars = 28;
            const barW = (w / bars) - 4;
            for (let i = 0; i < bars; i++) {
              const fVal = freqs[i % freqs.length] / 255;
              const bh = fVal * (h * 0.55) + 12;
              const x = i * (barW + 4) + 2;
              const y = h - bh;

              const grad = this.ctx2d.createLinearGradient(0, y, 0, h);
              grad.addColorStop(0, '#a855f7');
              grad.addColorStop(0.5, '#6366f1');
              grad.addColorStop(1, '#06b6d4');

              this.ctx2d.fillStyle = grad;
              this.ctx2d.beginPath();
              this.ctx2d.roundRect(x, y, barW, bh, [6, 6, 0, 0]);
              this.ctx2d.fill();
            }
          }

          // Rendu 3D
          if (this.scene && this.c3d && this.c3d.style.display !== 'none') {
            if (this.sphereMesh) {
              this.sphereMesh.rotation.y += 0.01;
              const scale = 1 + (bass / 255) * 0.4;
              this.sphereMesh.scale.set(scale, scale, scale);
            }
            if (this.starPoints) {
              const positions = this.starPoints.geometry.attributes.position.array;
              const speed = 2 + (bass / 255) * 5;
              for (let i = 2; i < positions.length; i += 3) {
                positions[i] += speed;
                if (positions[i] > 100) positions[i] = -500;
              }
              this.starPoints.geometry.attributes.position.needsUpdate = true;
            }
            this.renderer.render(this.scene, this.camera);
          }
        };
        animate();
      }
    }

    class AppController {
      constructor() {
        this.currentTab = 'radio';
        this.initDOM();
        this.visualizer = new VisualizerEngine(this.canvas2D, this.canvas3D, this.media);
        this.bindEvents();
        this.loadCatalog();
      }

      initDOM() {
        this.grid = document.getElementById('stations-grid');
        this.theater = document.getElementById('theater-stage');
        this.media = document.getElementById('unified-media');
        this.audioOverlay = document.getElementById('audio-overlay');
        this.canvas2D = document.getElementById('visualizer-canvas-2d');
        this.canvas3D = document.getElementById('visualizer-canvas-3d');
      }

      bindEvents() {
        ['radio', 'tv', 'pluto'].forEach(tabId => {
          const el = document.getElementById(`tab-${tabId}`);
          if (el) {
            el.addEventListener('click', () => {
              this.currentTab = tabId;
              document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
              el.classList.add('active');
              this.loadCatalog();
            });
          }
        });

        const animSelect = document.getElementById('anim-preset-select');
        if (animSelect) {
          animSelect.onchange = (e) => {
            this.visualizer.setPreset(e.target.value);
          };
        }

        document.getElementById('btn-play-pause').onclick = () => {
          if (this.media.paused) this.media.play();
          else this.media.pause();
        };

        this.media.onplay = () => {
          if (this.visualizer.audioCtx && this.visualizer.audioCtx.state === 'suspended') {
            this.visualizer.audioCtx.resume();
          }
          document.getElementById('icon-play').style.display = 'none';
          document.getElementById('icon-pause').style.display = 'block';
        };

        this.media.onpause = () => {
          document.getElementById('icon-play').style.display = 'block';
          document.getElementById('icon-pause').style.display = 'none';
        };
      }

      async loadCatalog() {
        this.grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Chargement du catalogue...</p></div>';
        
        let items = [];
        if (this.currentTab === 'radio') {
          items = [
            { id: 'finter', name: 'France Inter', url: 'https://stream.radiofrance.fr/franceinter/franceinter.m3u8?id=radiofrance', type: 'audio' },
            { id: 'finfo', name: 'France Info', url: 'https://stream.radiofrance.fr/franceinfo/franceinfo.m3u8?id=radiofrance', type: 'audio' },
            { id: 'fip', name: 'FIP Radio', url: 'https://stream.radiofrance.fr/fip/fip.m3u8?id=radiofrance', type: 'audio' }
          ];
        } else if (this.currentTab === 'tv') {
          items = [
            { id: 'f24', name: 'France 24 Live', url: 'https://static.france24.com/live/F24_FR_LO_HLS/live_tv.m3u8', type: 'video' },
            { id: 'arte', name: 'ARTE Journal', url: 'https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8', type: 'video' }
          ];
        } else {
          items = [
            { id: 'southpark', name: 'South Park 24/7', url: 'https://stitcher.pluto.tv/stitch/hls/channel/5fa016c68e37600007cdbf83/master.m3u8', type: 'video' },
            { id: 'daria', name: 'Daria 24/7', url: 'https://stitcher.pluto.tv/stitch/hls/channel/5f9b177d8e37600007cdb3c8/master.m3u8', type: 'video' }
          ];
        }

        this.stations = items;
        this.renderGrid();
      }

      renderGrid() {
        this.grid.innerHTML = this.stations.map((s, i) => `
          <div class="station-card" onclick="app.playStation(${i})">
            <div class="card-thumb-wrapper">
              <div class="card-thumb-fallback-box">
                <span style="font-size:1.5rem;">${s.type === 'video' ? '📺' : '📻'}</span>
                <span>${s.name}</span>
              </div>
            </div>
            <div style="font-weight:600; font-size:0.88rem; margin-top:6px;">${s.name}</div>
          </div>
        `).join('');
      }

      playStation(idx) {
        const s = this.stations[idx];
        if (!s) return;

        this.theater.classList.add('active');
        this.theater.scrollIntoView({ behavior: 'smooth' });

        document.getElementById('stage-title').textContent = s.name;
        document.getElementById('player-title').textContent = s.name;

        const isVideo = s.type === 'video';
        if (isVideo) {
          this.audioOverlay.style.display = 'none';
          this.media.style.display = 'block';
          this.visualizer.start(); // Visualiseur actif également pour superposition vidéo si souhaité
        } else {
          this.media.style.display = 'none';
          this.audioOverlay.style.display = 'flex';
          this.visualizer.start();
        }

        if (this.hlsPlayer) this.hlsPlayer.destroy();

        if (Hls.isSupported() && s.url.includes('.m3u8')) {
          this.hlsPlayer = new Hls();
          this.hlsPlayer.loadSource(s.url);
          this.hlsPlayer.attachMedia(this.media);
          this.hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => this.media.play());
        } else {
          this.media.src = s.url;
          this.media.play();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.app = new AppController();
    });
  </script>
</body>
</html>
