<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream — Live Radio & IPTV Player</title>
  
  <!-- Hls.js pour la lecture des flux vidéo/audio M3U8 en direct -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Three.js pour le rendu des animations 3D WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #08090d;
      --bg-surface: #10131e;
      --bg-surface-elevated: #171b2b;
      --bg-glass: rgba(16, 19, 30, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-live: #ef4444;

      --sidebar-width: 280px;
      --player-height: 84px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    body.hide-cursor {
      cursor: none !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .brand-section {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-tabs {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
      user-select: none;
    }

    .nav-item:hover { background: var(--bg-surface-elevated); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .sidebar-filters {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 8px;
      font-weight: 700;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.8rem;
      padding: 6px 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .chip:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .chip.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .card-fav-btn:hover {
      transform: scale(1.15);
      color: #ef4444;
      background: rgba(16, 19, 30, 0.95);
    }

    .card-fav-btn.is-fav {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .card-fav-btn.is-fav svg {
      fill: #ef4444;
      stroke: #ef4444;
    }

    .card-fs-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
      opacity: 0.85;
    }

    .card-fs-btn:hover {
      transform: scale(1.15);
      color: var(--accent-cyan);
      background: rgba(16, 19, 30, 0.95);
      border-color: var(--accent-cyan);
      opacity: 1;
    }

    .toast-notification {
      position: fixed;
      bottom: calc(var(--player-height) + 16px);
      right: 24px;
      background: rgba(17, 20, 32, 0.95);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: var(--radius-full);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      z-index: 100;
      backdrop-filter: blur(12px);
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.05), transparent 40%), var(--bg-base);
    }

    .top-header {
      height: 74px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      background: var(--bg-glass);
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    .search-box { flex: 1; max-width: 480px; position: relative; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .search-input:focus { border-color: var(--accent-primary); }

    #content-stage {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px calc(var(--player-height) + 24px) 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    #theater-stage {
      width: 100%;
      background: #000;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      overflow: hidden;
      display: none;
      position: sticky;
      top: 0;
      z-index: 25;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), var(--shadow-glow);
      backdrop-filter: blur(16px);
    }

    #theater-stage.active { display: block; }
    #theater-stage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .hud-element {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.hide-hud .hud-element {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .stage-hud-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .stage-title-hud {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .stage-controls-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    .stage-btn:hover { background: rgba(99, 102, 241, 0.4); }

    .video-viewport {
      width: 100%;
      max-height: 480px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #theater-stage:fullscreen .video-viewport {
      max-height: 100vh !important;
      height: 100vh !important;
    }

    video#unified-media { width: 100%; height: 100%; object-fit: contain; }

    .canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #visualizer-canvas-2d { z-index: 2; }
    #visualizer-canvas-3d { z-index: 1; }

    .audio-visualizer-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17, 20, 32, 0.85), rgba(9, 10, 15, 0.92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      pointer-events: none;
    }

    .audio-cover {
      width: 110px;
      height: 110px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface-elevated);
      border: 2px solid var(--border-glass);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .audio-cover img { width: 100%; height: 100%; object-fit: cover; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .station-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: var(--transition-smooth);
      position: relative;
    }

    .station-card:hover { transform: translateY(-4px); background: var(--bg-surface-elevated); border-color: rgba(99, 102, 241, 0.4); }
    .station-card.is-playing { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.12); }

    .card-thumb-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      position: relative;
    }
    .card-thumb-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }

    .card-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
    }

    #sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--player-height);
      background: rgba(14, 17, 27, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 50;
    }

    .player-left { display: flex; align-items: center; gap: 14px; min-width: 240px; }
    .player-thumb { width: 52px; height: 52px; border-radius: var(--radius-sm); background: var(--bg-surface-elevated); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .player-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .player-controls { display: flex; align-items: center; gap: 14px; }

    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; outline: none; transition: var(--transition-smooth); }
    .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.08); }
    .ctrl-btn.play-main { width: 48px; height: 48px; background: var(--text-primary); color: var(--bg-base); }
    .ctrl-btn.play-main:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    .player-right { display: flex; align-items: center; gap: 16px; min-width: 220px; justify-content: flex-end; }
    .volume-group { display: flex; align-items: center; gap: 8px; }
    .volume-slider { width: 80px; height: 4px; accent-color: var(--accent-primary); cursor: pointer; }

    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px; color: var(--text-secondary); grid-column: 1 / -1; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 920px) {
      #sidebar { position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .volume-group { display: none; }
      #content-stage { padding: 16px 16px calc(var(--player-height) + 16px) 16px; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <aside id="sidebar">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        </div>
        <span class="brand-title">OmniStream Live</span>
      </div>

      <nav class="nav-tabs">
        <div class="nav-item active" id="tab-radio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Radios du Monde</span>
        </div>
        <div class="nav-item" id="tab-radio-fav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Favoris Radios</span>
          <span id="fav-radio-badge" style="margin-left:auto; font-size:0.7rem; padding:2px 8px; background:rgba(239,68,68,0.2); color:#fca5a5; border-radius:10px; font-weight:700;">0</span>
        </div>

        <div class="nav-item" id="tab-tv" style="margin-top:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Télévision en Direct</span>
        </div>
        <div class="nav-item" id="tab-tv-fav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Favoris TV</span>
          <span id="fav-tv-badge" style="margin-left:auto; font-size:0.7rem; padding:2px 8px; background:rgba(6,182,212,0.2); color:#67e8f9; border-radius:10px; font-weight:700;">0</span>
        </div>
      </nav>

      <div class="sidebar-filters">
        <div class="filter-group-title">Pays / Régions</div>
        <div class="filter-chips" id="country-filters">
          <button class="chip active" data-filter="FR">France</button>
          <button class="chip" data-filter="GLOBAL">Monde</button>
          <button class="chip" data-filter="US">États-Unis</button>
          <button class="chip" data-filter="GB">Royaume-Uni</button>
          <button class="chip" data-filter="CA">Canada</button>
          <button class="chip" data-filter="BE">Belgique</button>
          <button class="chip" data-filter="CH">Suisse</button>
        </div>

        <div class="filter-group-title" style="margin-top:10px;">Thématiques / Genres</div>
        <div class="filter-chips" id="genre-filters">
          <button class="chip active" data-genre="all">Tous</button>
          <button class="chip" data-genre="news">Information</button>
          <button class="chip" data-genre="jazz">Jazz</button>
          <button class="chip" data-genre="pop">Pop</button>
          <button class="chip" data-genre="rock">Rock</button>
          <button class="chip" data-genre="classical">Classique</button>
          <button class="chip" data-genre="electro">Électro</button>
        </div>
      </div>
    </aside>

    <div id="main-wrapper">
      <header class="top-header">
        <button class="mobile-menu-btn" id="mobile-toggle" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" class="search-input" placeholder="Rechercher une station ou chaîne...">
        </div>
        <div id="station-count" style="font-size:0.85rem; color:var(--text-secondary);">Chargement...</div>
      </header>

      <main id="content-stage">
        <section id="theater-stage">
          <div class="stage-hud-top hud-element" id="stage-hud-top">
            <span class="stage-title-hud" id="stage-title">Sélectionnez une station</span>
            <div class="stage-controls-hud">
              <button class="stage-btn" id="btn-stage-fav" title="Ajouter aux favoris">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-stage-fav"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="label-stage-fav">Favori</span>
              </button>
              <select id="anim-preset-select" class="stage-btn" title="Sélection de l'animation visuelle">
                <option value="cyber">Spectre Cyber (2D)</option>
                <option value="particles">Particules Pulse (2D)</option>
                <option value="aurora">Aurore Floue (2D)</option>
                <option value="hyperdrive">🚀 Hyperdrive (3D)</option>
                <option value="sphere">🌐 Sphère Cyber (3D)</option>
                <option value="synthwave">🌅 Grille Synthwave (3D)</option>
                <option value="vortex">🌀 Vortex Quantique (3D)</option>
                <option value="cubes">🧊 Cubes Matrice (3D)</option>
              </select>
              <button class="stage-btn" id="btn-stage-fullscreen" title="Plein écran total [F]">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                Plein Écran
              </button>
            </div>

    class FavoritesStore {
      constructor(onUpdate) {
        this.radioFavs = new Map();
        this.tvFavs = new Map();
        this.onUpdate = onUpdate;
        this.db = null;
        this.auth = null;
        this.userDocRef = null;
        this.idb = null;
        this.initCloud();
        this.initIndexedDB();
      }

      async initCloud() {
        try {
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
          const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
          const { getFirestore, doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

          const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
          if (!firebaseConfig) return;

          const appId = typeof __app_id !== 'undefined' ? __app_id : 'omnistream-app';
          const app = initializeApp(firebaseConfig);
          this.auth = getAuth(app);
          this.db = getFirestore(app);

          const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (token) {
            await signInWithCustomToken(this.auth, token);
          } else {
            await signInAnonymously(this.auth);
          }

          const userId = this.auth.currentUser?.uid || 'anon_user';
          this.userDocRef = doc(this.db, 'artifacts', appId, 'users', userId, 'favorites', 'my_favorites_v2');

          onSnapshot(this.userDocRef, (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              if (Array.isArray(data.radioItems)) {
                data.radioItems.forEach(item => {
                  if (item && item.id) this.radioFavs.set(item.id, item);
                });
              }
              if (Array.isArray(data.tvItems)) {
                data.tvItems.forEach(item => {
                  if (item && item.id) this.tvFavs.set(item.id, item);
                });
              }
              if (this.onUpdate) this.onUpdate();
            }
          }, (err) => {
            console.warn('Synchro cloud favoris indisponible:', err);
          });
        } catch (e) {
          console.info('Mode stockage local actif pour les favoris');
        }
      }

      initIndexedDB() {
        try {
          const request = indexedDB.open('OmniStreamDB', 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('favorites')) {
              db.createObjectStore('favorites', { keyPath: 'id' });
            }
          };
          request.onsuccess = (e) => {
            this.idb = e.target.result;
            this.loadFromIndexedDB();
          };
        } catch (err) {
          console.warn('IndexedDB non disponible:', err);
        }
      }

      loadFromIndexedDB() {
        if (!this.idb) return;
        try {
          const tx = this.idb.transaction('favorites', 'readonly');
          const store = tx.objectStore('favorites');
          const req = store.getAll();
          req.onsuccess = () => {
            const items = req.result || [];
            items.forEach(item => {
              if (item && item.id) {
                if (item.type === 'video') this.tvFavs.set(item.id, item);
                else this.radioFavs.set(item.id, item);
              }
            });
            if (this.onUpdate) this.onUpdate();
          };
        } catch (e) {
          console.warn('Erreur chargement IndexedDB:', e);
        }
      }

      saveToIndexedDB(station, isFav) {
        if (!this.idb) return;
        try {
          const tx = this.idb.transaction('favorites', 'readwrite');
          const store = tx.objectStore('favorites');
          if (isFav) {
            store.put(station);
          } else {
            store.delete(station.id);
          }
        } catch (e) {
          console.warn('Erreur sauvegarde IndexedDB:', e);
        }
      }

      async syncToCloud() {
        if (!this.db || !this.userDocRef) return;
        try {
          const { setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
          await setDoc(this.userDocRef, {
            radioItems: this.getRadioFavs(),
            tvItems: this.getTvFavs(),
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) {
          console.warn('Échec de la sauvegarde cloud des favoris:', e);
        }
      }

      toggle(station) {
        if (!station || !station.id) return false;
        const isTv = station.type === 'video' || station.type === 'tv';
        const store = isTv ? this.tvFavs : this.radioFavs;

        const isFav = store.has(station.id);
        if (isFav) {
          store.delete(station.id);
        } else {
          store.set(station.id, station);
        }

        const newlyFav = !isFav;
        this.saveToIndexedDB(station, newlyFav);
        this.syncToCloud();
        if (this.onUpdate) this.onUpdate();
        return newlyFav;
      }

      isFavorite(id, type = 'audio') {
        if (!id) return false;
        const isTv = type === 'video' || type === 'tv';
        const store = isTv ? this.tvFavs : this.radioFavs;
        return store.has(id);
      }

      getRadioFavs() {
        return Array.from(this.radioFavs.values());
      }

      getTvFavs() {
        return Array.from(this.tvFavs.values());
      }

      getRadioCount() {
        return this.radioFavs.size;
      }

      getTvCount() {
        return this.tvFavs.size;
      }
    }

    class MediaFetcher {
      constructor() {
        this.radioMirrors = [
          'https://de1.api.radio-browser.info',
          'https://nl1.api.radio-browser.info',
          'https://at1.api.radio-browser.info'
        ];
        this.mirrorIndex = 0;
      }

      getMirror() { return this.radioMirrors[this.mirrorIndex]; }
      rotateMirror() { this.mirrorIndex = (this.mirrorIndex + 1) % this.radioMirrors.length; }

      async getRadios(country = 'FR', genre = 'all', search = '') {
        const mirror = this.getMirror();
        let url = `${mirror}/json/stations/bycountrycodeexact/${country.toLowerCase()}?limit=60&order=votes&reverse=true`;
        
        if (search) {
          url = `${mirror}/json/stations/byname/${encodeURIComponent(search)}?limit=60`;
        } else if (genre && genre !== 'all') {
          url = `${mirror}/json/stations/bytag/${encodeURIComponent(genre)}?limit=60&order=votes&reverse=true`;
        } else if (country === 'GLOBAL') {
          url = `${mirror}/json/stations/topvote/60`;
        }

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const formatted = data.map(s => ({
            id: s.stationuuid,
            name: s.name.trim(),
            url: s.url_resolved || s.url,
            logo: s.favicon,
            tags: s.tags ? s.tags.split(',').slice(0, 2).join(', ') : 'Radio',
            type: 'audio'
          })).filter(s => s.url && s.name);
          return formatted.length ? formatted : (BACKUP_DATA[country]?.radios || BACKUP_DATA.FR.radios);
        } catch {
          this.rotateMirror();
          return BACKUP_DATA[country]?.radios || BACKUP_DATA.FR.radios;
        }
      }

      async getTV(country = 'FR', genre = 'all', search = '') {
        try {
          let targetUrl = `https://iptv-org.github.io/iptv/countries/${country.toLowerCase()}.m3u`;
          if (country === 'GLOBAL') {
            targetUrl = `https://iptv-org.github.io/iptv/index.m3u`;
          }

          const res = await fetch(targetUrl);
          if (!res.ok) throw new Error();
          const text = await res.text();
          let parsed = this.parseM3U(text, search);

          if (genre && genre !== 'all') {
            const filterTerm = genre.toLowerCase();
            parsed = parsed.filter(item => item.name.toLowerCase().includes(filterTerm) || item.tags.toLowerCase().includes(filterTerm));
          }

          return parsed.length ? parsed : (BACKUP_DATA[country]?.tv || BACKUP_DATA.FR.tv);
        } catch {
          return BACKUP_DATA[country]?.tv || BACKUP_DATA.FR.tv;
        }
      }

      parseM3U(content, search = '') {
        const lines = content.split('\n');
        const list = [];
        let item = null;

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const name = (line.match(/,(.+)$/) || [])[1] || 'Chaîne TV';
            const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
            const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Direct TV';
            
            // Génération d'un ID unique stable pour chaque chaîne TV
            const cleanId = 'tv_' + (name + logo).toLowerCase().replace(/[^a-z0-9]/g, '_').substring(0, 40);
            item = { id: cleanId, name, logo, tags: group, type: 'video' };
          } else if (line && !line.startsWith('#') && item) {
            item.url = line;
            if (!search || item.name.toLowerCase().includes(search.toLowerCase())) {
              list.push(item);
            }
            item = null;
          }
          if (list.length >= 80) break;
        }
        return list;
      }
    }

    class VisualizerEngine {
      constructor(canvas2D, canvas3D) {
        this.canvas2D = canvas2D;
        this.canvas3D = canvas3D;
        this.ctx2D = canvas2D.getContext('2d');
        
        this.preset = 'cyber';
        this.active = false;

        this.threeRenderer = null;
        this.threeScene = null;
        this.threeCamera = null;
        this.threeMeshGroup = null;
        this.clock = new THREE.Clock();

        this.initThreeJS();
        window.addEventListener('resize', () => this.resize());
      }

      initThreeJS() {
        try {
          this.threeScene = new THREE.Scene();
          this.threeCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          this.threeCamera.position.z = 15;

          this.threeRenderer = new THREE.WebGLRenderer({ canvas: this.canvas3D, alpha: true, antialias: true });
          this.threeRenderer.setSize(this.canvas3D.offsetWidth || 800, this.canvas3D.offsetHeight || 450);
          this.threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          this.threeMeshGroup = new THREE.Group();
          this.threeScene.add(this.threeMeshGroup);

          const tunnelGeo = new THREE.CylinderGeometry(5, 5, 40, 16, 32, true);
          const tunnelMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.35 });
          const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
          tunnel.rotation.x = Math.PI / 2;
          tunnel.name = 'hyperdrive';
          this.threeMeshGroup.add(tunnel);

          const sphereGeo = new THREE.IcosahedronGeometry(4, 2);
          const sphereMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
          const sphere = new THREE.Mesh(sphereGeo, sphereMat);
          sphere.name = 'sphere';
          this.threeMeshGroup.add(sphere);

          const gridHelper = new THREE.GridHelper(40, 40, 0xef4444, 0x6366f1);
          gridHelper.position.y = -4;
          gridHelper.name = 'synthwave';
          this.threeMeshGroup.add(gridHelper);

          const particleCount = 1500;
          const particleGeo = new THREE.BufferGeometry();
          const positions = new Float32Array(particleCount * 3);
          for(let i=0; i<particleCount*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 30;
            positions[i+1] = (Math.random() - 0.5) * 30;
            positions[i+2] = (Math.random() - 0.5) * 30;
          }
          particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const particleMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.15 });
          const vortex = new THREE.Points(particleGeo, particleMat);
          vortex.name = 'vortex';
          this.threeMeshGroup.add(vortex);

          const cubeGroup = new THREE.Group();
          cubeGroup.name = 'cubes';
          for(let x=-2; x<=2; x++) {
            for(let z=-2; z<=2; z++) {
              const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true }));
              box.position.set(x * 2.2, 0, z * 2.2);
              cubeGroup.add(box);
            }
          }
          this.threeMeshGroup.add(cubeGroup);

          this.updateVisibility();
        } catch(e) {
          console.warn('ThreeJS Error:', e);
        }
      }

      setPreset(preset) {
        this.preset = preset;
        this.updateVisibility();
      }

      updateVisibility() {
        const is3D = ['hyperdrive', 'sphere', 'synthwave', 'vortex', 'cubes'].includes(this.preset);
        this.canvas3D.style.display = is3D ? 'block' : 'none';
        this.canvas2D.style.display = is3D ? 'none' : 'block';

        if (this.threeMeshGroup) {
          this.threeMeshGroup.children.forEach(child => {
            child.visible = (child.name === this.preset);
          });
        }
      }

      start() { this.active = true; this.render(); }
      stop() {
        this.active = false;
        this.canvas2D.style.display = 'none';
        this.canvas3D.style.display = 'none';
      }

      resize() {
        const w = this.canvas2D.parentElement.clientWidth;
        const h = this.canvas2D.parentElement.clientHeight;
        this.canvas2D.width = w; this.canvas2D.height = h;
        this.canvas3D.width = w; this.canvas3D.height = h;

        if (this.threeCamera && this.threeRenderer) {
          this.threeCamera.aspect = w / h;
          this.threeCamera.updateProjectionMatrix();
          this.threeRenderer.setSize(w, h);
        }
      }

      render() {
        if (!this.active) return;
        requestAnimationFrame(() => this.render());

        const is3D = ['hyperdrive', 'sphere', 'synthwave', 'vortex', 'cubes'].includes(this.preset);
        const delta = this.clock.getDelta();
        const time = Date.now() * 0.003;

        if (is3D) {
          if (this.threeRenderer && this.threeScene) {
            if (this.preset === 'sphere') {
              const s = this.threeMeshGroup.getObjectByName('sphere');
              if (s) { s.rotation.x += delta * 0.5; s.rotation.y += delta * 0.8; }
            } else if (this.preset === 'vortex') {
              const v = this.threeMeshGroup.getObjectByName('vortex');
              if (v) { v.rotation.y += delta * 0.4; }
            } else if (this.preset === 'cubes') {
              const c = this.threeMeshGroup.getObjectByName('cubes');
              if (c) {
                c.rotation.y += delta * 0.3;
                c.children.forEach((b, idx) => { b.position.y = Math.sin(time + idx) * 1.5; });
              }
            } else if (this.preset === 'hyperdrive') {
              const h = this.threeMeshGroup.getObjectByName('hyperdrive');
              if (h) { h.rotation.z += delta * 0.6; }
            }
            this.threeRenderer.render(this.threeScene, this.threeCamera);
          }
        } else {
          const w = this.canvas2D.width = this.canvas2D.offsetWidth;
          const h = this.canvas2D.height = this.canvas2D.offsetHeight;
          if (!w || !h) return;

          this.ctx2D.clearRect(0, 0, w, h);

          if (this.preset === 'cyber') {
            const barCount = 48;
            const barWidth = w / barCount;
            for (let i = 0; i < barCount; i++) {
              const bh = (Math.sin(time * 2 + i * 0.25) * 0.5 + 0.5) * (h * 0.6) + 10;
              const grad = this.ctx2D.createLinearGradient(0, h, 0, 0);
              grad.addColorStop(0, '#6366f1'); grad.addColorStop(1, '#06b6d4');
              this.ctx2D.fillStyle = grad;
              this.ctx2D.fillRect(i * barWidth + 2, h - bh, barWidth - 4, bh);
            }
          } else if (this.preset === 'particles') {
            for (let i = 0; i < 50; i++) {
              const px = (Math.sin(time + i) * 0.5 + 0.5) * w;
              const py = (Math.cos(time * 0.8 + i * 1.5) * 0.5 + 0.5) * h;
              this.ctx2D.fillStyle = i % 2 === 0 ? 'rgba(99, 102, 241, 0.7)' : 'rgba(6, 182, 212, 0.7)';
              this.ctx2D.beginPath();
              this.ctx2D.arc(px, py, (i % 5) + 3, 0, Math.PI * 2);
              this.ctx2D.fill();
            }
          } else if (this.preset === 'aurora') {
            const g1 = this.ctx2D.createRadialGradient(w * 0.3, h * 0.5, 10, w * 0.3, h * 0.5, w * 0.6);
            g1.addColorStop(0, 'rgba(99, 102, 241, 0.35)'); g1.addColorStop(1, 'transparent');
            this.ctx2D.fillStyle = g1;
            this.ctx2D.fillRect(0, 0, w, h);
          }
        }
      }
    }

    class AppController {
      constructor() {
        this.fetcher = new MediaFetcher();
        this.currentTab = 'radio'; // 'radio' | 'radio-fav' | 'tv' | 'tv-fav'
        this.currentCountry = 'FR';
        this.currentGenre = 'all';
        this.stations = [];
        this.activeStationIndex = -1;
        this.hls = null;
        this.idleTimer = null;

        this.favStore = new FavoritesStore(() => {
          this.updateFavBadges();
          this.updateFavButtonsUI();
          if (this.currentTab === 'radio-fav' || this.currentTab === 'tv-fav') {
            this.loadCatalog();
          }
        });

        this.initDOM();
        this.visualizer = new VisualizerEngine(this.canvas2D, this.canvas3D);
        this.bindEvents();
        this.loadCatalog();
      }

      initDOM() {
        this.grid = document.getElementById('stations-grid');
        this.count = document.getElementById('station-count');
        this.theater = document.getElementById('theater-stage');
        this.media = document.getElementById('unified-media');
        this.sidebar = document.getElementById('sidebar');
        this.audioOverlay = document.getElementById('audio-overlay');
        this.canvas2D = document.getElementById('visualizer-canvas-2d');
        this.canvas3D = document.getElementById('visualizer-canvas-3d');
      }

      bindEvents() {
        document.getElementById('mobile-toggle').onclick = () => this.sidebar.classList.toggle('open');
        document.getElementById('tab-radio').onclick = () => this.switchTab('radio');
        document.getElementById('tab-radio-fav').onclick = () => this.switchTab('radio-fav');
        document.getElementById('tab-tv').onclick = () => this.switchTab('tv');
        document.getElementById('tab-tv-fav').onclick = () => this.switchTab('tv-fav');

        const handleFavToggle = () => {
          if (!this.activeStation) return;
          const station = this.activeStation;
          const added = this.favStore.toggle(station);
          const typeLabel = (station.type === 'video' || station.type === 'tv') ? 'Chaîne TV' : 'Radio';
          this.showToast(added ? `❤️ ${typeLabel} "${station.name}" ajoutée aux favoris` : `Retirée des favoris`);
          this.updateFavButtonsUI();
          if (this.currentTab === 'radio-fav' || this.currentTab === 'tv-fav') {
            this.loadCatalog();
          } else {
            this.renderGrid();
          }
        };

        document.getElementById('btn-stage-fav').onclick = handleFavToggle;
        document.getElementById('btn-player-fav').onclick = handleFavToggle;

        document.getElementById('country-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#country-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentCountry = e.target.dataset.filter;
          this.loadCatalog();
        };

        document.getElementById('genre-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#genre-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentGenre = e.target.dataset.genre;
          this.loadCatalog();
        };

        document.getElementById('global-search').oninput = (e) => {
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => this.loadCatalog(e.target.value), 300);
        };

        document.getElementById('btn-play-pause').onclick = () => {
          if (this.media.paused) this.media.play();
          else this.media.pause();
        };

        document.getElementById('btn-prev').onclick = () => this.playAdjacentStation(-1);
        document.getElementById('btn-next').onclick = () => this.playAdjacentStation(1);

        document.getElementById('volume-range').oninput = (e) => {
          this.media.volume = parseFloat(e.target.value);
        };

        document.getElementById('btn-volume-toggle').onclick = () => {
          this.media.muted = !this.media.muted;
          document.getElementById('icon-vol-high').style.display = this.media.muted ? 'none' : 'block';
          document.getElementById('icon-vol-mute').style.display = this.media.muted ? 'block' : 'none';
        };

        document.getElementById('anim-preset-select').onchange = (e) => {
          this.visualizer.setPreset(e.target.value);
        };

        const toggleFullscreen = () => {
          if (!document.fullscreenElement) this.theater.requestFullscreen();
          else document.exitFullscreen();
        };

        document.getElementById('btn-stage-fullscreen').onclick = toggleFullscreen;
        document.getElementById('btn-fullscreen').onclick = toggleFullscreen;
        this.theater.ondblclick = toggleFullscreen;

        window.addEventListener('keydown', (e) => {
          if ((e.key === 'f' || e.key === 'F') && document.activeElement.tagName !== 'INPUT') {
            toggleFullscreen();
          }
        });

        const resetIdleTimer = () => {
          document.body.classList.remove('hide-hud');
          document.body.classList.remove('hide-cursor');
          clearTimeout(this.idleTimer);
          
          this.idleTimer = setTimeout(() => {
            if (document.fullscreenElement || (this.currentTab === 'radio' && this.theater.classList.contains('active'))) {
              document.body.classList.add('hide-hud');
              if (document.fullscreenElement) document.body.classList.add('hide-cursor');
            }
          }, 3000);
        };

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);

        this.media.onplay = () => {
          document.getElementById('icon-play').style.display = 'none';
          document.getElementById('icon-pause').style.display = 'block';
        };

        this.media.onpause = () => {
          document.getElementById('icon-play').style.display = 'block';
          document.getElementById('icon-pause').style.display = 'none';
        };
      }

      switchTab(tab) {
        this.currentTab = tab;
        document.getElementById('tab-radio').classList.toggle('active', tab === 'radio');
        document.getElementById('tab-radio-fav').classList.toggle('active', tab === 'radio-fav');
        document.getElementById('tab-tv').classList.toggle('active', tab === 'tv');
        document.getElementById('tab-tv-fav').classList.toggle('active', tab === 'tv-fav');

        const heading = document.getElementById('catalog-heading');
        if (tab === 'radio') heading.textContent = 'Radios Populaires';
        else if (tab === 'radio-fav') heading.textContent = 'Mes Radios Favorites';
        else if (tab === 'tv') heading.textContent = 'Télévision en Direct';
        else if (tab === 'tv-fav') heading.textContent = 'Mes Chaînes TV Favorites';

        if (tab === 'tv' || tab === 'tv-fav') {
          this.visualizer.stop();
          document.getElementById('stage-hud-top').style.display = 'none';
        } else {
          document.getElementById('stage-hud-top').style.display = 'flex';
        }

        this.loadCatalog();
      }

      async loadCatalog(search = '') {
        this.grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Chargement des flux multimédias...</p></div>';
        
        if (this.currentTab === 'radio') {
          this.stations = await this.fetcher.getRadios(this.currentCountry, this.currentGenre, search);
        } else if (this.currentTab === 'tv') {
          this.stations = await this.fetcher.getTV(this.currentCountry, this.currentGenre, search);
        } else if (this.currentTab === 'radio-fav') {
          let favs = this.favStore.getRadioFavs();
          if (search) {
            favs = favs.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || (s.tags && s.tags.toLowerCase().includes(search.toLowerCase())));
          }
          this.stations = favs;
        } else if (this.currentTab === 'tv-fav') {
          let favs = this.favStore.getTvFavs();
          if (search) {
            favs = favs.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || (s.tags && s.tags.toLowerCase().includes(search.toLowerCase())));
          }
          this.stations = favs;
        }

        this.count.textContent = `${this.stations.length} flux disponibles (${this.currentCountry})`;
        this.renderGrid();
      }

      renderGrid() {
        if ((this.currentTab === 'radio-fav' || this.currentTab === 'tv-fav') && !this.stations.length) {
          const isTvFav = this.currentTab === 'tv-fav';
          this.grid.innerHTML = `
            <div class="loader-container" style="grid-column: 1 / -1; padding:40px 0;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <p style="font-weight:600; color:var(--text-primary); margin-top:8px;">Aucun favori ${isTvFav ? 'TV' : 'Radio'} enregistré</p>
              <p style="font-size:0.85rem; color:var(--text-secondary);">Cliquez sur le cœur ❤️ d'une ${isTvFav ? 'chaîne TV' : 'station de radio'} pour l'ajouter à vos favoris.</p>
            </div>
          `;
          return;
        }

        this.grid.innerHTML = this.stations.map((s, i) => {
          const isFav = this.favStore.isFavorite(s.id, s.type);
          return `
            <div class="station-card ${this.activeStationIndex === i ? 'is-playing' : ''}" onclick="app.playStation(${i})">
              <div class="card-thumb-wrapper">
                <button class="card-fs-btn" onclick="event.stopPropagation(); app.playStationInFullscreen(${i})" title="Lancer directement en Plein Écran [F]">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
                <button class="card-fav-btn ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); app.toggleFavCard(${i})" title="Favori">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
                ${s.logo ? `<img src="${s.logo}" onerror="this.style.display='none'">` : `<span>${s.name.charAt(0)}</span>`}
              </div>
              <div style="font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</div>
              <div style="font-size:0.75rem; color:var(--text-secondary); display:flex; justify-content:space-between; align-items:center;">
                <span>${s.tags || s.type}</span>
                <span class="card-badge">${s.type === 'video' ? 'TV' : 'RADIO'}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      toggleFavCard(index) {
        const s = this.stations[index];
        if (!s) return;
        const added = this.favStore.toggle(s);
        const typeLabel = (s.type === 'video' || s.type === 'tv') ? 'Chaîne TV' : 'Radio';
        this.showToast(added ? `❤️ ${typeLabel} "${s.name}" ajoutée aux favoris` : `Retirée des favoris`);
        this.updateFavButtonsUI();
        if (this.currentTab === 'radio-fav' || this.currentTab === 'tv-fav') {
          this.loadCatalog();
        } else {
          this.renderGrid();
        }
      }

      updateFavBadges() {
        const radioCount = this.favStore.getRadioCount();
        const tvCount = this.favStore.getTvCount();
        const badgeRadio = document.getElementById('fav-radio-badge');
        const badgeTv = document.getElementById('fav-tv-badge');
        if (badgeRadio) badgeRadio.textContent = radioCount;
        if (badgeTv) badgeTv.textContent = tvCount;
      }

      updateFavButtonsUI() {
        if (!this.activeStation) return;
        const s = this.activeStation;
        const isFav = this.favStore.isFavorite(s.id, s.type);

        const btnStageIcon = document.getElementById('icon-stage-fav');
        const btnStageLabel = document.getElementById('label-stage-fav');
        const btnPlayer = document.getElementById('btn-player-fav');
        const btnPlayerIcon = document.getElementById('icon-player-fav');

        if (btnStageIcon) {
          btnStageIcon.style.fill = isFav ? '#ef4444' : 'none';
          btnStageIcon.style.stroke = isFav ? '#ef4444' : 'currentColor';
        }
        if (btnStageLabel) {
          btnStageLabel.textContent = isFav ? 'Favori ❤️' : 'Favori';
        }
        if (btnPlayer) {
          btnPlayer.style.color = isFav ? '#ef4444' : 'var(--text-secondary)';
        }
        if (btnPlayerIcon) {
          btnPlayerIcon.style.fill = isFav ? '#ef4444' : 'none';
          btnPlayerIcon.style.stroke = isFav ? '#ef4444' : 'currentColor';
        }
      }

      showToast(msg) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.innerHTML = `<span>${msg}</span>`;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(12px)';
          toast.style.transition = 'all 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 2200);
      }

      playStation(index) {
        const s = this.stations[index];
        if (!s) return;

        this.activeStation = s;
        this.activeStationIndex = index;
        this.updateFavButtonsUI();
        this.theater.classList.add('active');
        document.getElementById('player-title').textContent = s.name;
        document.getElementById('player-subtitle').textContent = s.tags || 'Direct Stream';
        document.getElementById('stage-title').textContent = s.name;

        if (s.logo) {
          document.getElementById('player-thumb-img').src = s.logo;
          document.getElementById('player-thumb-img').style.display = 'block';
          document.getElementById('player-thumb-fallback').style.display = 'none';
          document.getElementById('stage-cover-img').src = s.logo;
          document.getElementById('stage-cover-img').style.display = 'block';
          document.getElementById('stage-cover-fallback').style.display = 'none';
        } else {
          document.getElementById('player-thumb-img').style.display = 'none';
          document.getElementById('player-thumb-fallback').style.display = 'block';
          document.getElementById('stage-cover-img').style.display = 'none';
          document.getElementById('stage-cover-fallback').style.display = 'block';
        }

        if (this.hls) {
          this.hls.destroy();
          this.hls = null;
        }

        if (s.type === 'video') {
          this.audioOverlay.style.display = 'none';
          this.visualizer.stop();
          this.media.style.display = 'block';

          if (s.url.includes('.m3u8') && Hls.isSupported()) {
            this.hls = new Hls({ enableWorker: true });
            this.hls.loadSource(s.url);
            this.hls.attachMedia(this.media);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => this.media.play());
          } else {
            this.media.src = s.url;
            this.media.play().catch(() => {});
          }
        } else {
          this.media.style.display = 'none';
          this.audioOverlay.style.display = 'flex';
          this.visualizer.start();
          this.visualizer.resize();

          this.media.src = s.url;
          this.media.play().catch(() => {});
        }

        this.renderGrid();
      }

      playAdjacentStation(direction) {
        if (!this.stations.length) return;
        let nextIndex = this.activeStationIndex + direction;
        if (nextIndex < 0) nextIndex = this.stations.length - 1;
        if (nextIndex >= this.stations.length) nextIndex = 0;
        this.playStation(nextIndex);
      }
    }

    window.onload = () => { window.app = new AppController(); };
  </script>
</body>
</html>
