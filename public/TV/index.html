<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream — Live Radio & IPTV Player</title>
  
  <!-- Hls.js pour la prise en charge des flux .m3u8 en direct -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Three.js pour les animations 3D WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #111420;
      --bg-surface-elevated: #181c2e;
      --bg-glass: rgba(17, 20, 32, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-live: #ef4444;

      --sidebar-width: 280px;
      --player-height: 84px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    body.hide-cursor {
      cursor: none !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .brand-section {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-tabs {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
      user-select: none;
    }

    .nav-item:hover { background: var(--bg-surface-elevated); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .sidebar-filters {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 8px;
      font-weight: 700;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.8rem;
      padding: 6px 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .chip:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .chip.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

    /* Main Container */
    #main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.05), transparent 40%), var(--bg-base);
    }

    .top-header {
      height: 74px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      background: var(--bg-glass);
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    .search-box { flex: 1; max-width: 480px; position: relative; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .search-input:focus { border-color: var(--accent-primary); }

    #content-stage {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px calc(var(--player-height) + 24px) 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Stage Théâtre (Media Viewport) */
    #theater-stage {
      width: 100%;
      background: #000;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      overflow: hidden;
      display: none;
      position: relative;
    }

    #theater-stage.active { display: block; }
    #theater-stage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    /* HUD elements with smooth transition for 3s inactivity hide */
    .hud-element {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.hide-hud .hud-element {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .stage-hud-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .stage-title-hud {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .stage-controls-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    .stage-btn:hover { background: rgba(99, 102, 241, 0.4); }

    .video-viewport {
      width: 100%;
      max-height: 480px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #theater-stage:fullscreen .video-viewport {
      max-height: 100vh !important;
      height: 100vh !important;
    }

    video#unified-media { width: 100%; height: 100%; object-fit: contain; }

    .audio-visualizer-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17, 20, 32, 0.95), rgba(9, 10, 15, 0.98));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
    }

    .audio-cover {
      width: 110px;
      height: 110px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface-elevated);
      border: 2px solid var(--border-glass);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .audio-cover img { width: 100%; height: 100%; object-fit: cover; }

    canvas#visualizer-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Station Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .station-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: var(--transition-smooth);
    }

    .station-card:hover { transform: translateY(-4px); background: var(--bg-surface-elevated); border-color: rgba(99, 102, 241, 0.4); }
    .station-card.is-playing { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.12); }

    .card-thumb-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-glass);
    }
    .card-thumb-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }

    /* Bottom Sticky Player */
    #sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--player-height);
      background: rgba(14, 17, 27, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 50;
    }

    .player-left { display: flex; align-items: center; gap: 14px; min-width: 240px; }
    .player-thumb { width: 52px; height: 52px; border-radius: var(--radius-sm); background: var(--bg-surface-elevated); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .player-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .player-controls { display: flex; align-items: center; gap: 14px; }

    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; outline: none; transition: var(--transition-smooth); }
    .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.08); }
    .ctrl-btn.play-main { width: 48px; height: 48px; background: var(--text-primary); color: var(--bg-base); }
    .ctrl-btn.play-main:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    .player-right { display: flex; align-items: center; gap: 16px; min-width: 220px; justify-content: flex-end; }
    .volume-group { display: flex; align-items: center; gap: 8px; }
    .volume-slider { width: 80px; height: 4px; accent-color: var(--accent-primary); cursor: pointer; }

    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px; color: var(--text-secondary); grid-column: 1 / -1; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 920px) {
      #sidebar { position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .volume-group { display: none; }
      #content-stage { padding: 16px 16px calc(var(--player-height) + 16px) 16px; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        </div>
        <span class="brand-title">OmniStream Live</span>
      </div>

      <nav class="nav-tabs">
        <div class="nav-item active" id="tab-radio"><span class="brand-title" style="font-size:0.95rem;">Radios du Monde</span></div>
        <div class="nav-item" id="tab-tv"><span class="brand-title" style="font-size:0.95rem;">Télévision en Direct</span></div>
      </nav>

      <div class="sidebar-filters">
        <div class="filter-group-title">Pays / Régions</div>
        <div class="filter-chips" id="country-filters">
          <button class="chip active" data-filter="FR">France</button>
          <button class="chip" data-filter="GLOBAL">Monde</button>
          <button class="chip" data-filter="US">États-Unis</button>
          <button class="chip" data-filter="GB">Royaume-Uni</button>
          <button class="chip" data-filter="CA">Canada</button>
          <button class="chip" data-filter="BE">Belgique</button>
          <button class="chip" data-filter="CH">Suisse</button>
        </div>

        <div class="filter-group-title" style="margin-top:10px;">Thématiques / Genres</div>
        <div class="filter-chips" id="genre-filters">
          <button class="chip active" data-genre="all">Tous</button>
          <button class="chip" data-genre="news">Information</button>
          <button class="chip" data-genre="jazz">Jazz</button>
          <button class="chip" data-genre="pop">Pop</button>
          <button class="chip" data-genre="rock">Rock</button>
          <button class="chip" data-genre="classical">Classique</button>
          <button class="chip" data-genre="electro">Électro</button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div id="main-wrapper">
      <header class="top-header">
        <button class="mobile-menu-btn" id="mobile-toggle" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" class="search-input" placeholder="Rechercher une station ou chaîne...">
        </div>
        <div id="station-count" style="font-size:0.85rem; color:var(--text-secondary);">Chargement...</div>
      </header>

      <main id="content-stage">
        <!-- Theater Stage -->
        <section id="theater-stage">
          <!-- Top HUD Header (Displayed for Radio, auto-hides after 3s idle) -->
          <div class="stage-hud-top hud-element" id="stage-hud-top">
            <span class="stage-title-hud" id="stage-title">Sélectionnez une station</span>
            <div class="stage-controls-hud">
              <select id="anim-preset-select" class="stage-btn" title="Sélection de l'animation visuelle">
                <option value="cyber">Spectre Cyber (2D)</option>
                <option value="particles">Particules Pulse (2D)</option>
                <option value="aurora">Aurore Floue (2D)</option>
                <option value="hyperdrive">🚀 Hyperdrive (3D)</option>
                <option value="sphere">🌐 Sphère Cyber (3D)</option>
                <option value="synthwave">🌅 Grille Synthwave (3D)</option>
                <option value="vortex">🌀 Vortex Quantique (3D)</option>
                <option value="cubes">🧊 Cubes Matrice (3D)</option>
              </select>
              <button class="stage-btn" id="btn-stage-fullscreen" title="Plein écran total [F]">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                Plein Écran
              </button>
            </div>
          </div>

          <div class="video-viewport">
            <canvas id="visualizer-canvas"></canvas>
            <video id="unified-media" playsinline></video>

            <!-- Audio Radio Visualizer Overlay (Auto-hides metadata on idle in Radio mode) -->
            <div id="audio-overlay" class="audio-visualizer-overlay hud-element">
              <div class="audio-cover">
                <img id="stage-cover-img" src="" alt="" style="display:none;">
                <svg id="stage-cover-fallback" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
              </div>
            </div>
          </div>
        </section>

        <h2 id="catalog-heading" style="font-size:1.2rem; margin-bottom:12px;">Radios Populaires</h2>
        <div id="stations-grid" class="cards-grid"></div>
      </main>
    </div>

    <!-- Bottom Sticky Player -->
    <footer id="sticky-player">
      <div class="player-left">
        <div class="player-thumb">
          <img id="player-thumb-img" src="" style="display:none;">
          <svg id="player-thumb-fallback" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <div>
          <div id="player-title" style="font-weight:600; font-size:0.9rem;">En attente</div>
          <div id="player-subtitle" style="font-size:0.75rem; color:var(--text-secondary);">Direct Stream</div>
        </div>
      </div>

      <div class="player-controls">
        <button class="ctrl-btn" id="btn-prev" title="Précédent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>

        <button class="ctrl-btn play-main" id="btn-play-pause" title="Lecture / Pause">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>

        <button class="ctrl-btn" id="btn-next" title="Suivant">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>

      <div class="player-right">
        <div class="volume-group">
          <button class="ctrl-btn" id="btn-volume-toggle" title="Couper/Activer le son">
            <svg id="icon-vol-high" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <svg id="icon-vol-mute" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volume-range" min="0" max="1" step="0.01" value="0.8">
        </div>

        <button class="ctrl-btn" id="btn-fullscreen" title="Plein Écran Total [F]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script>
    const BACKUP_DATA = {
      FR_RADIO: [
        { id: 'fip', name: 'FIP Radio', url: 'https://stream.radiofrance.fr/fip/fip.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/fip.svg', tags: 'Jazz, Eclectique', type: 'audio' },
        { id: 'franceinter', name: 'France Inter', url: 'https://stream.radiofrance.fr/franceinter/franceinter.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/franceinter.svg', tags: 'Généraliste, News', type: 'audio' },
        { id: 'franceinfo', name: 'France Info', url: 'https://stream.radiofrance.fr/franceinfo/franceinfo.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/franceinfo.svg', tags: 'News, Info 24/7', type: 'audio' },
        { id: 'rtl', name: 'RTL France', url: 'https://icecast.rtl.fr/rtl-1-44-128', logo: 'https://upload.wikimedia.org/wikipedia/commons/e/e1/RTL_logo.svg', tags: 'Généraliste, Talk', type: 'audio' },
        { id: 'europe1', name: 'Europe 1', url: 'https://europe1.lmn.cloud/europe1.mp3', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/b5/Europe_1_logo_2010.svg', tags: 'Information, Talk', type: 'audio' },

    class MediaFetcher {
      constructor() {
        this.radioMirrors = [
          'https://de1.api.radio-browser.info',
          'https://nl1.api.radio-browser.info',
          'https://at1.api.radio-browser.info'
        ];
        this.mirrorIndex = 0;
      }

      getMirror() { return this.radioMirrors[this.mirrorIndex]; }
      rotateMirror() { this.mirrorIndex = (this.mirrorIndex + 1) % this.radioMirrors.length; }

      async getRadios(country = 'FR', genre = 'all', search = '') {
        const mirror = this.getMirror();
        let url = `${mirror}/json/stations/bycountrycodeexact/${country.toLowerCase()}?limit=60&order=votes&reverse=true`;
        
        if (search) {
          url = `${mirror}/json/stations/byname/${encodeURIComponent(search)}?limit=60`;
        } else if (genre && genre !== 'all') {
          url = `${mirror}/json/stations/bytag/${encodeURIComponent(genre)}?limit=60&order=votes&reverse=true`;
        } else if (country === 'GLOBAL') {
          url = `${mirror}/json/stations/topvote/60`;
        }

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const formatted = data.map(s => ({
            id: s.stationuuid,
            name: s.name.trim(),
            url: s.url_resolved || s.url,
            logo: s.favicon,
            tags: s.tags ? s.tags.split(',').slice(0, 2).join(', ') : 'Radio',
            type: 'audio'
          })).filter(s => s.url && s.name);
          return formatted.length ? formatted : BACKUP_DATA.FR_RADIO;
        } catch {
          this.rotateMirror();
          return BACKUP_DATA.FR_RADIO;
        }
      }

      async getTV(country = 'FR', genre = 'all', search = '') {
        try {
          let targetUrl = `https://iptv-org.github.io/iptv/countries/${country.toLowerCase()}.m3u`;
          if (genre && genre !== 'all') {
            const catMap = { news: 'news', jazz: 'music', pop: 'entertainment', rock: 'entertainment', classical: 'culture', electro: 'music' };
            targetUrl = `https://iptv-org.github.io/iptv/categories/${catMap[genre] || 'general'}.m3u`;
          } else if (country === 'GLOBAL') {
            targetUrl = `https://iptv-org.github.io/iptv/index.m3u`;
          }

          const res = await fetch(targetUrl);
          if (!res.ok) throw new Error();
          const text = await res.text();
          const parsed = this.parseM3U(text, search);
          return parsed.length ? parsed : BACKUP_DATA.FR_TV;
        } catch {
          return BACKUP_DATA.FR_TV;
        }
      }

      parseM3U(content, search = '') {
        const lines = content.split('\n');
        const list = [];
        let item = null;

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const name = (line.match(/,(.+)$/) || [])[1] || 'Chaîne TV';
            const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
            const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Direct TV';
            item = { name, logo, tags: group, type: 'video' };
          } else if (line && !line.startsWith('#') && item) {
            item.url = line;
            if (!search || item.name.toLowerCase().includes(search.toLowerCase())) {
              list.push(item);
            }
            item = null;
          }
          if (list.length >= 80) break;
        }
        return list;
      }
    }

    class VisualizerEngine {
      constructor(canvasEl) {
        this.canvas = canvasEl;
        this.ctx = canvasEl.getContext('2d');
        this.preset = 'cyber';
        this.active = false;
        this.threeRenderer = null;
        this.threeScene = null;
        this.threeCamera = null;
        this.threeMeshGroup = null;
        this.clock = new THREE.Clock();

        this.initThreeJS();
        window.addEventListener('resize', () => this.resize());
      }

      initThreeJS() {
        try {
          this.threeScene = new THREE.Scene();
          this.threeCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          this.threeCamera.position.z = 15;

          this.threeRenderer = new THREE.WebGLRenderer({ canvas: this.canvas, alpha: true, antialias: true });
          this.threeRenderer.setSize(this.canvas.offsetWidth || 800, this.canvas.offsetHeight || 450);
          this.threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          this.threeMeshGroup = new THREE.Group();
          this.threeScene.add(this.threeMeshGroup);

          // 1. Hyperdrive Tunnel
          const tunnelGeo = new THREE.CylinderGeometry(5, 5, 40, 16, 32, true);
          const tunnelMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.35 });
          const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
          tunnel.rotation.x = Math.PI / 2;
          tunnel.name = 'hyperdrive';
          this.threeMeshGroup.add(tunnel);

          // 2. Cyber Sphere
          const sphereGeo = new THREE.IcosahedronGeometry(4, 2);
          const sphereMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
          const sphere = new THREE.Mesh(sphereGeo, sphereMat);
          sphere.name = 'sphere';
          this.threeMeshGroup.add(sphere);

          // 3. Synthwave Grid
          const gridHelper = new THREE.GridHelper(30, 30, 0xef4444, 0x6366f1);
          gridHelper.position.y = -4;
          gridHelper.name = 'synthwave';
          this.threeMeshGroup.add(gridHelper);

          // 4. Quantum Vortex
          const particleCount = 1500;
          const particleGeo = new THREE.BufferGeometry();
          const positions = new Float32Array(particleCount * 3);
          for(let i=0; i<particleCount*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 30;
            positions[i+1] = (Math.random() - 0.5) * 30;
            positions[i+2] = (Math.random() - 0.5) * 30;
          }
          particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const particleMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.15 });
          const vortex = new THREE.Points(particleGeo, particleMat);
          vortex.name = 'vortex';
          this.threeMeshGroup.add(vortex);

          // 5. Matrix Cubes
          const cubeGroup = new THREE.Group();
          cubeGroup.name = 'cubes';
          for(let x=-2; x<=2; x++) {
            for(let z=-2; z<=2; z++) {
              const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true }));
              box.position.set(x * 2.2, 0, z * 2.2);
              cubeGroup.add(box);
            }
          }
          this.threeMeshGroup.add(cubeGroup);

          this.updateThreeVisibility();
        } catch(e) {
          console.warn('Three.js init fallback:', e);
        }
      }

      setPreset(preset) {
        this.preset = preset;
        this.updateThreeVisibility();
      }

      updateThreeVisibility() {
        if (!this.threeMeshGroup) return;
        this.threeMeshGroup.children.forEach(child => {
          child.visible = (child.name === this.preset);
        });
      }

      start() { this.active = true; this.render(); }
      stop() { this.active = false; }

      resize() {
        if (!this.canvas || !this.threeRenderer) return;
        const width = this.canvas.parentElement.clientWidth;
        const height = this.canvas.parentElement.clientHeight;
        this.canvas.width = width;
        this.canvas.height = height;
        if (this.threeCamera) {
          this.threeCamera.aspect = width / height;
          this.threeCamera.updateProjectionMatrix();
        }
        this.threeRenderer.setSize(width, height);
      }

      render() {
        if (!this.active) return;
        requestAnimationFrame(() => this.render());

        const width = this.canvas.width = this.canvas.offsetWidth;
        const height = this.canvas.height = this.canvas.offsetHeight;
        if (!width || !height) return;

        this.ctx.clearRect(0, 0, width, height);
        const time = Date.now() * 0.003;

        // Mode 3D WebGL
        if (['hyperdrive', 'sphere', 'synthwave', 'vortex', 'cubes'].includes(this.preset)) {
          if (this.threeRenderer && this.threeScene && this.threeCamera) {
            const delta = this.clock.getDelta();
            if (this.preset === 'sphere' && this.threeMeshGroup.getObjectByName('sphere')) {
              const s = this.threeMeshGroup.getObjectByName('sphere');
              s.rotation.x += delta * 0.5;
              s.rotation.y += delta * 0.8;
            } else if (this.preset === 'vortex' && this.threeMeshGroup.getObjectByName('vortex')) {
              const v = this.threeMeshGroup.getObjectByName('vortex');
              v.rotation.y += delta * 0.3;
            } else if (this.preset === 'cubes' && this.threeMeshGroup.getObjectByName('cubes')) {
              const c = this.threeMeshGroup.getObjectByName('cubes');
              c.rotation.y += delta * 0.4;
              c.children.forEach((box, i) => { box.position.y = Math.sin(time + i) * 1.5; });
            }
            this.threeRenderer.render(this.threeScene, this.threeCamera);
          }
          return;
        }

        // Mode 2D Canvas
        if (this.preset === 'cyber') {
          const barCount = 48;
          const barWidth = width / barCount;
          for (let i = 0; i < barCount; i++) {
            const h = (Math.sin(time * 2 + i * 0.25) * 0.5 + 0.5) * (height * 0.6) + 10;
            const grad = this.ctx.createLinearGradient(0, height, 0, 0);
            grad.addColorStop(0, '#6366f1');
            grad.addColorStop(1, '#06b6d4');
            this.ctx.fillStyle = grad;
            this.ctx.fillRect(i * barWidth + 2, height - h, barWidth - 4, h);
          }
        } else if (this.preset === 'particles') {
          for (let i = 0; i < 60; i++) {
            const x = (Math.sin(time + i) * 0.5 + 0.5) * width;
            const y = (Math.cos(time * 0.8 + i * 1.5) * 0.5 + 0.5) * height;
            const radius = (i % 5) + 2;
            this.ctx.fillStyle = i % 2 === 0 ? 'rgba(99, 102, 241, 0.7)' : 'rgba(6, 182, 212, 0.7)';
            this.ctx.beginPath();
            this.ctx.arc(x, y, radius, 0, Math.PI * 2);
            this.ctx.fill();
          }
        } else if (this.preset === 'aurora') {
          const grad1 = this.ctx.createRadialGradient(width * 0.3, height * 0.5, 10, width * 0.3, height * 0.5, width * 0.6);
          grad1.addColorStop(0, 'rgba(99, 102, 241, 0.35)');
          grad1.addColorStop(1, 'transparent');
          this.ctx.fillStyle = grad1;
          this.ctx.fillRect(0, 0, width, height);

          const grad2 = this.ctx.createRadialGradient(width * 0.7 + Math.sin(time)*100, height * 0.5, 10, width * 0.7, height * 0.5, width * 0.6);
          grad2.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
          grad2.addColorStop(1, 'transparent');
          this.ctx.fillStyle = grad2;
          this.ctx.fillRect(0, 0, width, height);
        }
      }
    }

    class AppController {
      constructor() {
        this.fetcher = new MediaFetcher();
        this.currentTab = 'radio';
        this.currentCountry = 'FR';
        this.currentGenre = 'all';
        this.stations = [];
        this.activeStationIndex = -1;
        this.hls = null;
        this.idleTimer = null;

        this.initDOM();
        this.visualizer = new VisualizerEngine(this.canvas);
        this.bindEvents();
        this.loadCatalog();
      }

      initDOM() {
        this.media = document.getElementById('unified-media');
        this.canvas = document.getElementById('visualizer-canvas');
        this.grid = document.getElementById('stations-grid');
        this.count = document.getElementById('station-count');
        this.theater = document.getElementById('theater-stage');
        this.audioOverlay = document.getElementById('audio-overlay');
        this.sidebar = document.getElementById('sidebar');
      }

      bindEvents() {
        document.getElementById('mobile-toggle').onclick = () => this.sidebar.classList.toggle('open');
        document.getElementById('tab-radio').onclick = () => this.switchTab('radio');
        document.getElementById('tab-tv').onclick = () => this.switchTab('tv');

        // Filtre Pays
        document.getElementById('country-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#country-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentCountry = e.target.dataset.filter;
          this.loadCatalog();
        };

        // Filtre Thématique / Genre
        document.getElementById('genre-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#genre-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentGenre = e.target.dataset.genre;
          this.loadCatalog();
        };

        // Recherche en direct
        document.getElementById('global-search').oninput = (e) => {
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => this.loadCatalog(e.target.value), 300);
        };

        // Contrôles Sticky Player
        document.getElementById('btn-play-pause').onclick = () => {
          if (this.media.paused) this.media.play();
          else this.media.pause();
        };

        document.getElementById('btn-prev').onclick = () => this.playAdjacentStation(-1);
        document.getElementById('btn-next').onclick = () => this.playAdjacentStation(1);

        document.getElementById('volume-range').oninput = (e) => {
          this.media.volume = parseFloat(e.target.value);
        };

        document.getElementById('btn-volume-toggle').onclick = () => {
          this.media.muted = !this.media.muted;
          document.getElementById('icon-vol-high').style.display = this.media.muted ? 'none' : 'block';
          document.getElementById('icon-vol-mute').style.display = this.media.muted ? 'block' : 'none';
        };

        document.getElementById('anim-preset-select').onchange = (e) => {
          this.visualizer.setPreset(e.target.value);
        };

        const toggleFullscreen = () => {
          if (!document.fullscreenElement) this.theater.requestFullscreen();
          else document.exitFullscreen();
        };

        document.getElementById('btn-stage-fullscreen').onclick = toggleFullscreen;
        document.getElementById('btn-fullscreen').onclick = toggleFullscreen;

        // Double-clic sur le lecteur pour Plein Écran
        this.theater.ondblclick = toggleFullscreen;

        // Raccourci Touche 'F'
        window.addEventListener('keydown', (e) => {
          if ((e.key === 'f' || e.key === 'F') && document.activeElement.tagName !== 'INPUT') {
            toggleFullscreen();
          }
        });

        // Auto-masquage du HUD après 3 secondes d'inactivité
        const resetIdleTimer = () => {
          document.body.classList.remove('hide-hud');
          document.body.classList.remove('hide-cursor');
          clearTimeout(this.idleTimer);
          
          this.idleTimer = setTimeout(() => {
            if (document.fullscreenElement || (this.currentTab === 'radio' && this.theater.classList.contains('active'))) {
              document.body.classList.add('hide-hud');
              if (document.fullscreenElement) document.body.classList.add('hide-cursor');
            }
          }, 3000);
        };

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);

        this.media.onplay = () => {
          document.getElementById('icon-play').style.display = 'none';
          document.getElementById('icon-pause').style.display = 'block';
        };

        this.media.onpause = () => {
          document.getElementById('icon-play').style.display = 'block';
          document.getElementById('icon-pause').style.display = 'none';
        };
      }

      switchTab(tab) {
        this.currentTab = tab;
        document.getElementById('tab-radio').classList.toggle('active', tab === 'radio');
        document.getElementById('tab-tv').classList.toggle('active', tab === 'tv');
        document.getElementById('catalog-heading').textContent = tab === 'radio' ? 'Radios Populaires' : 'Télévision en Direct';
        
        // Activer / Masquer les animations selon le mode
        if (tab === 'tv') {
          this.canvas.style.display = 'none';
          this.visualizer.stop();
          document.getElementById('stage-hud-top').style.display = 'none';
        } else {
          document.getElementById('stage-hud-top').style.display = 'flex';
        }

        this.loadCatalog();
      }

      async loadCatalog(search = '') {
        this.grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Chargement des flux multimédias...</p></div>';
        
        if (this.currentTab === 'radio') {
          this.stations = await this.fetcher.getRadios(this.currentCountry, this.currentGenre, search);
        } else {
          this.stations = await this.fetcher.getTV(this.currentCountry, this.currentGenre, search);
        }

        this.count.textContent = `${this.stations.length} flux prêts`;
        this.renderGrid();
      }

      renderGrid() {
        this.grid.innerHTML = this.stations.map((s, i) => `
          <div class="station-card ${this.activeStationIndex === i ? 'is-playing' : ''}" onclick="app.playStation(${i})">
            <div class="card-thumb-wrapper">
              ${s.logo ? `<img src="${s.logo}" onerror="this.style.display='none'">` : `<span>${s.name.charAt(0)}</span>`}
            </div>
            <div style="font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">${s.tags || s.type}</div>
          </div>
        `).join('');
      }

      playStation(index) {
        const s = this.stations[index];
        if (!s) return;

        this.activeStationIndex = index;
        this.theater.classList.add('active');
        document.getElementById('player-title').textContent = s.name;
        document.getElementById('player-subtitle').textContent = s.tags || 'Direct Stream';
        document.getElementById('stage-title').textContent = s.name;

        if (s.logo) {
          document.getElementById('player-thumb-img').src = s.logo;
          document.getElementById('player-thumb-img').style.display = 'block';
          document.getElementById('player-thumb-fallback').style.display = 'none';
          document.getElementById('stage-cover-img').src = s.logo;
          document.getElementById('stage-cover-img').style.display = 'block';
          document.getElementById('stage-cover-fallback').style.display = 'none';
        } else {
          document.getElementById('player-thumb-img').style.display = 'none';
          document.getElementById('player-thumb-fallback').style.display = 'block';
          document.getElementById('stage-cover-img').style.display = 'none';
          document.getElementById('stage-cover-fallback').style.display = 'block';
        }

        if (this.hls) {
          this.hls.destroy();
          this.hls = null;
        }

        const sources = [s.url, ...(s.backupUrls || [])];
        let currentSourceIndex = 0;

        const tryPlay = (url) => {
          if (s.type === 'video') {
            this.audioOverlay.style.display = 'none';
            this.canvas.style.display = 'none';
            this.visualizer.stop();
            this.media.style.display = 'block';

            if (url.includes('.m3u8') && Hls.isSupported()) {
              this.hls = new Hls({ enableWorker: true });
              this.hls.loadSource(url);
              this.hls.attachMedia(this.media);
              this.hls.on(Hls.Events.MANIFEST_PARSED, () => this.media.play());
              this.hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                  currentSourceIndex++;
                  if (currentSourceIndex < sources.length) {
                    if (this.hls) { this.hls.destroy(); this.hls = null; }
                    tryPlay(sources[currentSourceIndex]);
                  }
                }
              });
            } else {
              this.media.src = url;
              this.media.play().catch(() => {
                currentSourceIndex++;
                if (currentSourceIndex < sources.length) tryPlay(sources[currentSourceIndex]);
              });
            }
          } else {
            // Mode Radio : Activer le visualiseur 2D/3D et masquer la vidéo
            this.media.style.display = 'none';
            this.audioOverlay.style.display = 'flex';
            this.canvas.style.display = 'block';
            this.visualizer.start();
            this.visualizer.resize();

            this.media.src = url;
            this.media.play().catch(() => {
              currentSourceIndex++;
              if (currentSourceIndex < sources.length) tryPlay(sources[currentSourceIndex]);
            });
          }
        };

        tryPlay(sources[0]);
        this.renderGrid();
      }

      playAdjacentStation(direction) {
        if (!this.stations.length) return;
        let nextIndex = this.activeStationIndex + direction;
        if (nextIndex < 0) nextIndex = this.stations.length - 1;
        if (nextIndex >= this.stations.length) nextIndex = 0;
        this.playStation(nextIndex);
      }
    }

    // Démarrage de l'application sur l'événement onload
    window.onload = () => { window.app = new AppController(); };
  </script>
