<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream — Live Radio, TV & Podcasts Pro</title>
  
  <!-- Hls.js pour la lecture des flux vidéo/audio M3U8 en direct -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Three.js pour le rendu des animations 3D WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #111420;
      --bg-surface-elevated: #181c2e;
      --bg-glass: rgba(17, 20, 32, 0.88);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-podcast: #a855f7;
      --accent-live: #ef4444;
      --accent-green: #10b981;

      --sidebar-width: 280px;
      --player-height: 104px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-live);
      text-transform: uppercase;
    }

    .live-badge.is-active { color: #10b981; }
    .live-badge.is-buffering { color: #f59e0b; }
    .live-badge.is-dead { color: #ef4444; }

    .live-dot {
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    body.hide-cursor { cursor: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .brand-section {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-podcast));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-tabs {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.88rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
      user-select: none;
    }

    .nav-item:hover { background: var(--bg-surface-elevated); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .badge-counter {
      margin-left: auto;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }

    .sidebar-filters {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-group-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 8px;
      font-weight: 700;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.78rem;
      padding: 5px 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .chip:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .chip.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .card-fav-btn:hover {
      transform: scale(1.12);
      color: #ef4444;
      background: rgba(16, 19, 30, 0.95);
    }

    .card-fav-btn.is-fav {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }
    .card-fav-btn.is-fav svg { fill: #ef4444; stroke: #ef4444; }

    .card-fs-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 6;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
      opacity: 0.85;
    }

    .card-fs-btn:hover {
      transform: scale(1.12);
      color: var(--accent-cyan);
      background: rgba(16, 19, 30, 0.95);
      border-color: var(--accent-cyan);
      opacity: 1;
    }

    .toast-notification {
      position: fixed;
      bottom: calc(var(--player-height) + 16px);
      right: 24px;
      background: rgba(17, 20, 32, 0.95);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: var(--radius-full);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      z-index: 100;
      backdrop-filter: blur(12px);
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.05), transparent 40%), var(--bg-base);
    }

    .top-header {
      height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      background: var(--bg-glass);
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    .search-box { flex: 1; max-width: 460px; position: relative; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .search-input:focus { border-color: var(--accent-primary); }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .btn-header-action {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
      position: relative;
    }
    .btn-header-action:hover { border-color: var(--accent-primary); color: #fff; }

    #content-stage {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px calc(var(--player-height) + 20px) 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Theater Stage & Fullscreen HUD */
    #theater-stage {
      width: 100%;
      background: #000;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      overflow: hidden;
      display: none;
      position: sticky;
      top: 0;
      z-index: 25;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), var(--shadow-glow);
      backdrop-filter: blur(16px);
    }

    #theater-stage.active { display: block; }
    #theater-stage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .hud-element { transition: opacity 0.5s ease, transform 0.5s ease; }
    body.hide-hud .hud-element { opacity: 0 !important; pointer-events: none !important; }

    .stage-hud-top {
      position: absolute;
      top: 16px; left: 20px; right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .stage-title-hud {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .stage-controls-hud { display: flex; align-items: center; gap: 10px; }

    .stage-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.82rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
      transition: var(--transition-smooth);
    }
    .stage-btn:hover { background: rgba(99, 102, 241, 0.4); }

    .video-viewport {
      width: 100%;
      max-height: 440px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #theater-stage:fullscreen .video-viewport {
      max-height: 100vh !important;
      height: 100vh !important;
    }

    video#unified-media { width: 100%; height: 100%; object-fit: contain; }

    .canvas-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #visualizer-canvas-2d { z-index: 2; }
    #visualizer-canvas-3d { z-index: 1; }

    .audio-visualizer-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(17, 20, 32, 0.3) 0%, rgba(9, 10, 15, 0.88) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 5;
      pointer-events: none;
    }

    .audio-cover {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface-elevated);
      border: 2px solid var(--border-glass);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .audio-cover img { width: 100%; height: 100%; object-fit: cover; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .station-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--transition-smooth);
      position: relative;
    }

    .station-card:hover { transform: translateY(-4px); background: var(--bg-surface-elevated); border-color: rgba(99, 102, 241, 0.4); }
    .station-card.is-playing { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.12); }

    .card-thumb-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      position: relative;
    }
    .card-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    /* Episodes Panel & Detail */
    .episodes-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    .podcast-header-detail {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 16px;
    }

    .podcast-detail-cover {
      width: 110px;
      height: 110px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .podcast-header-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }

    .btn-subscribe {
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-podcast);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-smooth);
      width: fit-content;
    }
    .btn-subscribe:hover { background: var(--accent-podcast); color: #fff; }
    .btn-subscribe.is-subbed { background: var(--accent-podcast); color: #fff; }

    .episode-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }
    .episode-item:hover { background: rgba(168, 85, 247, 0.12); border-color: rgba(168, 85, 247, 0.4); }

    .episode-progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-podcast), var(--accent-cyan));
      transition: width 0.3s ease;
    }

    .episode-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-action-sm {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition-smooth);
    }
    .btn-action-sm:hover { color: #fff; border-color: var(--border-focus); background: rgba(255, 255, 255, 0.12); }

    /* Sticky Player & Controls */
    #sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--player-height);
      background: rgba(14, 17, 27, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 24px;
      z-index: 50;
    }

    /* Player Scrubbing Bar */
    .player-scrub-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .time-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 44px;
    }
    .time-label.right { text-align: right; }

    .scrub-slider {
      flex: 1;
      height: 4px;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .scrub-slider::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .scrub-slider:hover::-webkit-slider-thumb { transform: scale(1.3); }

    .player-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .player-left { display: flex; align-items: center; gap: 12px; width: 280px; min-width: 200px; }
    .player-thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--bg-surface-elevated); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .player-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .player-controls { display: flex; align-items: center; gap: 10px; }

    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 50%; outline: none; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.08); }
    .ctrl-btn.play-main { width: 42px; height: 42px; background: var(--text-primary); color: var(--bg-base); }
    .ctrl-btn.play-main:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    .jump-btn {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      padding: 4px 8px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .jump-btn:hover { color: #fff; border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.2); }

    .speed-btn {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 8px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .speed-btn:hover { background: var(--accent-cyan); color: #000; }

    .player-right { display: flex; align-items: center; gap: 14px; width: 280px; justify-content: flex-end; }
    .volume-group { display: flex; align-items: center; gap: 8px; }
    .volume-slider { width: 70px; height: 4px; accent-color: var(--accent-primary); cursor: pointer; }

    /* Drawer Queue Panel */
    #queue-drawer {
      position: fixed;
      top: 70px; right: -360px; bottom: var(--player-height);
      width: 340px;
      background: rgba(17, 20, 32, 0.98);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-glass);
      z-index: 45;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    #queue-drawer.open { right: 0; }

    .queue-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); padding-bottom: 12px; }
    .queue-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .queue-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px; background: var(--bg-surface-elevated); border: 1px solid var(--border-glass); border-radius: var(--radius-md); font-size: 0.85rem; }

    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px; color: var(--text-secondary); grid-column: 1 / -1; }

  <script>
    class FavoritesStore {
      constructor(onChange) {
        this.onChange = onChange;
        this.radioFavs = new Map();
        this.tvFavs = new Map();
        this.loadLocal();
      }

      loadLocal() {
        try {
          const storedRadio = localStorage.getItem('omni_favs_radio');
          if (storedRadio) JSON.parse(storedRadio).forEach(i => this.radioFavs.set(i.id, i));
          const storedTv = localStorage.getItem('omni_favs_tv');
          if (storedTv) JSON.parse(storedTv).forEach(i => this.tvFavs.set(i.id, i));
        } catch (e) { console.warn('Erreur lecture favoris:', e); }
      }

      saveLocal() {
        try {
          localStorage.setItem('omni_favs_radio', JSON.stringify(Array.from(this.radioFavs.values())));
          localStorage.setItem('omni_favs_tv', JSON.stringify(Array.from(this.tvFavs.values())));
        } catch (e) { console.warn('Erreur sauvegarde favoris:', e); }
      }

      toggle(station) {
        if (!station || !station.id) return false;
        const isTv = station.type === 'video' || station.type === 'tv';
        const targetMap = isTv ? this.tvFavs : this.radioFavs;
        const exists = targetMap.has(station.id);
        if (exists) targetMap.delete(station.id);
        else targetMap.set(station.id, station);
        this.saveLocal();
        if (this.onChange) this.onChange();
        return !exists;
      }

      isFav(id, type) {
        if (!id) return false;
        return (type === 'video' || type === 'tv') ? this.tvFavs.has(id) : this.radioFavs.has(id);
      }

      getRadioFavs() { return Array.from(this.radioFavs.values()); }
      getTvFavs() { return Array.from(this.tvFavs.values()); }
    }

    class SubscriptionsStore {
      constructor(onChange) {
        this.onChange = onChange;
        this.subs = new Map();
        this.loadLocal();
      }

      loadLocal() {
        try {
          const stored = localStorage.getItem('omni_podcast_subs');
          if (stored) JSON.parse(stored).forEach(s => this.subs.set(s.id, s));
        } catch (e) {}
      }

      saveLocal() {
        try {
          localStorage.setItem('omni_podcast_subs', JSON.stringify(Array.from(this.subs.values())));
        } catch (e) {}
      }

      toggle(podcast) {
        if (!podcast || !podcast.id) return false;
        const exists = this.subs.has(podcast.id);
        if (exists) this.subs.delete(podcast.id);
        else this.subs.set(podcast.id, podcast);
        this.saveLocal();
        if (this.onChange) this.onChange();
        return !exists;
      }

      isSubbed(id) { return this.subs.has(id); }
      getSubs() { return Array.from(this.subs.values()); }
    }

    class ResumeStore {
      constructor() {
        this.progress = new Map();
        this.load();
      }
      load() {
        try {
          const stored = localStorage.getItem('omni_podcast_progress');
          if (stored) JSON.parse(stored).forEach(p => this.progress.set(p.id, p));
        } catch(e) {}
      }
      save(id, currentTime, duration, title, podcastName) {
        if (!id || !duration || duration <= 0) return;
        this.progress.set(id, { id, currentTime, duration, title, podcastName, updated: Date.now() });
        try {
          localStorage.setItem('omni_podcast_progress', JSON.stringify(Array.from(this.progress.values())));
        } catch(e) {}
      }
      get(id) { return this.progress.get(id); }
    }

    class QueueManager {
      constructor(onQueueChange) {
        this.queue = [];
        this.onQueueChange = onQueueChange;
      }
      add(episode, podcast) {
        this.queue.push({ episode, podcast });
        if (this.onQueueChange) this.onQueueChange();
      }
      remove(index) {
        this.queue.splice(index, 1);
        if (this.onQueueChange) this.onQueueChange();
      }
      clear() {
        this.queue = [];
        if (this.onQueueChange) this.onQueueChange();
      }
      next() {
        return this.queue.shift();
      }
    }

    class StreamHealthMonitor {
      constructor(mediaElement, badgeTextEl, badgeContainerEl) {
        this.media = mediaElement;
        this.badgeText = badgeTextEl;
        this.badgeContainer = badgeContainerEl;
        this.lastTime = 0;
        this.lastDecodedFrames = 0;
        this.stuckCounter = 0;
        this.timer = null;
        this.initListeners();
      }

      initListeners() {
        if (!this.media) return;
        ['waiting', 'stalled', 'seeking'].forEach(evt => {
          this.media.addEventListener(evt, () => this.setStatus('buffering', 'CHARGEMENT... 🟡'));
        });
        ['playing'].forEach(evt => {
          this.stuckCounter = 0;
          this.setStatus('active', 'FLUX ACTIF 🟢');
        });
        ['pause'].forEach(evt => {
          if (this.media.paused && !this.media.ended) {
            this.setStatus('', 'PAUSE ⏸️');
          }
        });
        ['error'].forEach(evt => {
          this.setStatus('dead', 'SIGNAL PERDU 🔴');
        });
        this.startHealthCheck();
      }

      startHealthCheck() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
          if (!this.media || this.media.paused) return;

          const currTime = this.media.currentTime;
          const isStuck = (currTime === this.lastTime && currTime > 0);
          this.lastTime = currTime;

          let fpsStr = '';
          if (typeof this.media.getVideoPlaybackQuality === 'function') {
            const q = this.media.getVideoPlaybackQuality();
            const decoded = q.totalVideoFrames || 0;
            const diff = decoded - this.lastDecodedFrames;
            this.lastDecodedFrames = decoded;
            if (diff > 0) {
              fpsStr = ` (${diff} FPS)`;
            }
          }

          if (isStuck) {
            this.stuckCounter++;
            if (this.stuckCounter >= 3) {
              this.setStatus('dead', 'SIGNAL BLOQUÉ 🔴');
            } else {
              this.setStatus('buffering', 'BUFFÉRISE... 🟡');
            }
          } else {
            this.stuckCounter = 0;
            this.setStatus('active', `FLUX ACTIF 🟢${fpsStr}`);
          }
        }, 1000);
      }

      setStatus(stateClass, label) {
        if (this.badgeContainer) {
          this.badgeContainer.classList.remove('is-active', 'is-buffering', 'is-dead');
          if (stateClass) this.badgeContainer.classList.add(`is-${stateClass}`);
        }
        if (this.badgeText) {
          this.badgeText.textContent = label;
        }
      }
    }

    const BACKUP_STATIONS = {
      FR_RADIO: [
        { id: 'fip', name: 'FIP Radio', url: 'https://stream.radiofrance.fr/fip/fip.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/fip.svg', country: 'FR', tags: 'Éclectique, Jazz', type: 'audio' },

    class MediaFetcher {
      async getRadios(country = 'FR', genre = 'all', search = '') {
        const mirrors = [
          'https://de1.api.radio-browser.info',
          'https://nl1.api.radio-browser.info',
          'https://at1.api.radio-browser.info'
        ];

        let fetchedList = null;
        for (const mirror of mirrors) {
          try {
            let url = `${mirror}/json/stations/bycountrycodeexact/${country.toLowerCase()}?limit=60&order=votes&reverse=true`;
            if (search) url = `${mirror}/json/stations/byname/${encodeURIComponent(search)}?limit=60`;
            else if (genre && genre !== 'all') url = `${mirror}/json/stations/bytag/${encodeURIComponent(genre)}?limit=60`;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 3000);
            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timer);

            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                fetchedList = data.map(s => ({
                  id: s.stationuuid || `rad_${Math.random().toString(36).substr(2,9)}`,
                  name: s.name.trim(),
                  url: s.url_resolved || s.url,
                  logo: s.favicon || '',
                  country: s.countrycode || country,
                  tags: s.tags ? s.tags.split(',').slice(0, 2).join(', ') : 'Radio',
                  type: 'audio'
                })).filter(s => s.url && s.name);
                break;
              }
            }
          } catch (e) {}
        }

        return (fetchedList && fetchedList.length > 0) ? fetchedList : BACKUP_STATIONS.FR_RADIO;
      }

      async getTV(country = 'FR', genre = 'all', search = '') {
        const targetUrl = `https://iptv-org.github.io/iptv/countries/${country.toLowerCase()}.m3u`;
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          const res = await fetch(targetUrl, { signal: controller.signal });
          clearTimeout(timer);

          if (res.ok) {
            const text = await res.text();
            const list = this.parseM3U(text, search, country, genre);
            if (list.length > 0) return list;
          }
        } catch (e) {}

        return BACKUP_STATIONS.FR_TV;
      }

      async getPodcasts(search = '', genre = 'all', country = 'FR') {
        let term = search.trim() || 'podcast';
        if (!search.trim() && genre && genre !== 'all') {
          const genreTerms = { news: 'histoire actualite', science: 'science tech', crime: 'true crime', culture: 'culture art', humor: 'humour' };
          term = genreTerms[genre] || genre;
        }

        const url = `https://itunes.apple.com/search?media=podcast&entity=podcast&term=${encodeURIComponent(term)}&limit=50&country=${country.toLowerCase()}`;
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            return data.results.map(p => ({
              id: `pod_${p.collectionId}`,
              name: p.collectionName,
              artist: p.artistName,
              feedUrl: p.feedUrl,
              logo: p.artworkUrl600 || p.artworkUrl100,
              tags: p.primaryGenreName || 'Podcast',
              type: 'podcast',
              episodesCount: p.trackCount
            })).filter(p => p.feedUrl && p.name);
          }
        } catch (e) {}
        return [];
      }

      async getPodcastEpisodes(feedUrl) {
        if (!feedUrl) return [];

        let cleanFeedUrl = feedUrl.trim();
        if (cleanFeedUrl.startsWith('http://')) {
          cleanFeedUrl = cleanFeedUrl.replace('http://', 'https://');
        }

        // 1. Direct fetch attempt
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(cleanFeedUrl, { signal: controller.signal });
          clearTimeout(timer);
          if (res.ok) {
            const text = await res.text();
            const episodes = this.parseRSSFeed(text);
            if (episodes && episodes.length > 0) return episodes;
          }
        } catch(e) {}

        // 2. Service rss2json API
        try {
          const rss2jsonUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(cleanFeedUrl)}&count=30`;
          const res = await fetch(rss2jsonUrl);
          if (res.ok) {
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
              const episodes = [];
              data.items.forEach((item, idx) => {
                let audioUrl = item.enclosure?.link || item.enclosure?.url;
                if (!audioUrl && typeof item.description === 'string') {
                  const m = item.description.match(/https?:\/\/[^\s"'<>]+\.(?:mp3|m4a|aac|ogg|wav)(\?[^\s"'<>]*)?/i);
                  if (m) audioUrl = m[0];
                }
                if (audioUrl) {
                  episodes.push({
                    id: `ep_${idx}_${(item.title || '').replace(/[^a-z0-9]/gi, '')}`,
                    title: item.title || `Épisode ${idx + 1}`,
                    url: audioUrl,
                    pubDate: item.pubDate ? new Date(item.pubDate).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' }) : '',
                    type: 'audio'
                  });
                }
              });
              if (episodes.length > 0) return episodes;
            }
          }
        } catch (e) {}

        return [];
      }

      parseRSSFeed(xmlText) {
        if (!xmlText) return [];
        const episodes = [];
        const itemMatches = xmlText.match(/<(?:item|entry)[\s\S]*?<\/(?:item|entry)>/gi) || [];
        
        itemMatches.slice(0, 30).forEach((itemXml, idx) => {
          let title = `Épisode ${idx + 1}`;
          const titleMatch = itemXml.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/i);
          if (titleMatch && titleMatch[1]) {
            title = titleMatch[1].replace(/<!\[CDATA\[|\]\]>/g, '').trim();
          }

          let audioUrl = null;
          const encMatch = itemXml.match(/<enclosure[^>]*url=["']([^"']+)["']/i);
          if (encMatch) audioUrl = encMatch[1];

          if (!audioUrl) {
            const mediaMatch = itemXml.match(/<media:content[^>]*url=["']([^"']+)["']/i);
            if (mediaMatch) audioUrl = mediaMatch[1];
          }

          if (audioUrl) {
            episodes.push({
              id: `ep_${idx}_${title.replace(/[^a-z0-9]/gi, '')}`,
              title,
              url: audioUrl,
              pubDate: '',
              type: 'audio'
            });
          }
        });
        return episodes;
      }

      parseM3U(content, search = '', country = 'FR', genre = 'all') {
        if (!content) return [];
        const lines = content.split('\n');
        const list = [];
        let item = null;
        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const name = (line.match(/,(.+)$/) || [])[1] || 'Chaîne TV';
            const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
            const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Direct TV';
            const cleanId = `tv_${name.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
            item = { id: cleanId, name, logo, country, tags: group, type: 'video' };
          } else if (line && !line.startsWith('#') && item) {
            item.url = line;
            const matchesSearch = !search || item.name.toLowerCase().includes(search.toLowerCase()) || item.tags.toLowerCase().includes(search.toLowerCase());
            const matchesGenre = genre === 'all' || item.tags.toLowerCase().includes(genre.toLowerCase()) || item.name.toLowerCase().includes(genre.toLowerCase());

            if (matchesSearch && matchesGenre) {
              list.push(item);
            }
            item = null;
          }
        }
        return list;
      }
    }

    class VisualizerEngine {
      constructor(canvas2D, canvas3D, audioElement) {
        this.c2d = canvas2D;
        this.ctx2d = canvas2D ? canvas2D.getContext('2d') : null;
        this.c3d = canvas3D;
        this.audioEl = audioElement;
        this.preset = 'cyber';
        this.isRunning = false;

        this.initAudioAnalyzer();
        this.initThreeJS();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.start();
      }

      initAudioAnalyzer() {
        this.analyser = null; // Désactivé pour contourner les restrictions CORS
      }

      getFrequencyData() {
        const isPlaying = this.audioEl && !this.audioEl.paused && !this.audioEl.ended;
        const fakeData = new Uint8Array(32);
        if (!isPlaying) return fakeData;

        const time = Date.now() * 0.004;
        for (let i = 0; i < 32; i++) {
          const val = Math.sin(time * 2.5 + i * 0.35) * 0.5 + 0.5;
          const beat = Math.pow(Math.sin(time * 1.8), 4) * 0.4;
          const noise = Math.cos(time * 5.2 - i * 0.15) * 0.25 + 0.25;
          fakeData[i] = Math.min(255, Math.floor((val * 0.5 + beat + noise * 0.25) * 210 + 45));
        }
        return fakeData;
      }

      resize() {
        if (this.c2d) {
          this.c2d.width = this.c2d.offsetWidth || 800;
          this.c2d.height = this.c2d.offsetHeight || 450;
        }
        if (this.renderer && this.c3d) {
          const w = this.c3d.offsetWidth || 800;
          const h = this.c3d.offsetHeight || 450;
          this.renderer.setSize(w, h, false);
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
        }
      }

        if (typeof THREE === 'undefined' || !this.c3d) return;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 1000);
        this.camera.position.z = 50;
        this.renderer = new THREE.WebGLRenderer({ canvas: this.c3d, alpha: true, antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          const rad = 10.2 + Math.random() * 14;
          cPos[i * 3] = Math.cos(angle) * rad;
          cPos[i * 3 + 1] = Math.sin(angle) * rad;
          cPos[i * 3 + 2] = (Math.random() - 0.5) * 4;
        }
        coronaGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
        const coronaMat = new THREE.PointsMaterial({ color: 0xf59e0b, size: 1.1, transparent: true, opacity: 0.85 });
        this.coronaPoints = new THREE.Points(coronaGeo, coronaMat);
        eclGroup.add(this.coronaPoints);
        this.meshGroups['eclipse'] = eclGroup;

        // 14. Tesseract 4D
        const tessGroup = new THREE.Group();
        const outerGeo = new THREE.BoxGeometry(16, 16, 16);
        const outerMat = new THREE.MeshBasicMaterial({ color: 0xec4899, wireframe: true });
        this.tessOuter = new THREE.Mesh(outerGeo, outerMat);
        const innerGeo = new THREE.BoxGeometry(8, 8, 8);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true });
        this.tessInner = new THREE.Mesh(innerGeo, innerMat);
        tessGroup.add(this.tessOuter);
        tessGroup.add(this.tessInner);
        this.meshGroups['tesseract'] = tessGroup;

        // 15. Nébuleuse & Pulsar 3D
        const nebGroup = new THREE.Group();
        const nebGeo = new THREE.BufferGeometry();
        const nCount = 3000;
        const nPos = new Float32Array(nCount * 3);
        for (let i = 0; i < nCount; i++) {
          const u = Math.random();
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * u - 1);
          const r = 4 + Math.random() * 26;
          nPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          nPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          nPos[i * 3 + 2] = r * Math.cos(phi);
        }
        nebGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
        const nebMat = new THREE.PointsMaterial({ color: 0xa855f7, size: 0.8, transparent: true, opacity: 0.75 });
        this.nebPoints = new THREE.Points(nebGeo, nebMat);
        nebGroup.add(this.nebPoints);

        const pulsarGeo = new THREE.OctahedronGeometry(4, 2);
        const pulsarMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
        this.pulsarMesh = new THREE.Mesh(pulsarGeo, pulsarMat);
        nebGroup.add(this.pulsarMesh);
        this.meshGroups['nebula'] = nebGroup;

        Object.values(this.meshGroups).forEach(g => {
          g.visible = false;
          this.scene.add(g);
        });
        this.update3DVisibility();
      }

      setPreset(preset) {
        this.preset = preset;
        const is3D = ['hyperdrive', 'sphere', 'synthwave', 'vortex', 'matrix', 'neon_tunnel', 'blackhole', 'dna', 'fireworks', 'ocean', 'cybercity', 'stargate', 'eclipse', 'tesseract', 'nebula'].includes(preset);
        if (this.c2d) this.c2d.style.display = (!this.isRunning || is3D) ? 'none' : 'block';
        if (this.c3d) this.c3d.style.display = (!this.isRunning || !is3D) ? 'none' : 'block';
        this.update3DVisibility();
        this.resize();
      }

      update3DVisibility() {
        if (!this.meshGroups) return;
        Object.keys(this.meshGroups).forEach(k => {
          this.meshGroups[k].visible = (k === this.preset);
        });
      }

      start() {
        if (!this.isRunning) {
          this.isRunning = true;
          this.startLoop();
        }
        this.setPreset(this.preset);
      }

      stop() {
        this.isRunning = false;
        if (this.c2d) this.c2d.style.display = 'none';
        if (this.c3d) this.c3d.style.display = 'none';
      }

      startLoop() {
        const animate = () => {
          if (!this.isRunning) return;
          requestAnimationFrame(animate);

          const freqs = this.getFrequencyData();
          const bass = (freqs[0] + freqs[1] + freqs[2] + freqs[3]) / 4;
          const w = this.c2d ? this.c2d.width : 0;
          const h = this.c2d ? this.c2d.height : 0;

          // 2D Visualizer
          if (this.c2d && this.c2d.style.display !== 'none' && w && h) {
            this.ctx2d.clearRect(0, 0, w, h);

            if (this.preset === 'cyber') {
              const bars = 28;
              const barW = (w / bars) - 4;
              for (let i = 0; i < bars; i++) {
                const fVal = freqs[i % freqs.length] / 255;
                const bh = fVal * (h * 0.55) + 12;
                const x = i * (barW + 4) + 2;
                const y = h - bh;

                const grad = this.ctx2d.createLinearGradient(0, y, 0, h);
                grad.addColorStop(0, '#a855f7');
                grad.addColorStop(0.5, '#6366f1');
                grad.addColorStop(1, '#06b6d4');

                this.ctx2d.fillStyle = grad;
                this.ctx2d.beginPath();
                this.ctx2d.roundRect(x, y, barW, bh, [6, 6, 0, 0]);
                this.ctx2d.fill();

                this.ctx2d.fillStyle = '#67e8f9';
                this.ctx2d.fillRect(x, y - 6, barW, 3);
              }
            } else if (this.preset === 'particles') {
              const cx = w / 2;
              const cy = h / 2;
              const pCount = 24;
              for (let i = 0; i < pCount; i++) {
                const angle = (i / pCount) * Math.PI * 2 + (Date.now() * 0.001);
                const r = 90 + (freqs[i % freqs.length] / 255) * 80;
                const px = cx + Math.cos(angle) * r;
                const py = cy + Math.sin(angle) * r;

                this.ctx2d.fillStyle = i % 2 === 0 ? '#06b6d4' : '#a855f7';
                this.ctx2d.beginPath();
                this.ctx2d.arc(px, py, 4 + (freqs[i % freqs.length] / 255) * 6, 0, Math.PI * 2);
                this.ctx2d.fill();
              }
            } else if (this.preset === 'aurora') {
              const time = Date.now() * 0.002;
              this.ctx2d.lineWidth = 4;
              for (let j = 0; j < 3; j++) {
                this.ctx2d.beginPath();
                this.ctx2d.strokeStyle = j === 0 ? '#6366f1' : (j === 1 ? '#06b6d4' : '#a855f7');
                for (let x = 0; x < w; x += 15) {
                  const y = h / 2 + Math.sin(x * 0.01 + time + j) * 40 + Math.cos(x * 0.02 - time) * (bass * 0.3);
                  if (x === 0) this.ctx2d.moveTo(x, y);
                  else this.ctx2d.lineTo(x, y);
                }
                this.ctx2d.stroke();
              }
            }
          }

          // 3D Three.js Visualizer
          if (this.scene && this.c3d && this.c3d.style.display !== 'none') {
            if (this.preset === 'sphere' && this.sphereMesh) {
              this.sphereMesh.rotation.y += 0.01;
              this.sphereMesh.rotation.x += 0.005;
              const scale = 1 + (bass / 255) * 0.4;
              this.sphereMesh.scale.set(scale, scale, scale);
              if (this.coreMesh) this.coreMesh.rotation.y -= 0.02;
            } else if (this.preset === 'hyperdrive' && this.starPoints) {
              const positions = this.starPoints.geometry.attributes.position.array;
              const speed = 2 + (bass / 255) * 6;
              for (let i = 2; i < positions.length; i += 3) {
                positions[i] += speed;
                if (positions[i] > 100) positions[i] = -500;
              }
              this.starPoints.geometry.attributes.position.needsUpdate = true;
            } else if (this.preset === 'vortex' && this.vortexPoints) {
              this.vortexPoints.rotation.z += 0.01 + (bass / 255) * 0.02;
            } else if (this.preset === 'matrix' && this.matrixCubes) {
              this.matrixCubes.forEach((cube, idx) => {
                const fVal = freqs[idx % freqs.length] / 255;
                cube.scale.y = 1 + fVal * 6;
              });
            } else if (this.preset === 'neon_tunnel' && this.meshGroups['neon_tunnel']) {
              const group = this.meshGroups['neon_tunnel'];
              const speed = 0.5 + (bass / 255) * 1.5;
              group.children.forEach(ring => {
                  ring.position.z += speed;
                  if (ring.position.z > 10) ring.position.z -= 190;
                  ring.scale.setScalar(1 + (bass / 255) * 0.2);
              });
            } else if (this.preset === 'blackhole' && this.bhDisk) {
              this.meshGroups['blackhole'].rotation.y += 0.02 + (bass/255) * 0.05;
              this.meshGroups['blackhole'].rotation.x = 0.2;
              const positions = this.bhDisk.geometry.attributes.position.array;
              for(let i = 1; i < positions.length; i += 3) {
                  positions[i] = (Math.random() - 0.5) * (1 + (bass/255) * 4);
              }
              this.bhDisk.geometry.attributes.position.needsUpdate = true;
            } else if (this.preset === 'dna' && this.meshGroups['dna']) {
              this.meshGroups['dna'].rotation.y += 0.01 + (bass/255) * 0.02;
              this.meshGroups['dna'].scale.setScalar(1 + (bass/255) * 0.3);
            } else if (this.preset === 'fireworks' && this.fwPoints) {
              const positions = this.fwPoints.geometry.attributes.position.array;
              const speedMult = 0.2 + (bass/255) * 1.5;
              for(let i = 0; i < positions.length; i += 3) {
                  positions[i] += this.fwVels[i] * speedMult;
                  positions[i+1] += this.fwVels[i+1] * speedMult;
                  positions[i+2] += this.fwVels[i+2] * speedMult;
                  if (Math.abs(positions[i]) > 80 || Math.abs(positions[i+1]) > 80 || Math.abs(positions[i+2]) > 80) {
                      positions[i] = 0; positions[i+1] = 0; positions[i+2] = 0;
                  }
              }
              this.fwPoints.geometry.attributes.position.needsUpdate = true;
              this.meshGroups['fireworks'].rotation.y += 0.005;
            } else if (this.preset === 'ocean' && this.oceanMesh) {
              const time = Date.now() * 0.002;
              const pos = this.oceanMesh.geometry.attributes.position;
              for(let i = 0; i < pos.count; i++) {
                  const u = i % 51;
                  const v = Math.floor(i / 51);
                  const wave = Math.sin(u * 0.4 + time) * Math.cos(v * 0.4 + time) * 2;
                  pos.setZ(i, wave * (1 + (bass/255) * 2));
              }
              pos.needsUpdate = true;
            } else if (this.preset === 'cybercity' && this.cityBuildings) {
              this.cityBuildings.forEach((b, idx) => {
                const fVal = freqs[idx % freqs.length] / 255;
                const targetScaleY = 1 + fVal * 2.8;
                b.mesh.scale.y += (targetScaleY - b.mesh.scale.y) * 0.15;
              });
              this.meshGroups['cybercity'].rotation.y += 0.003;
            } else if (this.preset === 'stargate' && this.sgRings) {
              this.sgRings.forEach((ring, idx) => {
                const dir = idx % 2 === 0 ? 1 : -1;
                ring.rotation.z += dir * (0.008 + (bass / 255) * 0.02);
                ring.rotation.x += dir * 0.004;
              });
              if (this.sgCore) {
                const scale = 1 + (bass / 255) * 0.5;
                this.sgCore.scale.set(scale, scale, scale);
                this.sgCore.rotation.y += 0.02;
              }
            } else if (this.preset === 'eclipse' && this.coronaPoints) {
              this.meshGroups['eclipse'].rotation.z += 0.005;
              const scale = 1 + (bass / 255) * 0.35;
              this.coronaPoints.scale.set(scale, scale, scale);
            } else if (this.preset === 'tesseract' && this.tessOuter && this.tessInner) {
              this.tessOuter.rotation.x += 0.01 + (bass / 255) * 0.02;
              this.tessOuter.rotation.y += 0.012;
              this.tessInner.rotation.x -= 0.015;
              this.tessInner.rotation.z += 0.02 + (bass / 255) * 0.03;
              const scaleInner = 1 + (bass / 255) * 0.4;
              this.tessInner.scale.setScalar(scaleInner);
            } else if (this.preset === 'nebula' && this.nebPoints && this.pulsarMesh) {
              this.nebPoints.rotation.y += 0.004 + (bass / 255) * 0.01;
              this.pulsarMesh.rotation.x += 0.02;
              this.pulsarMesh.rotation.y += 0.03;
              const scale = 1 + (bass / 255) * 0.6;
              this.pulsarMesh.scale.setScalar(scale);
            }

            this.renderer.render(this.scene, this.camera);
          }
        };
        animate();
      }
    }

    class AppController {
      constructor() {
        this.fetcher = new MediaFetcher();
        this.currentTab = 'radio';
        this.currentCountry = 'FR';
        this.currentGenre = 'all';
        this.stations = [];
        this.activeStationIndex = -1;
        this.currentPlayingEpisode = null;

        this.speeds = [0.75, 1.0, 1.25, 1.5, 2.0];
        this.currentSpeedIdx = 1;

        this.favStore = new FavoritesStore(() => this.updateBadgesUI());
        this.subStore = new SubscriptionsStore(() => this.updateBadgesUI());
        this.resumeStore = new ResumeStore();
        this.queue = new QueueManager(() => this.renderQueueUI());

        this.initDOM();
        this.visualizer = new VisualizerEngine(this.canvas2D, this.canvas3D, this.media);
        this.bindEvents();
        this.initFullscreenAndHUD();
        this.updateBadgesUI();
        this.loadCatalog();
      }

      initDOM() {
        this.grid = document.getElementById('stations-grid');
        this.episodesContainer = document.getElementById('episodes-container');
        this.theater = document.getElementById('theater-stage');
        this.media = document.getElementById('unified-media');
        this.sidebar = document.getElementById('sidebar');
        this.audioOverlay = document.getElementById('audio-overlay');
        this.canvas2D = document.getElementById('visualizer-canvas-2d');
        this.canvas3D = document.getElementById('visualizer-canvas-3d');
        this.videoViewport = document.getElementById('video-viewport-wrapper');

        this.scrubSlider = document.getElementById('scrub-range');
        this.timeCurrent = document.getElementById('time-current');
        this.timeDuration = document.getElementById('time-duration');
        this.speedBtn = document.getElementById('btn-speed-toggle');
        this.queueDrawer = document.getElementById('queue-drawer');

        this.healthMonitor = new StreamHealthMonitor(
          this.media,
          document.getElementById('player-status-badge'),
          document.getElementById('live-badge-container')
        );
      }

      bindEvents() {
        document.getElementById('mobile-toggle').onclick = () => this.sidebar.classList.toggle('open');
        document.getElementById('tab-radio').onclick = () => this.switchTab('radio');
        document.getElementById('tab-radio-fav').onclick = () => this.switchTab('radio-fav');
        document.getElementById('tab-tv').onclick = () => this.switchTab('tv');
        document.getElementById('tab-tv-fav').onclick = () => this.switchTab('tv-fav');
        document.getElementById('tab-podcasts').onclick = () => this.switchTab('podcasts');
        document.getElementById('tab-podcast-subs').onclick = () => this.switchTab('podcast-subs');

        const animSelect = document.getElementById('anim-preset-select');
        if (animSelect) {
          animSelect.onchange = (e) => {
            this.visualizer.setPreset(e.target.value);
          };
        }

        document.getElementById('country-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#country-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentCountry = e.target.dataset.filter;
          this.loadCatalog();
        };

        document.getElementById('genre-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#genre-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentGenre = e.target.dataset.genre;
          this.loadCatalog();
        };

        document.getElementById('global-search').oninput = (e) => {
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => this.loadCatalog(e.target.value), 300);
        };

        // Player Controls
        document.getElementById('btn-play-pause').onclick = () => {
          if (this.media.paused) this.media.play();
          else this.media.pause();
        };

        document.getElementById('btn-skip-back').onclick = () => { this.media.currentTime = Math.max(0, this.media.currentTime - 10); };
        document.getElementById('btn-skip-forward').onclick = () => { this.media.currentTime = Math.min(this.media.duration || 0, this.media.currentTime + 30); };

        this.speedBtn.onclick = () => {
          this.currentSpeedIdx = (this.currentSpeedIdx + 1) % this.speeds.length;
          const speed = this.speeds[this.currentSpeedIdx];
          this.media.playbackRate = speed;
          this.speedBtn.textContent = `${speed}×`;
          this.showToast(`Vitesse : ${speed}×`);
        };

        this.scrubSlider.oninput = (e) => {
          if (this.media.duration) {
            const targetTime = (parseFloat(e.target.value) / 100) * this.media.duration;
            this.media.currentTime = targetTime;
          }
        };

        document.getElementById('volume-range').oninput = (e) => { this.media.volume = parseFloat(e.target.value); };
        document.getElementById('btn-volume-toggle').onclick = () => {
          this.media.muted = !this.media.muted;
          document.getElementById('icon-vol-high').style.display = this.media.muted ? 'none' : 'block';
          document.getElementById('icon-vol-mute').style.display = this.media.muted ? 'block' : 'none';
        };

        document.getElementById('btn-toggle-queue').onclick = () => this.queueDrawer.classList.toggle('open');
        document.getElementById('btn-clear-queue').onclick = () => this.queue.clear();

        // Favorite stage & player buttons
        const stageFavBtn = document.getElementById('btn-stage-fav');
        if (stageFavBtn) {
          stageFavBtn.onclick = () => {
            const currentItem = this.currentPlayingEpisode || this.stations[this.activeStationIndex];
            if (currentItem) this.toggleFav(currentItem);
          };
        }

        const playerFavBtn = document.getElementById('btn-player-fav');
        if (playerFavBtn) {
          playerFavBtn.onclick = () => {
            const currentItem = this.currentPlayingEpisode || this.stations[this.activeStationIndex];
            if (currentItem) this.toggleFav(currentItem);
          };
        }

        this.media.ontimeupdate = () => {
          if (this.media.duration) {
            const pct = (this.media.currentTime / this.media.duration) * 100;
            this.scrubSlider.value = pct;
            this.timeCurrent.textContent = this.formatTime(this.media.currentTime);
            this.timeDuration.textContent = this.formatTime(this.media.duration);

            if (this.currentPlayingEpisode) {
              this.resumeStore.save(this.currentPlayingEpisode.id, this.media.currentTime, this.media.duration, this.currentPlayingEpisode.title, this.selectedPodcast?.name);
            }
          }
        };

        this.media.onended = () => {
          const nextItem = this.queue.next();
          if (nextItem) {
            this.showToast(`▶ Suivant : ${nextItem.episode.title}`);
            this.playPodcastEpisodeObj(nextItem.episode, nextItem.podcast);
          }
        };

        this.media.onplay = () => {
          document.getElementById('icon-play').style.display = 'none';
          document.getElementById('icon-pause').style.display = 'block';
        };

        this.media.onpause = () => {
          document.getElementById('icon-play').style.display = 'block';
          document.getElementById('icon-pause').style.display = 'none';
        };
      }

      updateMetadata(title, subtitle, logo) {
        document.getElementById('player-title').textContent = title || 'Sans titre';
        document.getElementById('player-subtitle').textContent = subtitle || 'Direct Stream';
        document.getElementById('stage-title').textContent = title || 'OmniStream';

        const stageImg = document.getElementById('stage-cover-img');
        const stageFallback = document.getElementById('stage-cover-fallback');
        const playerImg = document.getElementById('player-thumb-img');
        const playerFallback = document.getElementById('player-thumb-fallback');

        if (logo) {
          stageImg.src = logo;
          stageImg.style.display = 'block';
          if (stageFallback) stageFallback.style.display = 'none';

          playerImg.src = logo;
          playerImg.style.display = 'block';
          if (playerFallback) playerFallback.style.display = 'none';
        } else {
          stageImg.style.display = 'none';
          if (stageFallback) stageFallback.style.display = 'block';

          playerImg.style.display = 'none';
          if (playerFallback) playerFallback.style.display = 'block';
        }

        stageImg.onerror = () => {
          stageImg.style.display = 'none';
          if (stageFallback) stageFallback.style.display = 'block';
        };
        playerImg.onerror = () => {
          playerImg.style.display = 'none';
          if (playerFallback) playerFallback.style.display = 'block';
        };
      }

      formatTime(seconds) {
        if (isNaN(seconds)) return '00:00';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }

      initFullscreenAndHUD() {
        const toggleFullscreen = () => {
          if (!document.fullscreenElement) {
            if (this.theater.requestFullscreen) this.theater.requestFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
          }
        };

        document.getElementById('btn-stage-fullscreen').onclick = toggleFullscreen;
        document.getElementById('btn-fullscreen').onclick = toggleFullscreen;

        window.addEventListener('keydown', (e) => {
          if (e.key === 'f' || e.key === 'F') {
            if (document.activeElement.tagName !== 'INPUT') {
              toggleFullscreen();
            }
          }
        });

        let hudTimeout;
        const resetHUDTimer = () => {
          document.body.classList.remove('hide-hud', 'hide-cursor');
          clearTimeout(hudTimeout);
          hudTimeout = setTimeout(() => {
            if (document.fullscreenElement || this.theater.classList.contains('active')) {
              document.body.classList.add('hide-hud', 'hide-cursor');
            }
          }, 3000);
        };
        window.addEventListener('mousemove', resetHUDTimer);
        window.addEventListener('touchstart', resetHUDTimer);
      }

      switchTab(tab) {
        this.currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');

        const heading = document.getElementById('catalog-heading');
        if (tab === 'radio') heading.textContent = 'Radios Populaires';
        else if (tab === 'radio-fav') heading.textContent = 'Mes Radios Favorites';
        else if (tab === 'tv') heading.textContent = 'Télévision en Direct';
        else if (tab === 'tv-fav') heading.textContent = 'Mes Chaînes TV Favorites';
        else if (tab === 'podcasts') heading.textContent = 'Podcasts & Replays';
        else if (tab === 'podcast-subs') heading.textContent = 'Mes Podcasts Suivis';

        this.loadCatalog();
      }

      async loadCatalog(search = '') {
        this.grid.style.display = 'grid';
        this.episodesContainer.innerHTML = '';
        this.grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Chargement en cours...</p></div>';

        if (this.currentTab === 'radio') this.stations = await this.fetcher.getRadios(this.currentCountry, this.currentGenre, search);
        else if (this.currentTab === 'tv') this.stations = await this.fetcher.getTV(this.currentCountry, this.currentGenre, search);
        else if (this.currentTab === 'podcasts') this.stations = await this.fetcher.getPodcasts(search, this.currentGenre, this.currentCountry);
        else if (this.currentTab === 'radio-fav') this.stations = this.favStore.getRadioFavs();
        else if (this.currentTab === 'tv-fav') this.stations = this.favStore.getTvFavs();
        else if (this.currentTab === 'podcast-subs') this.stations = this.subStore.getSubs();

        this.renderGrid();
      }

      renderGrid() {
        if (!this.stations || !this.stations.length) {
          this.grid.innerHTML = '<div class="loader-container"><p>Aucun contenu trouvé dans cette catégorie.</p></div>';
          return;
        }

        this.grid.innerHTML = this.stations.map((s, i) => {
          const isFav = this.favStore.isFav(s.id, s.type);
          return `
            <div class="station-card" onclick="app.handleCardClick(${i})">
              <button class="card-fav-btn ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); app.toggleFavByCard(${i})" title="Favori">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
              <button class="card-fs-btn" onclick="event.stopPropagation(); app.playStationInFullscreen(${i})" title="Lire en Plein Écran Total">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
              <div class="card-thumb-wrapper">
                <img src="${s.logo || ''}" onerror="this.style.display='none'">
              </div>
              <div>
                <div style="font-weight:600; font-size:0.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</div>
                <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">${s.artist || s.tags || s.country}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      handleCardClick(index) {
        const item = this.stations[index];
        if (!item) return;

        if (item.type === 'podcast') {
          this.loadPodcastEpisodes(item);
        } else {
          this.playStation(index);
        }
      }

      playStationInFullscreen(index) {
        this.playStation(index);
        if (this.theater.requestFullscreen) this.theater.requestFullscreen();
      }

      async loadPodcastEpisodes(podcast) {
        this.selectedPodcast = podcast;
        this.grid.style.display = 'none';
        this.episodesContainer.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Extraction des épisodes...</p></div>';

        const episodes = await this.fetcher.getPodcastEpisodes(podcast.feedUrl);
        const isSubbed = this.subStore.isSubbed(podcast.id);

        if (!episodes || episodes.length === 0) {
          this.episodesContainer.innerHTML = `
            <div class="episodes-panel">
              <div class="podcast-header-detail">
                <img src="${podcast.logo}" class="podcast-detail-cover" onerror="this.style.display='none'">
                <div class="podcast-header-info">
                  <button class="stage-btn" onclick="app.closeEpisodes()" style="width:fit-content;">← Retour</button>
                  <h3 style="font-size:1.15rem; font-weight:700;">${podcast.name}</h3>
                  <p style="font-size:0.82rem; color:var(--text-secondary);">${podcast.artist || 'Podcast'}</p>
                </div>
              </div>
              <div class="loader-container">
                <p style="color:var(--text-secondary);">Impossible de charger les épisodes de ce flux pour le moment.</p>
                <button class="stage-btn" onclick="app.loadPodcastEpisodes(app.selectedPodcast)" style="margin-top:10px;">Réessayer 🔄</button>
              </div>
            </div>
          `;
          return;
        }

        this.episodesContainer.innerHTML = `
          <div class="episodes-panel">
            <div class="podcast-header-detail">
              <img src="${podcast.logo}" class="podcast-detail-cover" onerror="this.style.display='none'">
              <div class="podcast-header-info">
                <button class="stage-btn" onclick="app.closeEpisodes()" style="width:fit-content;">← Retour</button>
                <h3 style="font-size:1.15rem; font-weight:700;">${podcast.name}</h3>
                <p style="font-size:0.82rem; color:var(--text-secondary);">${podcast.artist} • ${episodes.length} épisodes récents</p>
                <button class="btn-subscribe ${isSubbed ? 'is-subbed' : ''}" onclick="app.toggleSub()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                  <span>${isSubbed ? 'Abonné ⭐' : "S'abonner +"}</span>
                </button>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${episodes.map((ep, idx) => {
                const prog = this.resumeStore.get(ep.id);
                const pct = prog ? Math.min(100, Math.round((prog.currentTime / prog.duration) * 100)) : 0;
                return `
                  <div class="episode-item" onclick="app.playPodcastEpisode(${idx})">
                    ${pct > 0 ? `<div class="episode-progress-bar" style="width:${pct}%;"></div>` : ''}
                    <div style="flex:1;">
                      <div style="font-weight:600; font-size:0.88rem;">${ep.title}</div>
                      <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">
                        ${ep.pubDate} ${pct > 0 ? `• <span style="color:var(--accent-cyan); font-weight:700;">${pct}% écouté</span>` : ''}
                      </div>
                    </div>
                    <div class="episode-actions" onclick="event.stopPropagation();">
                      <button class="btn-action-sm" onclick="app.addToQueue(${idx})">+ File</button>
                      <button class="ctrl-btn play-main" style="width:34px; height:34px;" onclick="app.playPodcastEpisode(${idx})">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        this.currentEpisodes = episodes;
      }

      toggleSub() {
        if (!this.selectedPodcast) return;
        const subbed = this.subStore.toggle(this.selectedPodcast);
        this.showToast(subbed ? `⭐ Abonné à "${this.selectedPodcast.name}"` : `Abonnement retiré`);
        this.loadPodcastEpisodes(this.selectedPodcast);
      }

      addToQueue(idx) {
        const ep = this.currentEpisodes[idx];
        if (ep) {
          this.queue.add(ep, this.selectedPodcast);
          this.showToast(`Ajouté à la file : "${ep.title}"`);
        }
      }

      closeEpisodes() {
        this.episodesContainer.innerHTML = '';
        this.grid.style.display = 'grid';
      }

      playPodcastEpisode(idx) {
        const ep = this.currentEpisodes[idx];
        if (ep) this.playPodcastEpisodeObj(ep, this.selectedPodcast);
      }

      playPodcastEpisodeObj(ep, podcast) {
        this.currentPlayingEpisode = ep;
        this.theater.classList.add('active');

        const logoUrl = podcast ? podcast.logo : '';
        this.updateMetadata(ep.title, podcast ? podcast.name : 'Podcast', logoUrl);

        this.media.style.display = 'none';
        this.audioOverlay.style.display = 'flex';
        this.visualizer.start();
        this.visualizer.setPreset(document.getElementById('anim-preset-select').value || 'cyber');

        this.playMediaStream(ep.url, false);
        
        const prog = this.resumeStore.get(ep.id);
        if (prog && prog.currentTime > 5 && prog.currentTime < (prog.duration - 10)) {
          this.media.currentTime = prog.currentTime;
          this.showToast(`Reprise de la lecture à ${this.formatTime(prog.currentTime)}`);
        }
      }

      playStation(index) {
        const s = this.stations[index];
        if (!s) return;
        this.currentPlayingEpisode = null;
        this.activeStationIndex = index;
        this.theater.classList.add('active');

        this.updateMetadata(s.name, s.tags || s.country, s.logo);

        const isVideo = s.type === 'video' || s.type === 'tv';
        if (isVideo) {
          this.audioOverlay.style.display = 'none';
          this.media.style.display = 'block';
          this.visualizer.stop();
          this.playMediaStream(s.url, true);
        } else {
          this.media.style.display = 'none';
          this.audioOverlay.style.display = 'flex';
          this.visualizer.start();
          this.visualizer.setPreset(document.getElementById('anim-preset-select').value || 'cyber');
          this.playMediaStream(s.url, false);
        }
      }

      playMediaStream(url, isVideo) {
        if (this.hlsPlayer) {
          this.hlsPlayer.destroy();
          this.hlsPlayer = null;
        }

        let cleanUrl = (url || '').trim();
        if (window.location.protocol === 'https:' && cleanUrl.startsWith('http://')) {
          cleanUrl = cleanUrl.replace('http://', 'https://');
        }

        this.media.muted = false;
        if (!this.media.volume || this.media.volume === 0) this.media.volume = 0.8;

        // Détection élargie des flux HLS (pas seulement l'extension .m3u8)
        const isAudioFile = /\.(mp3|aac|ogg|wav|m4a)(\?.*)?$/i.test(cleanUrl);
        const isHlsUrl = cleanUrl.includes('.m3u8') || cleanUrl.includes('/hls/') || cleanUrl.includes('manifest') || cleanUrl.includes('playlist') || isVideo || !isAudioFile;

        if (isHlsUrl && typeof Hls !== 'undefined' && Hls.isSupported()) {
          const config = {
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
            maxBufferLength: 30,
            maxMaxBufferLength: 600,
            maxBufferHole: 0.5,
            manifestLoadingTimeOut: 12000,
            manifestLoadingMaxRetry: 4,
            levelLoadingMaxRetry: 4,
            fragLoadingMaxRetry: 6
          };

          this.hlsPlayer = new Hls(config);
          this.hlsPlayer.loadSource(cleanUrl);
          this.hlsPlayer.attachMedia(this.media);

          this.hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
            this.media.play().catch(() => {});
          });

          // Système d'auto-récupération en cas d'erreur réseau ou buffer (comme les lecteurs HLS professionnels)
          this.hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  console.warn('Problème réseau HLS, tentative de reconnexion...');
                  this.hlsPlayer.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.warn('Erreur média HLS, tentative de récupération...');
                  this.hlsPlayer.recoverMediaError();
                  break;
                default:
                  console.error('Erreur HLS irrécupérable, bascule sur lecteur natif');
                  this.hlsPlayer.destroy();
                  this.hlsPlayer = null;
                  this.media.src = cleanUrl;
                  this.media.play().catch(() => {});
                  break;
              }
            }
          });
        } else if (this.media.canPlayType('application/vnd.apple.mpegurl') && cleanUrl.includes('.m3u8')) {
          // Support natif HLS (Safari/iOS)
          this.media.src = cleanUrl;
          this.media.play().catch(() => {});
        } else {
          // Fichiers audio directs (MP3/AAC/OGG)
          this.media.src = cleanUrl;
          this.media.play().catch(() => {});
        }
      }

      toggleFavByCard(index) {
        const s = this.stations[index];
        if (s) this.toggleFav(s);
      }

      toggleFav(station) {
        const added = this.favStore.toggle(station);
        this.showToast(added ? `⭐ "${station.name}" ajouté aux favoris` : `Retiré des favoris`);
        this.renderGrid();
      }

      updateBadgesUI() {
        const radioBadge = document.getElementById('fav-radio-badge');
        const tvBadge = document.getElementById('fav-tv-badge');
        const subBadge = document.getElementById('sub-podcast-badge');

        if (radioBadge) radioBadge.textContent = this.favStore.getRadioFavs().length;
        if (tvBadge) tvBadge.textContent = this.favStore.getTvFavs().length;
        if (subBadge) subBadge.textContent = this.subStore.getSubs().length;
      }

      renderQueueUI() {
        const listEl = document.getElementById('queue-items-list');
        const badgeEl = document.getElementById('queue-badge');
        if (!listEl) return;

        if (badgeEl) badgeEl.textContent = this.queue.queue.length;

        if (this.queue.queue.length === 0) {
          listEl.innerHTML = '<p style="color:var(--text-secondary); font-size:0.85rem;">Aucun épisode dans la file d\'attente.</p>';
          return;
        }

        listEl.innerHTML = this.queue.queue.map((item, idx) => `
          <div class="queue-item">
            <div style="flex:1; overflow:hidden;">
              <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.episode.title}</div>
              <div style="font-size:0.75rem; color:var(--text-secondary);">${item.podcast?.name || 'Podcast'}</div>
            </div>
            <button class="btn-action-sm" onclick="app.queue.remove(${idx})">✕</button>
          </div>
        `).join('');
      }

      showToast(msg) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = msg;
        document.body.appendChild(toast);

        setTimeout(() => toast.remove(), 2800);
      }
    }

    // Initialize Application on DOM Ready
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new AppController();
    });
  </script>
</body>
</html>
