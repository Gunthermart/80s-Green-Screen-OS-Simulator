<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream — Live Radio & IPTV Player</title>
  
  <!-- Hls.js pour la lecture des flux vidéo/audio M3U8 en direct -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Three.js pour le rendu des animations 3D WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #111420;
      --bg-surface-elevated: #181c2e;
      --bg-glass: rgba(17, 20, 32, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-live: #ef4444;

      --sidebar-width: 280px;
      --player-height: 84px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-live);
      text-transform: uppercase;
    }

    .live-badge.is-active { color: #10b981; }
    .live-badge.is-buffering { color: #f59e0b; }
    .live-badge.is-dead { color: #ef4444; }

    .live-dot {
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    body.hide-cursor { cursor: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s ease;
    }

    .brand-section {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-tabs {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
      user-select: none;
    }

    .nav-item:hover { background: var(--bg-surface-elevated); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .sidebar-filters {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 4px 8px;
      font-weight: 700;
    }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.8rem;
      padding: 6px 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .chip:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .chip.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .card-fav-btn:hover {
      transform: scale(1.15);
      color: #ef4444;
      background: rgba(16, 19, 30, 0.95);
    }

    .card-fav-btn.is-fav {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .card-fav-btn.is-fav svg { fill: #ef4444; stroke: #ef4444; }

    .card-fs-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 19, 30, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
      opacity: 0.85;
    }

    .card-fs-btn:hover {
      transform: scale(1.15);
      color: var(--accent-cyan);
      background: rgba(16, 19, 30, 0.95);
      border-color: var(--accent-cyan);
      opacity: 1;
    }

    .toast-notification {
      position: fixed;
      bottom: calc(var(--player-height) + 16px);
      right: 24px;
      background: rgba(17, 20, 32, 0.95);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: var(--radius-full);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      z-index: 100;
      backdrop-filter: blur(12px);
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.05), transparent 40%), var(--bg-base);
    }

    .top-header {
      height: 74px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      background: var(--bg-glass);
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    .search-box { flex: 1; max-width: 480px; position: relative; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); stroke: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .search-input:focus { border-color: var(--accent-primary); }

    #content-stage {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px calc(var(--player-height) + 24px) 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    #theater-stage {
      width: 100%;
      background: #000;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      overflow: hidden;
      display: none;
      position: sticky;
      top: 0;
      z-index: 25;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), var(--shadow-glow);
      backdrop-filter: blur(16px);
    }

    #theater-stage.active { display: block; }
    #theater-stage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .hud-element {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.hide-hud .hud-element {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .stage-hud-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .stage-title-hud {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .stage-controls-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    .stage-btn:hover { background: rgba(99, 102, 241, 0.4); }

    .video-viewport {
      width: 100%;
      max-height: 480px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #theater-stage:fullscreen .video-viewport {
      max-height: 100vh !important;
      height: 100vh !important;
    }

    video#unified-media { width: 100%; height: 100%; object-fit: contain; }

    .canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #visualizer-canvas-2d { z-index: 2; }
    #visualizer-canvas-3d { z-index: 1; }

    .audio-visualizer-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17, 20, 32, 0.85), rgba(9, 10, 15, 0.92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      pointer-events: none;
    }

    .audio-cover {
      width: 110px;
      height: 110px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface-elevated);
      border: 2px solid var(--border-glass);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .audio-cover img { width: 100%; height: 100%; object-fit: cover; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .station-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: var(--transition-smooth);
      position: relative;
    }

    .station-card:hover { transform: translateY(-4px); background: var(--bg-surface-elevated); border-color: rgba(99, 102, 241, 0.4); }
    .station-card.is-playing { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.12); }

    .card-thumb-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      position: relative;
    }
    .card-thumb-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }

    .card-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
    }

    #sticky-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--player-height);
      background: rgba(14, 17, 27, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 50;
    }

    .player-left { display: flex; align-items: center; gap: 14px; min-width: 240px; }
    .player-thumb { width: 52px; height: 52px; border-radius: var(--radius-sm); background: var(--bg-surface-elevated); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .player-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .player-controls { display: flex; align-items: center; gap: 14px; }

    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; outline: none; transition: var(--transition-smooth); }
    .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.08); }
    .ctrl-btn.play-main { width: 48px; height: 48px; background: var(--text-primary); color: var(--bg-base); }
    .ctrl-btn.play-main:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    .player-right { display: flex; align-items: center; gap: 16px; min-width: 220px; justify-content: flex-end; }
    .volume-group { display: flex; align-items: center; gap: 8px; }
    .volume-slider { width: 80px; height: 4px; accent-color: var(--accent-primary); cursor: pointer; }

    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px; color: var(--text-secondary); grid-column: 1 / -1; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 920px) {
      #sidebar { position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .volume-group { display: none; }
      #content-stage { padding: 16px 16px calc(var(--player-height) + 16px) 16px; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <aside id="sidebar">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        </div>
        <div class="live-badge" id="live-badge-container">
          <span class="live-dot"></span>
          <span id="player-status-badge">DIRECT STREAM</span>
          <span id="player-fps-badge" style="font-size:0.65rem; opacity:0.8; margin-left:4px;"></span>
        </div>
        <span class="brand-title">OmniStream Live</span>
      </div>

      <nav class="nav-tabs">
        <div class="nav-item active" id="tab-radio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Radios du Monde</span>
        </div>
        <div class="nav-item" id="tab-radio-fav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Favoris Radios</span>
          <span id="fav-radio-badge" style="margin-left:auto; font-size:0.7rem; padding:2px 8px; background:rgba(239,68,68,0.2); color:#fca5a5; border-radius:10px; font-weight:700;">0</span>
        </div>

        <div class="nav-item" id="tab-tv" style="margin-top:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Télévision en Direct</span>
        </div>
        <div class="nav-item" id="tab-tv-fav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span style="font-size:0.9rem; font-weight:600;">Favoris TV</span>
          <span id="fav-tv-badge" style="margin-left:auto; font-size:0.7rem; padding:2px 8px; background:rgba(6,182,212,0.2); color:#67e8f9; border-radius:10px; font-weight:700;">0</span>
        </div>
      </nav>

      <div class="sidebar-filters">
        <div class="filter-group-title">Pays / Régions</div>
        <div class="filter-chips" id="country-filters">
          <button class="chip active" data-filter="FR">France</button>
          <button class="chip" data-filter="GLOBAL">Monde</button>
          <button class="chip" data-filter="US">États-Unis</button>
          <button class="chip" data-filter="GB">Royaume-Uni</button>
          <button class="chip" data-filter="CA">Canada</button>
          <button class="chip" data-filter="BE">Belgique</button>
          <button class="chip" data-filter="CH">Suisse</button>
        </div>

        <div class="filter-group-title" style="margin-top:10px;">Thématiques / Genres</div>
        <div class="filter-chips" id="genre-filters">
          <button class="chip active" data-genre="all">Tous</button>
          <button class="chip" data-genre="news">Information</button>
          <button class="chip" data-genre="jazz">Jazz</button>
          <button class="chip" data-genre="pop">Pop</button>
          <button class="chip" data-genre="rock">Rock</button>
          <button class="chip" data-genre="classical">Classique</button>
          <button class="chip" data-genre="electro">Électro</button>
        </div>
      </div>
    </aside>

    <div id="main-wrapper">
      <header class="top-header">
        <button class="mobile-menu-btn" id="mobile-toggle" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" class="search-input" placeholder="Rechercher une station ou chaîne...">
        </div>
        <div id="station-count" style="font-size:0.85rem; color:var(--text-secondary);">Chargement...</div>
      </header>

      <main id="content-stage">
        <section id="theater-stage">
          <div class="stage-hud-top hud-element" id="stage-hud-top">
            <span class="stage-title-hud" id="stage-title">Sélectionnez une station</span>
            <div class="stage-controls-hud">
              <button class="stage-btn" id="btn-stage-fav" title="Ajouter aux favoris">

  <script>
    class FavoritesStore {
      constructor(onChange) {
        this.onChange = onChange;
        this.radioFavs = new Map();
        this.tvFavs = new Map();
        this.loadLocal();
      }

      loadLocal() {
        try {
          const storedRadio = localStorage.getItem('omni_favs_radio');
          if (storedRadio) {
            const arr = JSON.parse(storedRadio);
            arr.forEach(item => this.radioFavs.set(item.id, item));
          }
          const storedTv = localStorage.getItem('omni_favs_tv');
          if (storedTv) {
            const arr = JSON.parse(storedTv);
            arr.forEach(item => this.tvFavs.set(item.id, item));
          }
        } catch (e) {
          console.warn('Erreur de lecture des favoris locaux:', e);
        }
      }

      saveLocal() {
        try {
          localStorage.setItem('omni_favs_radio', JSON.stringify(Array.from(this.radioFavs.values())));
          localStorage.setItem('omni_favs_tv', JSON.stringify(Array.from(this.tvFavs.values())));
        } catch (e) {
          console.warn('Erreur de sauvegarde des favoris locaux:', e);
        }
      }

      toggle(station) {
        const isTv = station.type === 'video' || station.type === 'tv';
        const targetMap = isTv ? this.tvFavs : this.radioFavs;
        const exists = targetMap.has(station.id);

        if (exists) {
          targetMap.delete(station.id);
        } else {
          targetMap.set(station.id, station);
        }

        this.saveLocal();
        if (this.onChange) this.onChange();
        return !exists;
      }

      isFav(stationId, type) {
        const isTv = type === 'video' || type === 'tv';
        return isTv ? this.tvFavs.has(stationId) : this.radioFavs.has(stationId);
      }

      getRadioFavs() { return Array.from(this.radioFavs.values()); }
      getTvFavs() { return Array.from(this.tvFavs.values()); }
    }

    const BACKUP_STATIONS = {
      FR_RADIO: [
        { id: 'fip', name: 'FIP Radio', url: 'https://stream.radiofrance.fr/fip/fip.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/fip.svg', country: 'FR', tags: 'Eclectique, Jazz', type: 'audio' },
        { id: 'franceinter', name: 'France Inter', url: 'https://stream.radiofrance.fr/franceinter/franceinter.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/franceinter.svg', country: 'FR', tags: 'Generaliste, News', type: 'audio' },
        { id: 'franceinfo', name: 'France Info', url: 'https://stream.radiofrance.fr/franceinfo/franceinfo.m3u8?id=radiofrance', logo: 'https://www.radiofrance.fr/assets/images/brands/franceinfo.svg', country: 'FR', tags: 'Information, Direct', type: 'audio' },
        { id: 'rtl', name: 'RTL France', url: 'https://icecast.rtl.fr/rtl-1-44-128', logo: 'https://upload.wikimedia.org/wikipedia/commons/e/e1/RTL_logo.svg', country: 'FR', tags: 'Info, Pop', type: 'audio' },
        { id: 'europe1', name: 'Europe 1', url: 'https://europe1.lmn.cloud/europe1.mp3', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/b5/Europe_1_logo_2010.svg', country: 'FR', tags: 'Actualites', type: 'audio' }
      ],
      FR_TV: [
        { id: 'tv_france24', name: 'France 24 Direct', url: 'https://static.france24.com/live/F24_FR_LO_HLS/live_tv.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/fr/4/4e/France_24_logo_2013.svg', country: 'FR', tags: 'Information', type: 'video' },
        { id: 'tv_arte', name: 'ARTE Journal Live', url: 'https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/07/Logo_Arte.svg', country: 'FR', tags: 'Culture', type: 'video' },
        { id: 'tv_euronews', name: 'Euronews Français', url: 'https://euronews-euronews-french-1-eu.rakuten.wurl.tv/playlist.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Euronews_2016_logo.svg', country: 'FR', tags: 'News', type: 'video' }
      ]
    };

    class MediaFetcher {
      async getRadios(country = 'FR', genre = 'all', search = '') {
        const mirror = 'https://de1.api.radio-browser.info';
        let url = `${mirror}/json/stations/bycountrycodeexact/${country.toLowerCase()}?limit=60&order=votes&reverse=true`;
        if (search) url = `${mirror}/json/stations/byname/${encodeURIComponent(search)}?limit=60`;
        else if (genre && genre !== 'all') url = `${mirror}/json/stations/bytag/${encodeURIComponent(genre)}?limit=60`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const list = data.map(s => ({
            id: s.stationuuid,
            name: s.name.trim(),
            url: s.url_resolved || s.url,
            logo: s.favicon,
            country: s.countrycode || country,
            tags: s.tags ? s.tags.split(',').slice(0, 2).join(', ') : 'Radio',
            type: 'audio'
          })).filter(s => s.url && s.name);
          return list.length ? list : BACKUP_STATIONS.FR_RADIO;
        } catch {
          return BACKUP_STATIONS.FR_RADIO;
        }
      }

      async getTV(country = 'FR', genre = 'all', search = '') {
        const targetUrl = `https://iptv-org.github.io/iptv/countries/${country.toLowerCase()}.m3u`;
        try {
          const res = await fetch(targetUrl);
          if (!res.ok) throw new Error();
          const text = await res.text();
          const list = this.parseM3U(text, search, country);
          return list.length ? list : BACKUP_STATIONS.FR_TV;
        } catch {
          return BACKUP_STATIONS.FR_TV;
        }
      }

      parseM3U(content, search = '', country = 'FR') {
        const lines = content.split('\n');
        const list = [];
        let item = null;

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const name = (line.match(/,(.+)$/) || [])[1] || 'Chaîne TV';
            const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
            const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Direct TV';
            const cleanId = `tv_${name.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
            item = { id: cleanId, name, logo, country, tags: group, type: 'video' };
          } else if (line && !line.startsWith('#') && item) {
            item.url = line;
            if (!search || item.name.toLowerCase().includes(search.toLowerCase())) {
              list.push(item);
            }
            item = null;
          }
          if (list.length >= 80) break;
        }
        return list;
      }
    }

    class VisualizerEngine {
      constructor(canvas2D, canvas3D) {
        this.c2d = canvas2D;
        this.ctx2d = canvas2D.getContext('2d');
        this.c3d = canvas3D;
        this.preset = 'cyber';
        this.isRunning = false;

        this.initThreeJS();
        this.startLoop();
      }

      initThreeJS() {
        if (typeof THREE === 'undefined') return;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ canvas: this.c3d, alpha: true, antialias: true });
        this.camera.position.z = 40;

        // Visual 3D Object: Cyber Sphere
        const geo = new THREE.IcosahedronGeometry(15, 2);
        const mat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true });
        this.sphereMesh = new THREE.Mesh(geo, mat);
        this.scene.add(this.sphereMesh);
      }

      setPreset(preset) {
        this.preset = preset;
        const is3D = ['hyperdrive', 'sphere', 'synthwave', 'vortex', 'cubes'].includes(preset);
        this.c2d.style.display = is3D ? 'none' : 'block';
        this.c3d.style.display = is3D ? 'block' : 'none';
      }

      stop() {
        this.c2d.style.display = 'none';
        this.c3d.style.display = 'none';
        this.isRunning = false;
      }

      startLoop() {
        this.isRunning = true;
        const animate = () => {
          if (!this.isRunning) return;
          requestAnimationFrame(animate);

          const time = Date.now() * 0.002;
          const w = this.c2d.width = this.c2d.offsetWidth;
          const h = this.c2d.height = this.c2d.offsetHeight;

          if (this.preset === 'cyber' && w && h) {
            this.ctx2d.clearRect(0, 0, w, h);
            const bars = 32;
            const barW = w / bars;
            for (let i = 0; i < bars; i++) {
              const bh = (Math.sin(time + i * 0.2) * 0.5 + 0.5) * (h * 0.6) + 10;
              this.ctx2d.fillStyle = 'rgba(99, 102, 241, 0.6)';
              this.ctx2d.fillRect(i * barW, h - bh, barW - 3, bh);
            }
          }

          if (this.sphereMesh && this.c3d.style.display !== 'none') {
            this.renderer.setSize(this.c3d.offsetWidth, this.c3d.offsetHeight, false);
            this.sphereMesh.rotation.x += 0.005;
            this.sphereMesh.rotation.y += 0.008;
            this.renderer.render(this.scene, this.camera);
          }
        };
        animate();
      }
    }

    class StreamActivityMonitor {
      constructor(mediaElement, onStatusChange) {
        this.media = mediaElement;
        this.onStatusChange = onStatusChange;
        this.interval = null;
        this.lastTime = 0;
        this.lastTotalFrames = 0;
        this.stallCount = 0;
      }

      start() {
        this.stop();
        this.lastTime = this.media.currentTime;
        this.stallCount = 0;
        this.interval = setInterval(() => this.checkActivity(), 1000);
      }

      stop() {
        if (this.interval) clearInterval(this.interval);
        this.interval = null;
      }

      checkActivity() {
        if (this.media.paused || this.media.ended) {
          this.onStatusChange({ label: 'EN PAUSE', badgeClass: 'is-buffering', fpsDetails: '' });
          return;
        }

        const currentTime = this.media.currentTime;
        const timeAdvanced = (currentTime - this.lastTime) > 0.15;
        this.lastTime = currentTime;

        let fps = 0;
        if (typeof this.media.getVideoPlaybackQuality === 'function') {
          const quality = this.media.getVideoPlaybackQuality();
          fps = quality.totalVideoFrames - this.lastTotalFrames;
          this.lastTotalFrames = quality.totalVideoFrames;
        }

        if (timeAdvanced) {
          this.stallCount = 0;
          this.onStatusChange({
            label: 'FLUX ACTIF 🟢',
            fpsDetails: fps > 0 ? `${fps} FPS` : 'Audio OK',
            badgeClass: 'is-active'
          });
        } else {
          this.stallCount++;
          if (this.stallCount >= 4) {
            this.onStatusChange({ label: 'SIGNAL PERDU 🔴', fpsDetails: 'Erreur', badgeClass: 'is-dead' });
          } else {
            this.onStatusChange({ label: 'CHARGEMENT 🟡', fpsDetails: 'Buffering...', badgeClass: 'is-buffering' });
          }
        }
      }
    }

    class AppController {
      constructor() {
        this.fetcher = new MediaFetcher();
        this.currentTab = 'radio';
        this.currentCountry = 'FR';
        this.currentGenre = 'all';
        this.stations = [];
        this.activeStationIndex = -1;
        this.hls = null;
        this.idleTimer = null;

        this.favStore = new FavoritesStore(() => {
          this.updateFavBadges();
          this.updateFavButtonsUI();
          if (this.currentTab.includes('fav')) this.loadCatalog();
        });

        this.initDOM();
        this.visualizer = new VisualizerEngine(this.canvas2D, this.canvas3D);
        
        this.streamMonitor = new StreamActivityMonitor(this.media, (info) => {
          const container = document.getElementById('live-badge-container');
          const badgeText = document.getElementById('player-status-badge');
          const badgeFps = document.getElementById('player-fps-badge');
          if (container && badgeText) {
            container.className = `live-badge ${info.badgeClass}`;
            badgeText.textContent = info.label;
            if (badgeFps) badgeFps.textContent = info.fpsDetails ? `(${info.fpsDetails})` : '';
          }
        });

        this.bindEvents();
        this.updateFavBadges();
        this.loadCatalog();
      }

      initDOM() {
        this.grid = document.getElementById('stations-grid');
        this.count = document.getElementById('station-count');
        this.theater = document.getElementById('theater-stage');
        this.media = document.getElementById('unified-media');
        this.sidebar = document.getElementById('sidebar');
        this.audioOverlay = document.getElementById('audio-overlay');
        this.canvas2D = document.getElementById('visualizer-canvas-2d');
        this.canvas3D = document.getElementById('visualizer-canvas-3d');
      }

      bindEvents() {
        document.getElementById('mobile-toggle').onclick = () => this.sidebar.classList.toggle('open');
        document.getElementById('tab-radio').onclick = () => this.switchTab('radio');
        document.getElementById('tab-radio-fav').onclick = () => this.switchTab('radio-fav');
        document.getElementById('tab-tv').onclick = () => this.switchTab('tv');
        document.getElementById('tab-tv-fav').onclick = () => this.switchTab('tv-fav');

        const handleFavToggle = () => {
          if (this.activeStationIndex < 0 || !this.stations[this.activeStationIndex]) return;
          const station = this.stations[this.activeStationIndex];
          const added = this.favStore.toggle(station);
          this.showToast(added ? `❤️ "${station.name}" ajouté aux favoris` : `Retiré des favoris`);
          this.updateFavButtonsUI();
          this.renderGrid();
        };

        document.getElementById('btn-stage-fav').onclick = handleFavToggle;
        document.getElementById('btn-player-fav').onclick = handleFavToggle;

        document.getElementById('country-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#country-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentCountry = e.target.dataset.filter;
          this.loadCatalog();
        };

        document.getElementById('genre-filters').onclick = (e) => {
          if (!e.target.classList.contains('chip')) return;
          document.querySelectorAll('#genre-filters .chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          this.currentGenre = e.target.dataset.genre;
          this.loadCatalog();
        };

        document.getElementById('global-search').oninput = (e) => {
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => this.loadCatalog(e.target.value), 300);
        };

        document.getElementById('btn-play-pause').onclick = () => {
          if (this.media.paused) this.media.play();
          else this.media.pause();
        };

        document.getElementById('btn-prev').onclick = () => this.playAdjacentStation(-1);
        document.getElementById('btn-next').onclick = () => this.playAdjacentStation(1);

        document.getElementById('volume-range').oninput = (e) => {
          this.media.volume = parseFloat(e.target.value);
        };

        document.getElementById('btn-volume-toggle').onclick = () => {
          this.media.muted = !this.media.muted;
          document.getElementById('icon-vol-high').style.display = this.media.muted ? 'none' : 'block';
          document.getElementById('icon-vol-mute').style.display = this.media.muted ? 'block' : 'none';
        };

        document.getElementById('anim-preset-select').onchange = (e) => {
          this.visualizer.setPreset(e.target.value);
        };

        const toggleFullscreen = () => {
          if (!document.fullscreenElement) this.theater.requestFullscreen().catch(err => console.warn(err));
          else document.exitFullscreen();
        };

        document.getElementById('btn-stage-fullscreen').onclick = toggleFullscreen;
        document.getElementById('btn-fullscreen').onclick = toggleFullscreen;

        window.addEventListener('keydown', (e) => {
          if ((e.key === 'f' || e.key === 'F') && document.activeElement.tagName !== 'INPUT') toggleFullscreen();
        });

        const resetIdleTimer = () => {
          document.body.classList.remove('hide-hud');
          document.body.classList.remove('hide-cursor');
          clearTimeout(this.idleTimer);
          this.idleTimer = setTimeout(() => {
            if (document.fullscreenElement || (this.currentTab.includes('radio') && this.theater.classList.contains('active'))) {
              document.body.classList.add('hide-hud');
              if (document.fullscreenElement) document.body.classList.add('hide-cursor');
            }
          }, 3000);
        };

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);

        this.media.onplay = () => {
          document.getElementById('icon-play').style.display = 'none';
          document.getElementById('icon-pause').style.display = 'block';
          this.streamMonitor.start();
        };

        this.media.onpause = () => {
          document.getElementById('icon-play').style.display = 'block';
          document.getElementById('icon-pause').style.display = 'none';
          this.streamMonitor.stop();
        };
      }

      switchTab(tab) {
        this.currentTab = tab;
        document.getElementById('tab-radio').classList.toggle('active', tab === 'radio');
        document.getElementById('tab-radio-fav').classList.toggle('active', tab === 'radio-fav');
        document.getElementById('tab-tv').classList.toggle('active', tab === 'tv');
        document.getElementById('tab-tv-fav').classList.toggle('active', tab === 'tv-fav');

        const heading = document.getElementById('catalog-heading');
        if (tab === 'radio') heading.textContent = 'Radios Populaires';
        else if (tab === 'radio-fav') heading.textContent = 'Mes Radios Favorites';
        else if (tab === 'tv') heading.textContent = 'Télévision en Direct';
        else if (tab === 'tv-fav') heading.textContent = 'Mes Chaînes TV Favorites';

        if (tab.includes('tv')) {
          this.visualizer.stop();
          document.getElementById('stage-hud-top').style.display = 'none';
        } else {
          document.getElementById('stage-hud-top').style.display = 'flex';
        }

        this.loadCatalog();
      }

      async loadCatalog(search = '') {
        this.grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Chargement des flux multimédias...</p></div>';
        
        if (this.currentTab === 'radio') {
          this.stations = await this.fetcher.getRadios(this.currentCountry, this.currentGenre, search);
        } else if (this.currentTab === 'tv') {
          this.stations = await this.fetcher.getTV(this.currentCountry, this.currentGenre, search);
        } else if (this.currentTab === 'radio-fav') {
          let favs = this.favStore.getRadioFavs();
          if (search) favs = favs.filter(s => s.name.toLowerCase().includes(search.toLowerCase()));
          this.stations = favs;
        } else if (this.currentTab === 'tv-fav') {
          let favs = this.favStore.getTvFavs();
          if (search) favs = favs.filter(s => s.name.toLowerCase().includes(search.toLowerCase()));
          this.stations = favs;
        }

        this.count.textContent = `${this.stations.length} flux disponibles`;
        this.renderGrid();
      }

      renderGrid() {
        if (!this.stations.length) {
          this.grid.innerHTML = '<div class="loader-container"><p>Aucun flux disponible pour cette sélection.</p></div>';
          return;
        }

        this.grid.innerHTML = this.stations.map((s, i) => {
          const isFav = this.favStore.isFav(s.id, s.type);
          const isPlaying = this.activeStationIndex === i;
          return `
            <div class="station-card ${isPlaying ? 'is-playing' : ''}">
              <button class="card-fs-btn" onclick="event.stopPropagation(); app.playStationInFullscreen(${i});" title="Lancer en plein écran">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
              </button>
              <button class="card-fav-btn ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); app.toggleStationFav(${i});" title="Favori">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
              <div class="card-thumb-wrapper" onclick="app.playStation(${i})">
                ${s.logo ? `<img src="${s.logo}" onerror="this.style.display='none'">` : `<span style="font-weight:700;">${s.name.charAt(0)}</span>`}
              </div>
              <div onclick="app.playStation(${i})">
                <div style="font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</div>
                <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">${s.tags || s.country}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      toggleStationFav(index) {
        const s = this.stations[index];
        if (!s) return;
        this.favStore.toggle(s);
        this.updateFavBadges();
        this.updateFavButtonsUI();
        this.renderGrid();
      }

      playStation(index) {
        const s = this.stations[index];
        if (!s) return;
        this.activeStationIndex = index;
        this.theater.classList.add('active');

        document.getElementById('player-title').textContent = s.name;
        document.getElementById('player-subtitle').textContent = s.tags || s.country;
        document.getElementById('stage-title').textContent = s.name;

        if (this.hls) {
          this.hls.destroy();
          this.hls = null;
        }

        if (s.type === 'video' || s.type === 'tv') {
          this.audioOverlay.style.display = 'none';
          this.media.style.display = 'block';
          this.visualizer.stop();

          if (s.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
            this.hls = new Hls();
            this.hls.loadSource(s.url);
            this.hls.attachMedia(this.media);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => this.media.play());
          } else {
            this.media.src = s.url;
            this.media.play();
          }
        } else {
          this.media.style.display = 'none';
          this.audioOverlay.style.display = 'flex';
          this.visualizer.setPreset(document.getElementById('anim-preset-select').value);
          this.media.src = s.url;
          this.media.play().catch(() => {});
        }

        this.updateFavButtonsUI();
        this.renderGrid();
      }

      playStationInFullscreen(index) {
        this.playStation(index);
        if (!document.fullscreenElement) {
          this.theater.requestFullscreen().catch(err => console.warn(err));
        }
      }

      playAdjacentStation(direction) {
        if (!this.stations.length) return;
        let nextIndex = this.activeStationIndex + direction;
        if (nextIndex < 0) nextIndex = this.stations.length - 1;
        if (nextIndex >= this.stations.length) nextIndex = 0;
        this.playStation(nextIndex);
      }

      updateFavBadges() {
        document.getElementById('fav-radio-badge').textContent = this.favStore.getRadioFavs().length;
        document.getElementById('fav-tv-badge').textContent = this.favStore.getTvFavs().length;
      }

      updateFavButtonsUI() {
        if (this.activeStationIndex < 0 || !this.stations[this.activeStationIndex]) return;
        const s = this.stations[this.activeStationIndex];
        const isFav = this.favStore.isFav(s.id, s.type);

        const btnStage = document.getElementById('btn-stage-fav');
        const iconStage = document.getElementById('icon-stage-fav');
        const btnPlayer = document.getElementById('btn-player-fav');
        const iconPlayer = document.getElementById('icon-player-fav');

        if (isFav) {
          iconStage.style.fill = '#ef4444'; iconStage.style.stroke = '#ef4444';
          iconPlayer.style.fill = '#ef4444'; iconPlayer.style.stroke = '#ef4444';
        } else {
          iconStage.style.fill = 'none'; iconStage.style.stroke = 'currentColor';
          iconPlayer.style.fill = 'none'; iconPlayer.style.stroke = 'currentColor';
        }
      }

      showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }
    }

    window.onload = () => { window.app = new AppController(); };
  </script>
</body>
</html>
