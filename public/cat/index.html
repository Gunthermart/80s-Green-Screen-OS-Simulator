<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐈 Cat Life Simulator</title>
<style>
:root{
  --bg:#12121c; --panel:#1c1c2b; --accent:#7c4dff; --text:#eceff1;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
#app{max-width:1200px;margin:0 auto;padding:16px;}
header h1{text-align:center;margin:.2em 0;font-size:22px;}
header p{text-align:center;color:#999;margin-top:0;font-size:13px;}
main{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
#canvas-wrap{position:relative;border:3px solid #2c2c3d;border-radius:10px;overflow:hidden;box-shadow:0 0 25px rgba(0,0,0,.5);transition:box-shadow .3s;}
#canvas-wrap.vision-active{box-shadow:0 0 30px #00e5ff;}
canvas{display:block;background:#000;}
#overlay-info{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#fff;text-shadow:0 0 4px #000;pointer-events:none;}
#overlay-info label{pointer-events:all;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;gap:5px;align-items:center;}
#sidebar{width:340px;display:flex;flex-direction:column;gap:14px;}
section{background:var(--panel);border-radius:10px;padding:12px 14px;}
section h2{margin:0 0 10px;font-size:15px;color:var(--accent);border-bottom:1px solid #333;padding-bottom:6px;}
.gauge{margin-bottom:8px;font-size:12px;}
.gauge label{display:block;margin-bottom:3px;}
.bar{background:#333;border-radius:6px;height:10px;overflow:hidden;}
.fill{height:100%;width:50%;background:#43a047;transition:width .3s, background .3s;}
.info-row{font-size:12.5px;margin:4px 0;display:flex;justify-content:space-between;color:#cfd8dc;}
#actions{display:flex;flex-direction:column;gap:8px;}
#actions button{background:#2b2b40;color:#fff;border:1px solid #444;border-radius:6px;padding:9px;cursor:pointer;font-size:13px;transition:background .2s;}
#actions button:hover{background:var(--accent);}
#actions button.danger{border-color:#7a1f1f;}
#actions button.danger:hover{background:#c62828;}
#log{flex:1;max-height:280px;display:flex;flex-direction:column;}
#logContent{overflow-y:auto;max-height:220px;font-size:12px;display:flex;flex-direction:column;gap:4px;padding-right:4px;}
.log-entry{border-left:2px solid var(--accent);padding-left:6px;line-height:1.35;}
.log-time{color:#888;margin-right:4px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐈 Cat Life Simulator</h1>
    <p>Simulation comportementale féline — instincts, chaos et carton inclus.</p>
  </header>
  <main>
    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
      <div id="overlay-info">
        <span id="clock">--:--</span>
        <span id="stateLabel">État: ...</span>
        <label class="vision-toggle">
          <input type="checkbox" id="visionToggle"> 👁 Vision Féline
        </label>
      </div>
    </div>
    <aside id="sidebar">
      <section id="stats">
        <h2>📊 État du chat</h2>
        <div class="gauge" data-key="hunger"><label>🍖 Satiété</label><div class="bar"><div class="fill"></div></div></div>
        <div class="gauge" data-key="energy"><label>⚡ Énergie</label><div class="bar"><div class="fill"></div></div></div>
        <div class="gauge" data-key="cleanliness"><label>🧼 Propreté</label><div class="bar"><div class="fill"></div></div></div>
        <div class="gauge" data-key="stimulation"><label>🎯 Stimulation</label><div class="bar"><div class="fill"></div></div></div>
        <div class="gauge" data-key="affection"><label>❤️ Affection</label><div class="bar"><div class="fill"></div></div></div>
        <div class="info-row"><span>Obstination</span><span id="obstinacyValue">--</span></div>
        <div class="info-row"><span>Humeur</span><span id="moodValue">--</span></div>
        <div class="info-row"><span>Tempérament</span><span id="tempValue">--</span></div>
      </section>
      <section id="actions">
        <h2>🎮 Interactions</h2>
        <button id="btnFeed">🥣 Poser des croquettes</button>
        <button id="btnToy">🪶 Agiter le plumet</button>
        <button id="btnLitter">🧹 Nettoyer la litière</button>
        <button id="btnNewObject">📦 Poser un nouvel objet</button>
        <button id="btnPet">✋ Caresser</button>
        <button id="btnCall">📣 Appeler le chat</button>
        <button id="btnVacuum" class="danger">🌀 Sortir l'aspirateur</button>
      </section>
      <section id="log">
        <h2>💭 Pensées du chat</h2>
        <div id="logContent"></div>
      </section>
    </aside>
  </main>
</div>

<script>
'use strict';

/* ============================================================
   UTILITAIRES
   ============================================================ */
const CANVAS_W = 800;
const CANVAS_H = 500;
const FLOOR_Y = 440;
const DAY_LENGTH_SECONDS = 240; // 1 jour de jeu = 4 minutes réelles

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const chance = (p) => Math.random() < p;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

/* ============================================================
   ZONE — gestion du relief / de la verticalité
   ============================================================ */
class Zone {
  constructor(name, x, y, w, h, level, options = {}) {
    this.name = name;
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.level = level; // 0=Sol, 1=Canapé, 2=Arbre à chat, 3=Haut du frigo
    this.color = options.color || '#8d6e63';
  }
  get centerX() { return this.x + this.w / 2; }
  get surfaceY() { return this.y; }
}

/* ============================================================
   OBJET INTERACTIF
   ============================================================ */
let OBJ_ID = 0;
class InteractiveObject {
  constructor(type, x, y, opts = {}) {
    this.id = ++OBJ_ID;
    this.type = type; // food, litter, toy, box, newobj, string, vacuum, trinket
    this.x = x; this.y = y;
    this.width = opts.width ?? 30;
    this.height = opts.height ?? 20;
    this.attraction = opts.attraction ?? 10;
    this.anxiogenic = opts.anxiogenic ?? false;
    this.insignificant = opts.insignificant ?? false; // brille en Vision Féline
    this.label = opts.label || type;
    this.falling = false;
    this.vy = 0;
    this.parent = null; // meuble d'origine (pour le Gravity Test)
  }

  update(dt) {
    if (this.falling) {
      this.vy += 900 * dt;
      this.y += this.vy * dt;
    }
  }

  draw(ctx, visionMode) {
    ctx.save();
    ctx.translate(this.x, this.y);
    switch (this.type) {
      case 'food':
        ctx.fillStyle = '#9e9e9e';
        ctx.beginPath(); ctx.ellipse(0, 0, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6d4c41';
        ctx.beginPath(); ctx.ellipse(0, -2, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'litter':
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-25, -10, 50, 20);
        ctx.strokeStyle = '#90a4ae'; ctx.strokeRect(-25, -10, 50, 20);
        break;
      case 'toy': // plumet
        ctx.strokeStyle = '#795548'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -40); ctx.stroke();
        ctx.fillStyle = '#e53935';
        ctx.beginPath(); ctx.ellipse(0, -45, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'box':
        ctx.fillStyle = '#a1887f'; ctx.fillRect(-20, -20, 40, 40);
        ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2; ctx.strokeRect(-20, -20, 40, 40);
        ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(20, 20);
        ctx.moveTo(20, -20); ctx.lineTo(-20, 20); ctx.stroke();
        break;
      case 'vacuum':
        ctx.fillStyle = '#37474f'; ctx.fillRect(-15, -30, 30, 30);
        ctx.fillStyle = '#263238';
        ctx.beginPath(); ctx.ellipse(0, 2, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'string':
        ctx.strokeStyle = visionMode ? '#00e5ff' : '#cfd8dc';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-15, 0); ctx.quadraticCurveTo(0, -15, 15, 0); ctx.stroke();
        break;
      case 'newobj':
        ctx.fillStyle = '#ffb300';
        ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
        break;
      case 'trinket':
        ctx.fillStyle = '#ba68c8';
        ctx.beginPath(); ctx.ellipse(0, 0, 9, 14, 0, 0, Math.PI * 2); ctx.fill();
        break;
      default:
        ctx.fillStyle = '#888'; ctx.fillRect(-10, -10, 20, 20);
    }
    if (visionMode && this.insignificant) {
      ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20;
      ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 1;
      ctx.strokeRect(-this.width / 2 - 4, -this.height / 2 - 4, this.width + 8, this.height + 8);
    }
    ctx.restore();
  }
}

/* ============================================================
   MÉMOIRE — conditionnement & zones anxiogènes
   ============================================================ */
class Memory {
  constructor() {
    this.associations = new Map();   // stimulus -> {valence, intensity, timestamp}
    this.anxiousZones = new Map();   // zoneName -> heure d'expiration (temps de jeu)
    this.lastMarking = new Map();    // meuble -> heure du dernier marquage
  }
  associate(key, valence, intensity = 1) {
    const e = this.associations.get(key);
    if (e) {
      e.valence = clamp(e.valence * 0.5 + valence * 0.5, -1, 1);
      e.intensity = clamp(e.intensity + intensity, 0, 5);
      e.timestamp = performance.now();
    } else {
      this.associations.set(key, { valence, intensity, timestamp: performance.now() });
    }
  }
  recall(key) {
    const e = this.associations.get(key);
    if (!e) return 0;
    const ageSec = (performance.now() - e.timestamp) / 1000;
    const decay = Math.exp(-ageSec / 60);
    return e.valence * e.intensity * decay;
  }
  markZoneAnxious(zoneName, gameTime, durationHours = 5) {
    this.anxiousZones.set(zoneName, gameTime + durationHours);
  }
  isZoneAnxious(zoneName, gameTime) {
    const exp = this.anxiousZones.get(zoneName);
    return exp !== undefined && gameTime < exp;
  }
  markTerritory(name, gameTime) { this.lastMarking.set(name, gameTime); }
  timeSinceMarking(name, gameTime) {
    const t = this.lastMarking.get(name);
    return t === undefined ? 999 : gameTime - t;
  }
}

/* ============================================================
   BRAIN — Utility AI (choix comportemental)
   ============================================================ */
class Brain {
  constructor(cat) { this.cat = cat; }

  evaluate(env) {
    const c = this.cat;
    const scores = {
      EAT: (100 - c.stats.hunger) * 1.2 + c.memory.recall('bruit_croquettes') * 8,
      SLEEP: (100 - c.stats.energy) * 1.0,
      GROOM: (100 - c.stats.cleanliness) * 0.8,
      PLAY: (100 - c.stats.stimulation) * 0.9,
      SEEK_AFFECTION: (100 - c.stats.affection) * 0.6,
      SEEK_WARMTH: env.isDaytime() ? 25 : 5,
      MARK: this.computeStress(env) * 0.7,
      IDLE: 6
    };
    // Le Gravity Test : une pulsion absurde et rare, indépendante des besoins
    if (chance(0.012)) scores.GRAVITY_TEST = 250;

    let best = 'IDLE', bestScore = -Infinity;
    for (const k in scores) {
      const v = scores[k] + rand(-6, 6); // petite touche de caractère imprévisible
      if (v > bestScore) { bestScore = v; best = k; }
    }
    return best;
  }

  computeStress(env) {
    const c = this.cat;
    let stress = (100 - c.stats.cleanliness) * 0.2;
    let minTime = Infinity;
    env.furniture.forEach(f => {
      const t = c.memory.timeSinceMarking(f.name, env.gameTime);
      if (t < minTime) minTime = t;
    });
    if (minTime > 8) stress += 25; // absence de marquage récent = stress
    return clamp(stress, 0, 100);
  }
}

/* ============================================================
   CAT — FSM comportementale + physiologie
   ============================================================ */
class Cat {
  constructor(env, name) {
    this.env = env;
    this.name = name;
    this.x = 400; this.y = FLOOR_Y;
    this.targetX = this.x; this.targetY = this.y;
    this.speed = 70;
    this.facing = 1;
    this.state = 'IDLE';
    this.stateTimer = rand(1, 3);
    this.pendingAction = null;
    this.currentZone = env.zones[0];

    this.stats = { hunger: 70, energy: 75, cleanliness: 85, stimulation: 55, affection: 60 };
    this.temperament = ['calme', 'joueur', 'grincheux', 'curieux'][randInt(0, 3)];
    this.obstinacy = this.temperament === 'grincheux' ? rand(60, 90)
                    : this.temperament === 'calme'    ? rand(10, 30)
                    : rand(30, 60);

    this.memory = new Memory();
    this.brain = new Brain(this);
    this.mood = 'neutre';

    this.zoomies = false;
    this.zoomiesInterval = null;
    this.purring = false;
    this.purrEffects = [];
    this.log = null;
  }

  say(msg) { if (this.log) this.log(msg); }
  distanceTo(o) { return dist(this.x, this.y, o.x, o.y); }

  /* ---------- BOUCLE PRINCIPALE DU CHAT ---------- */
  update(dt, env) {
    if (!this.zoomies) {
      this.stats.hunger = clamp(this.stats.hunger - dt * 0.6, 0, 100);
      this.stats.cleanliness = clamp(this.stats.cleanliness - dt * 0.3, 0, 100);
      this.stats.stimulation = clamp(this.stats.stimulation - dt * 0.5, 0, 100);
      this.stats.affection = clamp(this.stats.affection - dt * 0.25, 0, 100);
      this.stats.energy = clamp(this.stats.energy - (this.state === 'SLEEP' ? -dt * 10 : dt * 0.4), 0, 100);
    }
    this.updateMood();
    this.moveTowardTarget(dt);
    this.handleStateTimers(dt);

    this.stateTimer -= dt;
    if (this.state === 'IDLE' && this.stateTimer <= 0 && !this.zoomies) {
      this.decide(env);
    }

    this.purrEffects.forEach(e => e.r += dt * 70);
    this.purrEffects = this.purrEffects.filter(e => e.r < 130);
  }

  updateMood() {
    const s = this.stats;
    const avg = (s.hunger + s.energy + s.cleanliness + s.affection + (100 - Math.abs(s.stimulation - 65))) / 5;
    if (avg > 82) this.mood = 'ravi';
    else if (avg > 63) this.mood = 'content';
    else if (avg > 42) this.mood = 'neutre';
    else if (avg > 22) this.mood = 'grognon';
    else this.mood = 'misérable';
  }

  moveTowardTarget(dt) {
    const mult = this.zoomies ? 2.6 : 1;
    const dx = this.targetX - this.x, dy = this.targetY - this.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const step = this.speed * mult * dt;
      const r = Math.min(step, d) / d;
      this.x += dx * r; this.y += dy * r;
      this.facing = dx >= 0 ? 1 : -1;
    } else if (this.state === 'MOVING') {
      this.state = 'IDLE'; this.stateTimer = 0;
      this.onArrive();
    }
  }

  handleStateTimers(dt) {
    if (this.state === 'GROOM') this.stats.cleanliness = clamp(this.stats.cleanliness + dt * 18, 0, 100);
    if (this.state === 'SLEEP') this.stats.energy = clamp(this.stats.energy + dt * 12, 0, 100);
    if (['EAT','SLEEP','GROOM','MARK','BASK','PLAY','GRAVITY_TEST','FLEE','BITE'].includes(this.state)) {
      if (this.stateTimer <= 0) { this.state = 'IDLE'; this.stateTimer = rand(1, 3); }
    }
  }

  goTo(x, y) { this.targetX = x; this.targetY = y; this.state = 'MOVING'; }

  wander() {
    let x = clamp(this.x + rand(-120, 120), 20, CANVAS_W - 20);
    let tries = 0;
    while (this.memory.isZoneAnxious(this.env.zoneAt(x, FLOOR_Y).name, this.env.gameTime) && tries < 4) {
      x = clamp(this.x + rand(-120, 120), 20, CANVAS_W - 20); tries++;
    }
    this.pendingAction = null;
    this.goTo(x, FLOOR_Y);
    this.stateTimer = rand(2, 4);
  }

  /* ---------- DÉCISION (appelle Brain, choisit une cible concrète) ---------- */
  decide(env) {
    const action = this.brain.evaluate(env);
    switch (action) {
      case 'EAT': {
        const food = env.objects.find(o => o.type === 'food');
        if (food) { this.goTo(food.x, food.y); this.pendingAction = 'EAT'; this.say('Gamelle en vue. Toute affaire cessante.'); }
        else { this.wander(); this.say('Pas de nourriture visible. C\'est une trahison.'); }
        break;
      }
      case 'SLEEP': {
        const spot = this.chooseRestSpot(env);
        this.goTo(spot.x, spot.y); this.pendingAction = 'SLEEP';
        this.say('Batteries faibles. Je vais m\'éteindre quelques heures.');
        break;
      }
      case 'GROOM':
        this.pendingAction = null; this.state = 'GROOM'; this.stateTimer = rand(3, 6);
        this.say('Toilette. L\'hygiène est non-négociable, contrairement à vos règles.');
        break;
      case 'PLAY': {
        const toy = this.chooseToy(env);
        if (toy) { this.goTo(toy.x, toy.y); this.pendingAction = 'PLAY_' + toy.id; this.say(this.thoughtForToy(toy)); }
        else this.wander();
        break;
      }
      case 'SEEK_AFFECTION':
        this.wander();
        this.say('Je rôde stratégiquement près de mon humain. Ça compte comme de l\'affection.');
        break;
      case 'MARK': {
        const list = env.furniture;
        const target = list[randInt(0, list.length - 1)];
        this.goTo(target.centerX, target.surfaceY); this.pendingAction = 'MARK_' + target.name;
        this.say(`Le ${target.name} manque cruellement de mon odeur. J'y remédie.`);
        break;
      }
      case 'SEEK_WARMTH': {
        const sun = env.getSunSpot();
        if (sun) { this.goTo(sun.x, FLOOR_Y); this.pendingAction = 'BASK'; this.say('Un rayon de soleil. Rendez-vous obligatoire.'); }
        else this.wander();
        break;
      }
      case 'GRAVITY_TEST': {
        const furn = env.furniture.filter(f => f.level > 0);
        if (furn.length) {
          const target = furn[randInt(0, furn.length - 1)];
          let trinket = env.objects.find(o => o.type === 'trinket' && o.parent === target.id);
          if (!trinket) {
            trinket = env.addObject(new InteractiveObject('trinket', target.centerX, target.surfaceY - 15, { label: 'Bibelot' }));
            trinket.parent = target.id;
          }
          this.goTo(target.centerX, target.surfaceY);
          this.pendingAction = 'GRAVITY_' + trinket.id;
          this.say('Un objet en hauteur existe sans ma permission. Ça va se régler.');
        } else this.wander();
        break;
      }
      default:
        this.wander();
    }
  }

  onArrive() {
    if (!this.pendingAction) { this.stateTimer = rand(1, 3); return; }
    const action = this.pendingAction; this.pendingAction = null;
    if (action === 'EAT') this.performEat();
    else if (action === 'SLEEP') { this.state = 'SLEEP'; this.stateTimer = rand(6, 12); this.currentZone = this.env.zoneAt(this.x, this.y); }
    else if (action === 'BASK') { this.state = 'BASK'; this.stateTimer = rand(5, 10); this.stats.affection = clamp(this.stats.affection + 2, 0, 100); this.checkPurr(); }
    else if (action.startsWith('PLAY_')) this.performPlay(action.slice(5));
    else if (action.startsWith('MARK_')) this.performMark(action.slice(5));
    else if (action.startsWith('GRAVITY_')) this.performGravityTest(action.slice(8));
  }

  performEat() {
    this.stats.hunger = clamp(this.stats.hunger + 45, 0, 100);
    this.state = 'EAT'; this.stateTimer = 2;
    this.say('Croquettes englouties. Satisfaction garantie dix minutes.');
  }

  /* --- Paradoxe du Carton : priorité absolue au carton --- */
  chooseToy(env) {
    const toys = env.objects.filter(o => ['toy', 'box', 'newobj', 'string'].includes(o.type));
    if (!toys.length) return null;
    const box = toys.find(o => o.type === 'box');
    if (box) return box;
    toys.sort((a, b) => (b.attraction - this.distanceTo(b) * 0.1) - (a.attraction - this.distanceTo(a) * 0.1));
    return toys[0];
  }

  thoughtForToy(toy) {
    if (toy.type === 'box') return 'LE CARTON. Le jouet à côté ? Jamais entendu parler.';
    if (toy.type === 'toy') return 'Ce plumet insulte mon instinct de prédateur. Je dois riposter.';
    if (toy.type === 'string') return 'Un fil. Une proie. Aucune négociation possible.';
    return 'Objet non identifié. Investigation en cours.';
  }

  performPlay(idStr) {
    const toy = this.env.objects.find(o => String(o.id) === idStr);
    this.state = 'PLAY'; this.stateTimer = rand(3, 6);
    this.stats.stimulation = clamp(this.stats.stimulation + rand(15, 30), 0, 100);
    this.stats.energy = clamp(this.stats.energy - 5, 0, 100);
    if (toy && toy.type === 'box') this.say('Je suis dans la boîte. Je suis invisible. Ne me cherchez pas.');
  }

  performMark(name) {
    this.state = 'MARK'; this.stateTimer = 2;
    this.memory.markTerritory(name, this.env.gameTime);
    this.stats.affection = clamp(this.stats.affection + 3, 0, 100);
    this.say(`${name} porte officiellement mon odeur. Territoire sécurisé.`);
  }

  /* --- Gravity Test --- */
  performGravityTest(idStr) {
    const target = this.env.objects.find(o => String(o.id) === idStr);
    this.state = 'GRAVITY_TEST'; this.stateTimer = 2;
    this.say('Contact visuel établi avec l\'humain. Patte levée. Aucun remords à venir.');
    if (target) {
      setTimeout(() => {
        target.falling = true;
        this.say(`${target.label} s'écrase au sol dans un silence gênant. Test de gravité validé.`);
      }, 900);
    }
  }

  chooseRestSpot(env) {
    let candidates = env.zones.filter(z => !this.memory.isZoneAnxious(z.name, env.gameTime));
    if (!candidates.length) candidates = env.zones;
    candidates = [...candidates].sort((a, b) => b.level - a.level); // préférence pour la hauteur
    const chosen = candidates[0];
    return { x: chosen.centerX, y: chosen.surfaceY, level: chosen.level };
  }

  /* --- Ronronnement (bien-être maximal) --- */
  checkPurr() {
    const s = this.stats;
    const wellbeing = (s.hunger + s.energy + s.cleanliness + s.affection) / 4;
    if (wellbeing > 85 && s.stimulation < 85) this.purr();
  }
  purr() {
    if (this.purring) return;
    this.purring = true;
    this.purrEffects.push({ r: 0, x: this.x, y: this.y });
    AudioEngine.playPurr();
    this.say('Ronronnement enclenché. Bien-être maximal atteint. Ne bougez plus.');
    setTimeout(() => { this.purring = false; }, 4000);
  }

  /* --- Fuite (stimulus anxiogène) --- */
  fleeFrom(x) {
    if (this.zoomies) return;
    this.pendingAction = null;
    this.state = 'FLEE'; this.stateTimer = 3;
    const dir = this.x < x ? -1 : 1;
    this.goTo(clamp(this.x + dir * 220, 20, CANVAS_W - 20), this.y);
    this.state = 'FLEE';
    this.stats.stimulation = clamp(this.stats.stimulation + 10, 0, 100);
    this.say('DANGER. Fuite immédiate. Les questions viendront plus tard.');
  }

  /* --- Quart d'heure de folie --- */
  startZoomies() {
    if (this.zoomies) return;
    this.zoomies = true;
    this.pendingAction = null;
    this.state = 'PLAY';
    this.say('03h00. Quart d\'heure de folie activé. Que tout le monde se mette à l\'abri.');
    this.zoomiesInterval = setInterval(() => {
      this.goTo(rand(20, CANVAS_W - 20), FLOOR_Y);
    }, 450);
    setTimeout(() => this.stopZoomies(), 9000);
  }
  stopZoomies() {
    this.zoomies = false;
    clearInterval(this.zoomiesInterval);
    this.state = 'IDLE'; this.stateTimer = rand(2, 4);
    this.say('Crise terminée. Comme si de rien n\'était.');
  }

  /* ---------- RÉACTIONS AUX COMMANDES UTILISATEUR (avec Obstination) ---------- */
  reactToUserAction(action) {
    const ignoreP = action === 'FEED' ? this.obstinacy / 500 : this.obstinacy / 110;
    if (chance(ignoreP)) {
      this.say(`Requête "${action}" reçue et royalement ignorée. (Obstination ${Math.round(this.obstinacy)}%)`);
      return false;
    }
    switch (action) {
      case 'FEED': this.userFeed(); break;
      case 'TOY': this.userToy(); break;
      case 'LITTER': this.userLitter(); break;
      case 'PET': this.userPet(); break;
      case 'CALL': this.userCall(); break;
    }
    return true;
  }

  userFeed() {
    this.stats.hunger = clamp(this.stats.hunger + 50, 0, 100);
    this.memory.associate('bruit_croquettes', 1, 3); // conditionnement
    this.say('Le sachet a craqué. Sprint immédiat vers la gamelle mental effectué.');
  }
  userToy() {
    this.pendingAction = null;
    this.stats.stimulation = clamp(this.stats.stimulation + 25, 0, 100);
    this.stats.energy = clamp(this.stats.energy - 8, 0, 100);
    this.state = 'PLAY'; this.stateTimer = 3;
    this.goTo(clamp(this.x + rand(-50, 50), 20, CANVAS_W - 20), FLOOR_Y);
    this.say('Le plumet bouge. Mission de chasse activée. C\'est inscrit dans mes gènes.');
  }
  userLitter() {
    this.stats.cleanliness = clamp(this.stats.cleanliness + 40, 0, 100);
    this.say('Litière nettoyée. Un miracle olfactif vient de se produire.');
  }
  userPet() {
    // Overdose sensorielle si la stimulation est saturée
    if (this.stats.stimulation > 88) {
      this.stats.affection = clamp(this.stats.affection - 6, 0, 100);
      this.stats.stimulation = clamp(this.stats.stimulation - 25, 0, 100);
      this.state = 'BITE'; this.stateTimer = 1.5;
      this.say('SURCHARGE SENSORIELLE. Morsure défensive. Ce n\'était pas contre vous. (un peu si)');
      return;
    }
    const successRate = clamp(0.85 - this.stats.stimulation / 200 - this.obstinacy / 300, 0.15, 0.95);
    if (chance(successRate)) {
      this.stats.affection = clamp(this.stats.affection + 15, 0, 100);
      this.say('Caresse tolérée avec grâce. Comportement exemplaire de l\'humain.');
      this.checkPurr();
    } else {
      this.pendingAction = null;
      this.goTo(clamp(this.x + rand(-70, 70), 20, CANVAS_W - 20), this.y);
      this.say('Caresse refusée. Je me dérobe avec une dignité princière.');
    }
  }
  userCall() {
    if (chance(1 - this.obstinacy / 100)) {
      this.pendingAction = null;
      this.goTo(this.env.userCallX, FLOOR_Y);
      this.say('J\'arrive. Mais uniquement parce que j\'en ai envie, pas parce qu\'on m\'appelle.');
    } else {
      this.say('Appel entendu. Superbement ignoré. Retour à mes occupations.');
    }
  }

  stateEmoji() {
    const map = { IDLE:'…', MOVING:'🚶', EAT:'🍽️', SLEEP:'😴', GROOM:'🧼', MARK:'👃',
                  BASK:'☀️', PLAY:'🐾', GRAVITY_TEST:'😈', FLEE:'💨', BITE:'😾' };
    return map[this.state] || '';
  }

  /* ---------- RENDU ---------- */
  render(ctx, visionMode) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(this.x, FLOOR_Y + 8, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Ondes de ronronnement
    this.purrEffects.forEach(e => {
      ctx.save();
      ctx.strokeStyle = `rgba(255,193,7,${Math.max(0, 1 - e.r / 130)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.facing, 1);

    let bodyColor = this.mood === 'ravi' ? '#8d6e63' : this.mood === 'misérable' ? '#4e342e' : '#6d4c41';
    if (this.state === 'BITE') bodyColor = '#b71c1c';
    if (this.zoomies) bodyColor = '#ff6f00';
    if (visionMode) bodyColor = '#0d3b4f';

    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0, -10, 20, 12, 0, 0, Math.PI * 2); ctx.fill(); // corps
    ctx.beginPath(); ctx.arc(18, -20, 10, 0, Math.PI * 2); ctx.fill();          // tête
    ctx.beginPath(); ctx.moveTo(12, -28); ctx.lineTo(15, -39); ctx.lineTo(20, -29); ctx.closePath(); ctx.fill(); // oreille
    ctx.beginPath(); ctx.moveTo(21, -29); ctx.lineTo(25, -40); ctx.lineTo(28, -28); ctx.closePath(); ctx.fill(); // oreille

    ctx.strokeStyle = bodyColor; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const tailWag = Math.sin(Date.now() / 180) * 6;
    ctx.beginPath(); ctx.moveTo(-18, -12); ctx.quadraticCurveTo(-36, -22 + tailWag, -30, 0); ctx.stroke(); // queue

    ctx.fillStyle = visionMode ? '#00e676' : '#1b1b1b';
    if (visionMode) { ctx.shadowColor = '#00e676'; ctx.shadowBlur = 12; }
    ctx.beginPath(); ctx.arc(22, -22, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(this.stateEmoji(), this.x, this.y - 52);
    ctx.restore();
  }
}

/* ============================================================
   ENVIRONMENT — décor, temps, soleil
   ============================================================ */
class Environment {
  constructor() {
    this.gameTime = 8; // heure de départ

    this.zones = [
      new Zone('Sol', 0, FLOOR_Y, CANVAS_W, 8, 0, { color: '#4e342e' }),
      new Zone('Canapé', 480, 360, 160, 20, 1, { color: '#8d6e63' }),
      new Zone('Arbre à chat', 630, 210, 90, 15, 2, { color: '#6d4c41' }),
      new Zone('Haut du frigo', 40, 140, 110, 15, 3, { color: '#b0bec5' }),
    ];

    this.furniture = [
      { id: 'sofa',  name: 'Canapé',       centerX: 560, surfaceY: 360, level: 1 },
      { id: 'tree',  name: 'Arbre à chat', centerX: 675, surfaceY: 210, level: 2 },
      { id: 'fridge',name: 'Frigo',        centerX: 95,  surfaceY: 140, level: 3 },
      { id: 'table', name: 'Pied de table',centerX: 300, surfaceY: FLOOR_Y, level: 0 },
    ];

    this.objects = [];
    this.userCallX = 380;
    this.addObject(new InteractiveObject('food', 230, FLOOR_Y, { attraction: 80, label: 'Gamelle' }));
    this.addObject(new InteractiveObject('litter', 130, FLOOR_Y, { attraction: 5, label: 'Litière' }));
    this.addObject(new InteractiveObject('string', 560, FLOOR_Y, { attraction: 15, insignificant: true, label: 'Fil à coudre' }));
  }

  addObject(o) { this.objects.push(o); return o; }
  removeObject(o) { this.objects = this.objects.filter(x => x !== o); }

  zoneAt(x, y) {
    let best = this.zones[0], bd = Infinity;
    this.zones.forEach(z => {
      if (x >= z.x && x <= z.x + z.w) {
        const d = Math.abs(y - z.y);
        if (d < bd) { bd = d; best = z; }
      }
    });
    return best;
  }

  update(dt) {
    this.gameTime += dt * (24 / DAY_LENGTH_SECONDS);
    if (this.gameTime >= 24) this.gameTime -= 24;
    this.objects.forEach(o => o.update(dt));
    this.objects = this.objects.filter(o => !(o.falling && o.y > FLOOR_Y + 60));
  }

  isDaytime() { return this.gameTime >= 6.5 && this.gameTime <= 19; }

  getSunSpot() {
    if (!this.isDaytime()) return null;
    const p = (this.gameTime - 6.5) / 12.5; // progression 0..1
    return { x: 100 + p * (CANVAS_W - 200), y: FLOOR_Y };
  }

  formattedTime() {
    const h = Math.floor(this.gameTime), m = Math.floor((this.gameTime - h) * 60);
    return `${String(h).padStart(2, '0')}h${String(m).padStart(2, '0')}`;
  }

  render(ctx, visionMode) {
    ctx.fillStyle = visionMode ? '#00131c' : (this.isDaytime() ? '#cfe8f5' : '#131327');
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    const sun = this.getSunSpot();
    if (sun && !visionMode) {
      const g = ctx.createRadialGradient(sun.x, sun.y - 8, 5, sun.x, sun.y - 8, 90);
      g.addColorStop(0, 'rgba(255,235,130,0.55)');
      g.addColorStop(1, 'rgba(255,235,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(sun.x, sun.y - 4, 95, 32, 0, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = visionMode ? '#04202b' : '#3e2723';
    ctx.fillRect(0, FLOOR_Y + 6, CANVAS_W, CANVAS_H - FLOOR_Y - 6);

    this.zones.filter(z => z.level > 0).forEach(z => {
      ctx.fillStyle = visionMode ? '#0d3345' : z.color;
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.strokeRect(z.x, z.y, z.w, z.h);
      ctx.fillRect(z.x + z.w / 2 - 4, z.y + z.h, 8, FLOOR_Y - (z.y + z.h)); // pied du meuble
      ctx.fillStyle = '#e0e0e0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(z.name, z.x + z.w / 2, z.y - 6);
    });

    this.objects.forEach(o => o.draw(ctx, visionMode));
  }
}

/* ============================================================
   AUDIO ENGINE — Web Audio API (ronronnement)
   ============================================================ */
const AudioEngine = {
  ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  playPurr() {
    this.init();
    const ctx = this.ctx;
    const duration = 3.5;
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 25;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 22; // fréquence typique du ronronnement
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.5;
    const gain = ctx.createGain(); gain.gain.value = 0.0001;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.4);
    gain.gain.linearRampToValueAtTime(0.0001, now + duration);
    osc.start(now); lfo.start(now);
    osc.stop(now + duration); lfo.stop(now + duration);
  }
};

/* ============================================================
   UI — Pont DOM / Jeu
   ============================================================ */
class UI {
  constructor(game) {
    this.game = game;
    this.logEl = document.getElementById('logContent');
    this.clockEl = document.getElementById('clock');
    this.stateEl = document.getElementById('stateLabel');
    this.gauges = {};
    ['hunger','energy','cleanliness','stimulation','affection'].forEach(k => {
      this.gauges[k] = document.querySelector(`.gauge[data-key="${k}"] .fill`);
    });
    this.obstinacyEl = document.getElementById('obstinacyValue');
    this.moodEl = document.getElementById('moodValue');
    this.tempEl = document.getElementById('tempValue');
    this.bindButtons();
  }

  bindButtons() {
    document.getElementById('btnFeed').onclick = () => this.game.userAction('FEED');
    document.getElementById('btnToy').onclick = () => this.game.userAction('TOY');
    document.getElementById('btnLitter').onclick = () => this.game.userAction('LITTER');
    document.getElementById('btnPet').onclick = () => this.game.userAction('PET');
    document.getElementById('btnCall').onclick = () => this.game.userAction('CALL');
    document.getElementById('btnNewObject').onclick = () => this.game.spawnNewObjectWithBox();
    document.getElementById('btnVacuum').onclick = () => this.game.triggerVacuum();
    document.getElementById('visionToggle').onchange = (e) => {
      this.game.visionMode = e.target.checked;
      document.getElementById('canvas-wrap').classList.toggle('vision-active', e.target.checked);
    };
  }

  log(msg) {
    const time = this.game.env.formattedTime();
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
    this.logEl.prepend(div);
    while (this.logEl.children.length > 60) this.logEl.removeChild(this.logEl.lastChild);
  }

  update(cat, env) {
    for (const k in this.gauges) {
      const v = cat.stats[k];
      this.gauges[k].style.width = v + '%';
      this.gauges[k].style.background = this.colorFor(v);
    }
    this.obstinacyEl.textContent = Math.round(cat.obstinacy) + '%';
    this.moodEl.textContent = cat.mood;
    this.tempEl.textContent = cat.temperament;
    this.clockEl.textContent = env.formattedTime() + (env.isDaytime() ? ' ☀️' : ' 🌙');
    this.stateEl.textContent = 'État: ' + cat.state;
  }

  colorFor(v) {
    if (v < 25) return '#e53935';
    if (v < 50) return '#fb8c00';
    if (v < 75) return '#fdd835';
    return '#43a047';
  }
}

/* ============================================================
   GAME — Boucle principale & orchestration
   ============================================================ */
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.env = new Environment();
    this.cat = new Cat(this.env, 'Milo');
    this.visionMode = false;
    this.ui = new UI(this);
    this.cat.log = (msg) => this.ui.log(msg);

    this.lastTime = performance.now();
    this.eventCooldown = rand(15, 30);
    this.vacuumObject = null;
    this.zoomiesTriggeredToday = false;

    this.ui.log(`${this.cat.name} ouvre un œil. Tempérament : ${this.cat.temperament}. Obstination : ${Math.round(this.cat.obstinacy)}%.`);
    requestAnimationFrame(this.loop.bind(this));
  }

  userAction(action) { this.cat.reactToUserAction(action); }

  /* Paradoxe du Carton : chaque nouvel objet génère systématiquement un carton */
  spawnNewObjectWithBox() {
    const x = rand(150, 650);
    this.env.addObject(new InteractiveObject('newobj', x, FLOOR_Y, { attraction: 40, label: 'Jouet neuf' }));
    this.env.addObject(new InteractiveObject('box', x + 25, FLOOR_Y, { attraction: 100, label: 'Carton' }));
    this.ui.log('Un nouveau jouet est déposé... accompagné d\'un carton. On sait déjà qui va gagner.');
  }

  triggerVacuum() {
    if (this.vacuumObject) return;
    const vx = rand(200, 600);
    this.vacuumObject = this.env.addObject(new InteractiveObject('vacuum', vx, FLOOR_Y, { anxiogenic: true, label: 'Aspirateur' }));
    this.ui.log('🌀 L\'ASPIRATEUR apparaît. Alerte rouge absolue.');
    this.cat.fleeFrom(vx);
    this.cat.memory.markZoneAnxious(this.env.zoneAt(vx, FLOOR_Y).name, this.env.gameTime, 5);
    setTimeout(() => {
      if (this.vacuumObject) {
        this.env.removeObject(this.vacuumObject);
        this.vacuumObject = null;
        this.ui.log('L\'aspirateur retourne dans son placard. Vigilance maintenue.');
      }
    }, 8000);
  }

  triggerRandomEvent() {
    const roll = Math.random();
    if (roll < 0.4) {
      this.ui.log('🪰 Une mouche frappe la vitre. Le chat vient de découvrir le sens de la vie.');
      this.cat.stats.stimulation = clamp(this.cat.stats.stimulation + 30, 0, 100);
      this.cat.pendingAction = null;
      this.cat.goTo(clamp(this.cat.x + rand(-50, 50), 20, CANVAS_W - 20), this.cat.y);
      this.cat.state = 'PLAY'; this.cat.stateTimer = 4;
    } else if (roll < 0.7) {
      this.ui.log('👻 Une ombre suspecte glisse sur le mur. Poils hérissés, posture défensive.');
      this.cat.stats.stimulation = clamp(this.cat.stats.stimulation + 15, 0, 100);
      this.cat.fleeFrom(this.cat.x + rand(-1, 1) * 100);
    } else {
      this.ui.log('🌀 Crise existentielle sans raison apparente.');
      this.cat.startZoomies();
    }
  }

  update(dt) {
    this.env.update(dt);
    this.cat.update(dt, this.env);

    // Quart d'heure de folie déclenché vers 3h du matin (temps de jeu)
    if (this.env.gameTime >= 3 && this.env.gameTime < 3.3 && !this.zoomiesTriggeredToday && !this.cat.zoomies) {
      this.zoomiesTriggeredToday = true;
      this.cat.startZoomies();
    }
    if (this.env.gameTime > 4) this.zoomiesTriggeredToday = false;

    // Événements aléatoires
    this.eventCooldown -= dt;
    if (this.eventCooldown <= 0) {
      this.eventCooldown = rand(20, 45);
      if (chance(0.5)) this.triggerRandomEvent();
    }

    this.ui.update(this.cat, this.env);
  }

  render() {
    const ctx = this.ctx;
    this.env.render(ctx, this.visionMode);
    this.cat.render(ctx, this.visionMode);
    if (this.visionMode) {
      ctx.fillStyle = 'rgba(0,60,90,0.15)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
  }

  loop(now) {
    const dt = Math.min((now - this.lastTime) / 1000, 0.1);
    this.lastTime = now;
    this.update(dt);
    this.render();
    requestAnimationFrame(this.loop.bind(this));
  }
}

window.addEventListener('load', () => { new Game(); });
</script>
